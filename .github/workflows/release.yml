          if re.fullmatch(r"[a-z0-9][a-z0-9-]{0,63}", namespace) is None or re.fullmatch(r"[a-z0-9][a-z0-9-]{0,63}", repository) is None:
              raise SystemExit("Cloudsmith coordinates are missing or invalid")
          routes = json.loads(Path("release-assets/cloudsmith-routes.json").read_text(encoding="utf-8"))
          selected = [route for route in routes if route.get("format") == "rpm"]
