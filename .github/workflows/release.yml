        run: |
          [[ "${APP_OWNER}/${APP_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "${EXPECTED_REPOSITORY_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${WORKFLOW}" =~ ^[A-Za-z0-9_.-]+\.ya?ml$ ]]
          repository="$(gh api "repos/${APP_OWNER}/${APP_REPOSITORY}")"
          test "$(jq -r '.id|tostring' <<<"${repository}")" = "${EXPECTED_REPOSITORY_ID}"
          test "$(jq -r '.full_name' <<<"${repository}")" = "${APP_OWNER}/${APP_REPOSITORY}"
          test "$(jq -r '.default_branch' <<<"${repository}")" = main
          request_uuid="$(python3 -I -S -c 'import os,uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, os.environ["GITHUB_REPOSITORY"]+":"+os.environ["TAG"]+":"+os.environ["MANIFEST_SHA256"]+":conan2"))')"
          gh api --method POST "repos/${APP_OWNER}/${APP_REPOSITORY}/actions/workflows/${WORKFLOW}/dispatches" \
            -f ref=main -f "inputs[source_tag]=${TAG}" -f "inputs[source_commit_sha]=${COMMIT}" \
            -f "inputs[github_release_id]=${RELEASE_ID}" -f "inputs[source_workflow_run_id]=${GITHUB_RUN_ID}" \
            -f "inputs[release_manifest_sha256]=${MANIFEST_SHA256}" -f "inputs[fork_branch]=${FORK_BRANCH}" \
            -f "inputs[fork_head_sha]=${FORK_HEAD_SHA}" -f "inputs[recipe_tree_sha256]=${RECIPE_TREE_SHA256}" \
            -f "inputs[request_uuid]=${request_uuid}"
      - name: Emit fixed Conan submission result
        id: result
        run: echo 'result=SUBMITTED_PENDING_REVIEW' >> "${GITHUB_OUTPUT}"

  ledger-coordinator:
    name: Update the sole release ledger
    if: ${{ always() && needs.contract.result == 'success' && needs.ledger-readiness.result == 'success' && needs.contract.outputs.mode == 'publish' }}
    needs:
      - contract
      - repository-readiness
      - ledger-readiness
      - publication-gate
      - signing
      - attestation
      - github-release
      - github-anchor
      - publish-apt
      - publish-rpm
      - aur
      - homebrew
      - chocolatey
      - conan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-github
    permissions:
      contents: read
      issues: write
    steps:
      - name: Produce a sanitized complete ledger snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.contract.outputs.version }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          LEDGER_ISSUE: ${{ needs.contract.outputs.ledger_issue }}
          MANIFEST_SHA256: ${{ needs.github-anchor.outputs.manifest_sha256 }}
          TARGETS: ${{ needs.contract.outputs.normalized_targets }}
          GITHUB_JOB_RESULT: ${{ needs.github-anchor.result }}
          GITHUB_RESULT: ${{ needs.github-anchor.outputs.result }}
          APT_JOB_RESULT: ${{ needs.publish-apt.result }}
          APT_RESULT: ${{ needs.publish-apt.outputs.result }}
          RPM_JOB_RESULT: ${{ needs.publish-rpm.result }}
          RPM_RESULT: ${{ needs.publish-rpm.outputs.result }}
          AUR_JOB_RESULT: ${{ needs.aur.result }}
          AUR_RESULT: ${{ needs.aur.outputs.result }}
          HOMEBREW_JOB_RESULT: ${{ needs.homebrew.result }}
          HOMEBREW_RESULT: ${{ needs.homebrew.outputs.result }}
          CHOCOLATEY_JOB_RESULT: ${{ needs.chocolatey.result }}
          CHOCOLATEY_RESULT: ${{ needs.chocolatey.outputs.result }}
          CONAN_JOB_RESULT: ${{ needs.conan.result }}
          CONAN_RESULT: ${{ needs.conan.outputs.result }}
        run: |
          gh api "repos/${REPOSITORY}/issues/${LEDGER_ISSUE}" --jq .body > previous-body.txt
          python3 -I -S <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          destinations = {
              "github": ("github", "GITHUB"),
              "conan2": ("conan2", "CONAN"),
              "deb_apt": ("apt", "APT"),
              "rpm": ("rpm", "RPM"),
              "arch_aur": ("aur", "AUR"),
              "homebrew": ("homebrew", "HOMEBREW"),
              "chocolatey": ("chocolatey", "CHOCOLATEY"),
          }
          allowed = {
              "PUBLISHED", "SUBMITTED_PENDING_REVIEW", "SUBMITTED_PENDING_MODERATION",
              "BLOCKED_MANUAL_ACTION", "FAILED", "SKIPPED_ALREADY_IDENTICAL", "FIRST_USE_UNPROVEN", "LIVE",
          }
          previous = Path("previous-body.txt").read_text(encoding="utf-8")
          match = re.search(r"<!-- release-ledger-json\n(\{.*?\})\nrelease-ledger-json -->", previous, re.DOTALL)
          results = {name: "FIRST_USE_UNPROVEN" for name in destinations}
          prior_manifest = None
          if match:
              prior = json.loads(match.group(1))
              if prior.get("tag") != os.environ["TAG"] or prior.get("source_commit_sha") != os.environ["COMMIT"]:
                  raise SystemExit("existing ledger identity conflicts with this dispatch")
              prior_results = prior.get("results")
              if not isinstance(prior_results, dict) or set(prior_results) != set(destinations):
                  raise SystemExit("existing ledger results are malformed")
              if any(value not in allowed for value in prior_results.values()):
                  raise SystemExit("existing ledger contains an unknown result")
              results.update(prior_results)
              prior_manifest = prior.get("release_manifest_sha256")
          selected = set(os.environ["TARGETS"].split(","))
          for destination, (target, prefix) in destinations.items():
              if target not in selected and destination != "github":
                  continue
              job_result = os.environ.get(f"{prefix}_JOB_RESULT", "")
              result = os.environ.get(f"{prefix}_RESULT", "")
              if job_result == "success" and result in allowed:
                  results[destination] = result
              elif target in selected or destination == "github":
                  results[destination] = "FAILED"
          manifest = os.environ["MANIFEST_SHA256"]
          if re.fullmatch(r"[0-9a-f]{64}", manifest) is None:
              prior_is_valid = isinstance(prior_manifest, str) and re.fullmatch(
                  r"[0-9a-f]{64}", prior_manifest
              )
              manifest = prior_manifest if prior_is_valid else "0" * 64
          ledger = {
              "schema_version": 1, "version": os.environ["VERSION"], "tag": os.environ["TAG"],
              "source_commit_sha": os.environ["COMMIT"], "release_manifest_sha256": manifest,
              "results": results,
          }
          marker = f"<!-- release-ledger:v1 tag={os.environ['TAG']} state=PREPARING -->"
          state = "FAILED" if any(results[dest] == "FAILED" for dest in destinations) else "PUBLISHED_OR_PENDING"
          body = (
              f"{marker}\n\nRelease publication state: **{state}**\n\n"
              f"Workflow run: https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n\n"
              "<!-- release-ledger-json\n" + json.dumps(ledger, sort_keys=True, separators=(",", ":"))
              + "\nrelease-ledger-json -->\n"
          )
          Path("ledger-body.md").write_text(body, encoding="utf-8")
          PY
          gh issue edit "${LEDGER_ISSUE}" --repo "${REPOSITORY}" \
            --title "[release] ${TAG} PREPARING" --body-file ledger-body.md
