      - name: Download the exact ledger authorization record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ledger-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ledger-readiness
      - name: Merge the signed version entry with the exact upstream recipe
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          APP_OWNER: ${{ vars.CONAN_RECIPE_APP_OWNER }}
          APP_REPOSITORY: ${{ vars.CONAN_RECIPE_APP_REPOSITORY }}
          EXPECTED_REPOSITORY_ID: ${{ vars.CONAN_RECIPE_APP_REPOSITORY_ID }}
          VERSION: ${{ needs.contract.outputs.version }}
        run: bash scripts/release/prepare_conan_recipe.sh
      - name: Recheck ledger authorization before requesting fork credentials
        if: ${{ steps.merge.outputs.state == 'prepared' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LEDGER_ISSUE: ${{ needs.contract.outputs.ledger_issue }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          LEDGER_BOT_ID: ${{ vars.RELEASE_LEDGER_BOT_ID }}
          LEDGER_BOT_LOGIN: ${{ vars.RELEASE_LEDGER_BOT_LOGIN }}
          LEDGER_BOT_ASSOCIATION: ${{ vars.RELEASE_LEDGER_BOT_ASSOCIATION }}
          LEDGER_READINESS_SHA256: ${{ needs.ledger-readiness.outputs.ledger_readiness_sha256 }}
          LEDGER_READINESS_FILE: ledger-readiness/ledger-readiness.json
        run: bash scripts/release/recheck_ledger.sh
      - name: Create a fork-scoped recipe App token
        id: app
        if: ${{ steps.merge.outputs.state == 'prepared' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CONAN_RECIPE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONAN_RECIPE_APP_PRIVATE_KEY }}
          owner: ${{ vars.CONAN_RECIPE_APP_OWNER }}
          repositories: ${{ vars.CONAN_RECIPE_APP_REPOSITORY }}
          permission-contents: write
      - name: Create or verify the recipe-only fork branch
        id: recipe
        if: ${{ steps.merge.outputs.state == 'prepared' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_OWNER: ${{ vars.CONAN_RECIPE_APP_OWNER }}
          APP_REPOSITORY: ${{ vars.CONAN_RECIPE_APP_REPOSITORY }}
          EXPECTED_REPOSITORY_ID: ${{ vars.CONAN_RECIPE_APP_REPOSITORY_ID }}
          VERSION: ${{ needs.contract.outputs.version }}
          FORK_BASE: ${{ steps.merge.outputs.fork_base }}
        run: bash scripts/release/publish_conan_recipe.sh
  conan:
    name: Dispatch the ConanCenter release-control App
    if: ${{ needs.contract.outputs.mode == 'publish' && needs.contract.outputs.target_conan2 == 'true' }}
    needs:
      - contract
      - repository-readiness
      - ledger-readiness
      - github-anchor
      - conan-recipe
      - preflight-conan-broker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-control-dispatch
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.result.outputs.result }}
      downstream_run_id: ${{ steps.dispatch.outputs.downstream_workflow_run_id }}
    steps:
      - name: Checkout protected current Conan dispatcher tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download and verify immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Verify fixed anchor handoff
        env:
          EXPECTED_MANIFEST: ${{ needs.github-anchor.outputs.manifest_sha256 }}
          EXPECTED_TAG: ${{ inputs.tag }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.github_publication verify-handoff
          --anchor release-assets/ANCHOR.json --tag "${EXPECTED_TAG}"
          --manifest-sha256 "${EXPECTED_MANIFEST}"
      - name: Bind Conan control destination to the signed anchor
        run: >-
          python3 -I -S scripts/run_release_tool.py release.publication_contract
          --contract release-assets/release-publication-contract.json --name conan_control
          --repository "${{ vars.CONAN_BROKER_APP_OWNER }}/${{ vars.CONAN_BROKER_APP_REPOSITORY }}"
          --repository-id "${{ vars.CONAN_BROKER_APP_REPOSITORY_ID }}"
      - name: Download the exact ledger authorization record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ledger-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ledger-readiness
      - name: Recheck ledger authorization before requesting control credentials
        if: ${{ needs.conan-recipe.outputs.state == 'prepared' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LEDGER_ISSUE: ${{ needs.contract.outputs.ledger_issue }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          LEDGER_BOT_ID: ${{ vars.RELEASE_LEDGER_BOT_ID }}
          LEDGER_BOT_LOGIN: ${{ vars.RELEASE_LEDGER_BOT_LOGIN }}
          LEDGER_BOT_ASSOCIATION: ${{ vars.RELEASE_LEDGER_BOT_ASSOCIATION }}
          LEDGER_READINESS_SHA256: ${{ needs.ledger-readiness.outputs.ledger_readiness_sha256 }}
          LEDGER_READINESS_FILE: ledger-readiness/ledger-readiness.json
        run: bash scripts/release/recheck_ledger.sh
      - name: Create least-privilege Conan release-control App token
        id: app
        if: ${{ needs.conan-recipe.outputs.state == 'prepared' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CONAN_BROKER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONAN_BROKER_APP_PRIVATE_KEY }}
          owner: ${{ vars.CONAN_BROKER_APP_OWNER }}
          repositories: ${{ vars.CONAN_BROKER_APP_REPOSITORY }}
          permission-actions: write
          permission-contents: read
      - name: Dispatch fixed Conan release-control workflow
        id: dispatch
        if: ${{ needs.conan-recipe.outputs.state == 'prepared' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_OWNER: ${{ vars.CONAN_BROKER_APP_OWNER }}
          APP_REPOSITORY: ${{ vars.CONAN_BROKER_APP_REPOSITORY }}
          EXPECTED_REPOSITORY_ID: ${{ vars.CONAN_BROKER_APP_REPOSITORY_ID }}
          WORKFLOW: ${{ vars.CONAN_BROKER_APP_WORKFLOW }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          SOURCE_WORKFLOW_HEAD_SHA: ${{ github.sha }}
          PROVIDER_CONTROL_TAG: ${{ needs.preflight-conan-broker.outputs.control_tag }}
          PROVIDER_CONTROL_SHA: ${{ needs.preflight-conan-broker.outputs.control_sha }}
          RELEASE_ID: ${{ needs.github-anchor.outputs.release_id }}
          MANIFEST_SHA256: ${{ needs.github-anchor.outputs.manifest_sha256 }}
          FORK_BRANCH: ${{ needs.conan-recipe.outputs.branch }}
          FORK_HEAD_SHA: ${{ needs.conan-recipe.outputs.head_sha }}
          RECIPE_TREE_SHA256: ${{ needs.conan-recipe.outputs.tree_sha256 }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.github_provider conan2
          --owner "${APP_OWNER}" --repository "${APP_REPOSITORY}"
          --expected-repository-id "${EXPECTED_REPOSITORY_ID}" --workflow "${WORKFLOW}"
          --source-repository "${GITHUB_REPOSITORY}" --source-tag "${TAG}"
          --source-commit-sha "${COMMIT}" --github-release-id "${RELEASE_ID}"
          --source-workflow-head-sha "${SOURCE_WORKFLOW_HEAD_SHA}"
          --provider-control-tag "${PROVIDER_CONTROL_TAG}"
          --provider-control-sha "${PROVIDER_CONTROL_SHA}"
          --source-workflow-run-id "${GITHUB_RUN_ID}"
          --release-manifest-sha256 "${MANIFEST_SHA256}"
          --fork-branch "${FORK_BRANCH}" --fork-head-sha "${FORK_HEAD_SHA}"
          --recipe-tree-sha256 "${RECIPE_TREE_SHA256}"
          --github-output "${GITHUB_OUTPUT}"
      - name: Emit fixed Conan dispatch result
        id: result
        env:
          RECIPE_STATE: ${{ needs.conan-recipe.outputs.state }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.workflow_gate conan-result
          --state "${RECIPE_STATE}" --github-output "${GITHUB_OUTPUT}"

  ledger-coordinator:
    name: Append the bot-authenticated release ledger
    if: ${{ always() && needs.contract.result == 'success' && needs.ledger-readiness.result == 'success' && needs.contract.outputs.mode == 'publish' }}
    needs:
      - contract
      - repository-readiness
      - ledger-readiness
      - publication-gate
      - signing
      - attestation
      - github-release
      - github-anchor
      - publish-apt
      - publish-rpm
      - aur
      - homebrew
      - chocolatey
      - conan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-ledger
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout protected current ledger tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download the exact ledger authorization record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ledger-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ledger-readiness
      - name: Recheck ledger authorization before requesting ledger credentials
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LEDGER_ISSUE: ${{ needs.contract.outputs.ledger_issue }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          LEDGER_BOT_ID: ${{ vars.RELEASE_LEDGER_BOT_ID }}
          LEDGER_BOT_LOGIN: ${{ vars.RELEASE_LEDGER_BOT_LOGIN }}
          LEDGER_BOT_ASSOCIATION: ${{ vars.RELEASE_LEDGER_BOT_ASSOCIATION }}
          LEDGER_READINESS_SHA256: ${{ needs.ledger-readiness.outputs.ledger_readiness_sha256 }}
          LEDGER_READINESS_FILE: ledger-readiness/ledger-readiness.json
        run: bash scripts/release/recheck_ledger.sh
      - name: Create the ledger-only GitHub App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_LEDGER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_LEDGER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
      - name: Construct the complete canonical observation set
        env:
          CHANNELS: ${{ needs.contract.outputs.normalized_channels }}
          MANIFEST_SHA256: ${{ needs.github-anchor.outputs.manifest_sha256 }}
          GITHUB_JOB_RESULT: ${{ needs.github-anchor.result }}
          GITHUB_RESULT: ${{ needs.github-anchor.outputs.result }}
          CONAN_JOB_RESULT: ${{ needs.conan.result }}
          CONAN_RESULT: ${{ needs.conan.outputs.result }}
          APT_JOB_RESULT: ${{ needs.publish-apt.result }}
          APT_RESULT: ${{ needs.publish-apt.outputs.result }}
          RPM_JOB_RESULT: ${{ needs.publish-rpm.result }}
          RPM_RESULT: ${{ needs.publish-rpm.outputs.result }}
          AUR_JOB_RESULT: ${{ needs.aur.result }}
          AUR_RESULT: ${{ needs.aur.outputs.result }}
          HOMEBREW_JOB_RESULT: ${{ needs.homebrew.result }}
          HOMEBREW_RESULT: ${{ needs.homebrew.outputs.result }}
          CHOCOLATEY_JOB_RESULT: ${{ needs.chocolatey.result }}
          CHOCOLATEY_RESULT: ${{ needs.chocolatey.outputs.result }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.ledger_updates
          --channels "${CHANNELS}" --manifest-sha256 "${MANIFEST_SHA256}" --output ledger-updates.json
          --github-conclusion "${GITHUB_JOB_RESULT}" --github-result "${GITHUB_RESULT}"
          --conan2-conclusion "${CONAN_JOB_RESULT}" --conan2-result "${CONAN_RESULT}"
          --deb-apt-conclusion "${APT_JOB_RESULT}" --deb-apt-result "${APT_RESULT}"
          --rpm-conclusion "${RPM_JOB_RESULT}" --rpm-result "${RPM_RESULT}"
          --arch-aur-conclusion "${AUR_JOB_RESULT}" --arch-aur-result "${AUR_RESULT}"
          --homebrew-conclusion "${HOMEBREW_JOB_RESULT}" --homebrew-result "${HOMEBREW_RESULT}"
          --chocolatey-conclusion "${CHOCOLATEY_JOB_RESULT}" --chocolatey-result "${CHOCOLATEY_RESULT}"
      - name: Recheck and append exactly one ledger snapshot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          LEDGER_ISSUE: ${{ needs.contract.outputs.ledger_issue }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          LEDGER_BOT_ID: ${{ vars.RELEASE_LEDGER_BOT_ID }}
          LEDGER_BOT_LOGIN: ${{ vars.RELEASE_LEDGER_BOT_LOGIN }}
          LEDGER_BOT_ASSOCIATION: ${{ vars.RELEASE_LEDGER_BOT_ASSOCIATION }}
          LEDGER_READINESS_SHA256: ${{ needs.ledger-readiness.outputs.ledger_readiness_sha256 }}
          LEDGER_READINESS_FILE: ledger-readiness/ledger-readiness.json
          LEDGER_UPDATES_FILE: ledger-updates.json
        run: bash scripts/release/append_ledger.sh
