              if any(re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,199}", route[key]) is None for key in ("asset", "distribution", "release")):
                  raise SystemExit("RPM route contains an unsafe coordinate")
              path = Path("release-assets") / route["asset"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              query = f"filename:{route['asset']} AND format:rpm AND distribution:{route['distribution']}/{route['release']}"
              listing = subprocess.run(
                  ["cloudsmith", "list", "packages", f"{namespace}/{repository}", "-F", "json", "--page-all", "-q", query],
                  check=True, text=True, stdout=subprocess.PIPE,
              )
              payload = json.loads(listing.stdout)
              if not isinstance(payload, dict) or not isinstance(payload.get("data"), list):
                  raise SystemExit("Cloudsmith returned an unexpected package-list schema")
              exact = [item for item in payload["data"] if item.get("filename") == route["asset"]]
              if len(exact) > 1:
                  raise SystemExit("Cloudsmith contains an ambiguous duplicate RPM identity")
              if exact:
                  if exact[0].get("checksum_sha256") != digest:
                      raise SystemExit("Cloudsmith RPM identity exists with a different SHA-256")
                  continue
              subprocess.run(["cloudsmith", "push", "rpm", f"{namespace}/{repository}/{route['distribution']}/{route['release']}", str(path)], check=True)
              published = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"result={'PUBLISHED' if published else 'SKIPPED_ALREADY_IDENTICAL'}\n")
          PY

  aur:
    name: Publish the AUR source package
    if: ${{ needs.contract.outputs.target_aur == 'true' }}
    needs:
      - contract
      - github-anchor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-aur
    permissions:
      contents: read
    outputs:
      result: ${{ steps.publish.outputs.result }}
    steps:
      - name: Download and verify immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Verify fixed anchor handoff
        env:
          EXPECTED_MANIFEST: ${{ needs.github-anchor.outputs.manifest_sha256 }}
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          python3 -I -S <<'PY'
          import json, os
          from pathlib import Path
          anchor = json.loads(Path("release-assets/ANCHOR.json").read_text(encoding="utf-8"))
          if anchor.get("manifest_sha256") != os.environ["EXPECTED_MANIFEST"] or anchor.get("tag") != os.environ["EXPECTED_TAG"]:
              raise SystemExit("verified artifact handoff does not match the immutable anchor")
          PY
      - name: Publish exact reviewed AUR metadata
        id: publish
        env:
          AUR_SSH_PRIVATE_KEY_B64: ${{ secrets.AUR_SSH_PRIVATE_KEY_B64 }}
          AUR_SSH_KEY_PASSPHRASE: ${{ secrets.AUR_SSH_KEY_PASSPHRASE }}
          AUR_KNOWN_HOSTS: ${{ vars.AUR_KNOWN_HOSTS }}
          VERSION: ${{ needs.contract.outputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          install -d -m 700 "${HOME}/.ssh"
          umask 077
          askpass="${RUNNER_TEMP}/aur-ssh-askpass"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "${HOME}/.ssh/id_ed25519" "${HOME}/.ssh/known_hosts" "${askpass}"' EXIT
          printf '%s\n' "${AUR_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          grep -E '^aur\.archlinux\.org[ ,]' "${HOME}/.ssh/known_hosts" >/dev/null
          printf '%s' "${AUR_SSH_PRIVATE_KEY_B64}" | base64 --decode > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          test -n "${AUR_SSH_KEY_PASSPHRASE}"
          printf '%s\n' '#!/bin/sh' 'printf "%s\\n" "${AUR_SSH_KEY_PASSPHRASE}"' > "${askpass}"
          chmod 700 "${askpass}"
          export SSH_ASKPASS="${askpass}" SSH_ASKPASS_REQUIRE=force DISPLAY=release
          eval "$(ssh-agent -s)"
          ssh-add "${HOME}/.ssh/id_ed25519" </dev/null
          unset AUR_SSH_KEY_PASSPHRASE SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY
          rm -f "${askpass}"
          export GIT_SSH_COMMAND="ssh -F /dev/null -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts"
          git clone --no-checkout ssh://aur@aur.archlinux.org/mcp-cpp-sdk.git aur-repository
          cd aur-repository
          git checkout HEAD -- . || true
          python3 -I -S <<'PY'
          import os
          from pathlib import Path
          import re

          package_build = Path("PKGBUILD")
          if package_build.is_file():
              match = re.search(
                  r"(?m)^pkgver=([0-9]+)\.([0-9]+)\.([0-9]+)$",
                  package_build.read_text(encoding="utf-8"),
              )
              if match is None:
                  raise SystemExit("existing AUR pkgver is missing or noncanonical")
              remote = tuple(int(part) for part in match.groups())
              target = tuple(int(part) for part in os.environ["VERSION"].split("."))
              if remote > target:
                  raise SystemExit("refusing to replace a newer AUR package version")
          PY
          if [[ -f PKGBUILD ]] && grep -Fx "pkgver=${VERSION}" PKGBUILD >/dev/null; then
            if cmp -s PKGBUILD ../release-assets/aur-PKGBUILD && cmp -s .SRCINFO ../release-assets/aur-SRCINFO; then
              echo 'result=SKIPPED_ALREADY_IDENTICAL' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::error::AUR already contains this version with different metadata"
            exit 1
          fi
          install -m 644 ../release-assets/aur-PKGBUILD PKGBUILD
          install -m 644 ../release-assets/aur-SRCINFO .SRCINFO
          git config user.name mcp-cpp-sdk-release
          git config user.email releases@users.noreply.github.com
          git add -- PKGBUILD .SRCINFO
          git commit -m "mcp-cpp-sdk ${TAG}"
          git push origin HEAD:master
          echo 'result=PUBLISHED' >> "${GITHUB_OUTPUT}"

  homebrew:
    name: Dispatch the Homebrew App publisher
    if: ${{ needs.contract.outputs.target_homebrew == 'true' }}
    needs:
      - contract
      - repository-readiness
      - github-anchor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-homebrew
    permissions:
      contents: read
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - name: Download and verify immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Verify fixed anchor handoff
        env:
          EXPECTED_MANIFEST: ${{ needs.github-anchor.outputs.manifest_sha256 }}
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          python3 -I -S <<'PY'
          import json, os
          from pathlib import Path
          anchor = json.loads(Path("release-assets/ANCHOR.json").read_text(encoding="utf-8"))
          if anchor.get("manifest_sha256") != os.environ["EXPECTED_MANIFEST"] or anchor.get("tag") != os.environ["EXPECTED_TAG"]:
              raise SystemExit("verified artifact handoff does not match the immutable anchor")
          PY
      - name: Create least-privilege Homebrew App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ vars.HOMEBREW_APP_OWNER }}
          repositories: ${{ vars.HOMEBREW_APP_REPOSITORY }}
          permission-actions: write
          permission-contents: write
          permission-pull-requests: write
      - name: Create or verify the exact formula pull request
        id: formula
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_OWNER: ${{ vars.HOMEBREW_APP_OWNER }}
          APP_REPOSITORY: ${{ vars.HOMEBREW_APP_REPOSITORY }}
          EXPECTED_REPOSITORY_ID: ${{ vars.HOMEBREW_APP_REPOSITORY_ID }}
          TAG: ${{ inputs.tag }}
        run: |
          target="${APP_OWNER}/${APP_REPOSITORY}"
          [[ "${target}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "${EXPECTED_REPOSITORY_ID}" =~ ^[1-9][0-9]*$ ]]
          repository="$(gh api "repos/${target}")"
          test "$(jq -r '.id|tostring' <<<"${repository}")" = "${EXPECTED_REPOSITORY_ID}"
          test "$(jq -r '.full_name' <<<"${repository}")" = "${target}"
          test "$(jq -r '.default_branch' <<<"${repository}")" = main

          formula=release-assets/homebrew-mcp-cpp-sdk.rb
          test -s "${formula}"
          branch="release/mcp-cpp-sdk-${TAG}"
          refs="$(gh api "repos/${target}/git/matching-refs/heads/${branch}")"
          exact_count="$(jq --arg ref "refs/heads/${branch}" '[.[] | select(.ref == $ref)] | length' <<<"${refs}")"
          if [[ "${exact_count}" == 0 ]]; then
            base_commit="$(gh api "repos/${target}/git/ref/heads/main" --jq '.object.sha')"
            base_tree="$(gh api "repos/${target}/git/commits/${base_commit}" --jq '.tree.sha')"
            content="$(base64 -w0 "${formula}")"
            blob="$(gh api --method POST "repos/${target}/git/blobs" \
              -f content="${content}" -f encoding=base64 --jq .sha)"
            tree="$(jq -n --arg base "${base_tree}" --arg blob "${blob}" \
              '{base_tree:$base,tree:[{path:"Formula/mcp-cpp-sdk.rb",mode:"100644",type:"blob",sha:$blob}]}' |
              gh api --method POST "repos/${target}/git/trees" --input - --jq .sha)"
            head="$(jq -n --arg message "release: prepare ${TAG}" --arg tree "${tree}" --arg parent "${base_commit}" \
              '{message:$message,tree:$tree,parents:[$parent]}' |
              gh api --method POST "repos/${target}/git/commits" --input - --jq .sha)"
            gh api --method POST "repos/${target}/git/refs" \
              -f ref="refs/heads/${branch}" -f sha="${head}" >/dev/null
          elif [[ "${exact_count}" == 1 ]]; then
            head="$(jq -r --arg ref "refs/heads/${branch}" '.[] | select(.ref == $ref) | .object.sha' <<<"${refs}")"
            gh api "repos/${target}/contents/Formula/mcp-cpp-sdk.rb?ref=${branch}" --jq .content |
              tr -d '\n' | base64 --decode > remote-formula.rb
            cmp --silent "${formula}" remote-formula.rb
          else
            echo "::error::Ambiguous Homebrew formula branch identity"
            exit 1
          fi

          changed="$(gh api "repos/${target}/compare/main...${head}" --jq '.files[].filename')"
          test "${changed}" = Formula/mcp-cpp-sdk.rb
          pulls="$(gh api --method GET "repos/${target}/pulls" \
            -f state=all -f head="${APP_OWNER}:${branch}" -f base=main -f per_page=100)"
          test "$(jq 'length' <<<"${pulls}")" -le 1
          if [[ "$(jq 'length' <<<"${pulls}")" == 0 ]]; then
            pull="$(gh api --method POST "repos/${target}/pulls" \
              -f title="mcp-cpp-sdk ${TAG}" -f head="${branch}" -f base=main \
              -f body="Prepare the immutable ${TAG} source for trusted bottle construction.")"
          else
            pull="$(jq '.[0]' <<<"${pulls}")"
          fi
          test "$(jq -r '.state' <<<"${pull}")" = open
          test "$(jq -r '.head.sha' <<<"${pull}")" = "${head}"
          test "$(jq -r '.user.type' <<<"${pull}")" = Bot
          {
            echo "formula_pr_number=$(jq -r '.number' <<<"${pull}")"
            echo "formula_branch=${branch}"
            echo "formula_head_sha=${head}"
          } >> "${GITHUB_OUTPUT}"
      - name: Dispatch fixed Homebrew publisher workflow
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_OWNER: ${{ vars.HOMEBREW_APP_OWNER }}
          APP_REPOSITORY: ${{ vars.HOMEBREW_APP_REPOSITORY }}
          WORKFLOW: ${{ vars.HOMEBREW_APP_WORKFLOW }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          RELEASE_ID: ${{ needs.github-anchor.outputs.release_id }}
          MANIFEST_SHA256: ${{ needs.github-anchor.outputs.manifest_sha256 }}
          FORMULA_PR_NUMBER: ${{ steps.formula.outputs.formula_pr_number }}
          FORMULA_BRANCH: ${{ steps.formula.outputs.formula_branch }}
          FORMULA_HEAD_SHA: ${{ steps.formula.outputs.formula_head_sha }}
        run: |
          [[ "${APP_OWNER}/${APP_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "${WORKFLOW}" =~ ^[A-Za-z0-9_.-]+\.ya?ml$ ]]
          request_uuid="$(python3 -I -S -c 'import os,uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, os.environ["GITHUB_REPOSITORY"]+":"+os.environ["TAG"]+":"+os.environ["MANIFEST_SHA256"]+":homebrew"))')"
          gh api --method POST "repos/${APP_OWNER}/${APP_REPOSITORY}/actions/workflows/${WORKFLOW}/dispatches" \
            -f ref=main -f "inputs[source_tag]=${TAG}" -f "inputs[source_commit_sha]=${COMMIT}" \
            -f "inputs[github_release_id]=${RELEASE_ID}" -f "inputs[source_workflow_run_id]=${GITHUB_RUN_ID}" \
            -f "inputs[release_manifest_sha256]=${MANIFEST_SHA256}" \
            -f "inputs[formula_pr_number]=${FORMULA_PR_NUMBER}" -f "inputs[formula_branch]=${FORMULA_BRANCH}" \
            -f "inputs[formula_head_sha]=${FORMULA_HEAD_SHA}" -f "inputs[request_uuid]=${request_uuid}"
      - name: Emit fixed Homebrew submission result
        id: result
        run: echo 'result=SUBMITTED_PENDING_REVIEW' >> "${GITHUB_OUTPUT}"

  chocolatey:
