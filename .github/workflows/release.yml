          --contract release-assets/release-publication-contract.json --name conan_control
          --repository "${{ vars.CONAN_BROKER_APP_OWNER }}/${{ vars.CONAN_BROKER_APP_REPOSITORY }}"
          --repository-id "${{ vars.CONAN_BROKER_APP_REPOSITORY_ID }}"
      - name: Create least-privilege Conan release-control App token
        id: app
        if: ${{ needs.conan-recipe.outputs.state == 'prepared' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CONAN_BROKER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONAN_BROKER_APP_PRIVATE_KEY }}
          owner: ${{ vars.CONAN_BROKER_APP_OWNER }}
          repositories: ${{ vars.CONAN_BROKER_APP_REPOSITORY }}
          permission-actions: write
          permission-contents: read
      - name: Dispatch fixed Conan release-control workflow
        id: dispatch
        if: ${{ needs.conan-recipe.outputs.state == 'prepared' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_OWNER: ${{ vars.CONAN_BROKER_APP_OWNER }}
          APP_REPOSITORY: ${{ vars.CONAN_BROKER_APP_REPOSITORY }}
          EXPECTED_REPOSITORY_ID: ${{ vars.CONAN_BROKER_APP_REPOSITORY_ID }}
          WORKFLOW: ${{ vars.CONAN_BROKER_APP_WORKFLOW }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          SOURCE_WORKFLOW_HEAD_SHA: ${{ github.sha }}
          PROVIDER_CONTROL_TAG: ${{ needs.preflight-conan-broker.outputs.control_tag }}
          PROVIDER_CONTROL_SHA: ${{ needs.preflight-conan-broker.outputs.control_sha }}
          RELEASE_ID: ${{ needs.github-anchor.outputs.release_id }}
          MANIFEST_SHA256: ${{ needs.github-anchor.outputs.manifest_sha256 }}
          FORK_BRANCH: ${{ needs.conan-recipe.outputs.branch }}
          FORK_HEAD_SHA: ${{ needs.conan-recipe.outputs.head_sha }}
          RECIPE_TREE_SHA256: ${{ needs.conan-recipe.outputs.tree_sha256 }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.github_provider conan2
          --owner "${APP_OWNER}" --repository "${APP_REPOSITORY}"
          --expected-repository-id "${EXPECTED_REPOSITORY_ID}" --workflow "${WORKFLOW}"
          --source-repository "${GITHUB_REPOSITORY}" --source-tag "${TAG}"
          --source-commit-sha "${COMMIT}" --github-release-id "${RELEASE_ID}"
          --source-workflow-head-sha "${SOURCE_WORKFLOW_HEAD_SHA}"
          --provider-control-tag "${PROVIDER_CONTROL_TAG}"
          --provider-control-sha "${PROVIDER_CONTROL_SHA}"
          --source-workflow-run-id "${GITHUB_RUN_ID}"
          --release-manifest-sha256 "${MANIFEST_SHA256}"
          --fork-branch "${FORK_BRANCH}" --fork-head-sha "${FORK_HEAD_SHA}"
          --recipe-tree-sha256 "${RECIPE_TREE_SHA256}"
          --github-output "${GITHUB_OUTPUT}"
      - name: Emit fixed Conan dispatch result
        id: result
        env:
          RECIPE_STATE: ${{ needs.conan-recipe.outputs.state }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.workflow_gate conan-result
          --state "${RECIPE_STATE}" --github-output "${GITHUB_OUTPUT}"
