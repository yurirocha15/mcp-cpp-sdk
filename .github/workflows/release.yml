name: Release

run-name: "release ${{ inputs.tag }} (${{ inputs.operation }})"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact annotated release tag, for example v0.2.0 (dry-run: the tag need not exist)"
        required: true
        type: string
      operation:
        description: "dry-run validates main without the tag; publish builds GitHub + complete stable bundle; checkboxes only gate external publishing"
        required: true
        type: choice
        options:
          - dry-run
          - validate-selected
          - validate-all
          - publish-selected
          - publish-all
      conan2:
        description: "ConanCenter recipe PR"
        required: true
        default: false
        type: boolean
      apt:
        description: "Cloudsmith APT repositories"
        required: true
        default: false
        type: boolean
      rpm:
        description: "Cloudsmith RPM repositories"
        required: true
        default: false
        type: boolean
      aur:
        description: "Arch User Repository"
        required: true
        default: false
        type: boolean
      homebrew:
        description: "Homebrew tap PR and bottles"
        required: true
        default: false
        type: boolean
      chocolatey:
        description: "Chocolatey Community submission"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: release-publishing
  cancel-in-progress: false

env:
  RELEASE_ARTIFACT_RETENTION_DAYS: "30"

jobs:
  contract:
    name: Validate dispatch contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.contract.outputs.mode }}
      dry_run: ${{ steps.contract.outputs.dry_run }}
      version: ${{ steps.contract.outputs.version }}
      release_kind: ${{ steps.contract.outputs.release_kind }}
      cloudsmith_matrix: ${{ steps.contract.outputs.cloudsmith_matrix }}
      target_conan2: ${{ steps.contract.outputs.target_conan2 }}
      target_apt: ${{ steps.contract.outputs.target_apt }}
      target_rpm: ${{ steps.contract.outputs.target_rpm }}
      target_aur: ${{ steps.contract.outputs.target_aur }}
      target_homebrew: ${{ steps.contract.outputs.target_homebrew }}
      target_chocolatey: ${{ steps.contract.outputs.target_chocolatey }}
    steps:
      - name: Checkout protected contract validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate untrusted dispatch inputs
        id: contract
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
          DISPATCH_CONAN2: ${{ inputs.conan2 }}
          DISPATCH_APT: ${{ inputs.apt }}
          DISPATCH_RPM: ${{ inputs.rpm }}
          DISPATCH_AUR: ${{ inputs.aur }}
          DISPATCH_HOMEBREW: ${{ inputs.homebrew }}
          DISPATCH_CHOCOLATEY: ${{ inputs.chocolatey }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_OWNER_ID: ${{ github.repository_owner_id }}
          EXPECTED_REPOSITORY: ${{ vars.RELEASE_EXPECTED_REPOSITORY }}
          EXPECTED_REPOSITORY_ID: ${{ vars.RELEASE_EXPECTED_REPOSITORY_ID }}
          EXPECTED_OWNER_ID: ${{ vars.RELEASE_EXPECTED_OWNER_ID }}
        run: python3 -I -S scripts/release_dispatch_contract.py

  policy:
    name: Offline release workflow policy
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run offline policy and release-tool tests
        run: |
          python3 scripts/check_release_workflow.py
          PYTHONPATH=scripts python3 -m unittest -v \
            scripts/test_release_dispatch_contract.py \
            scripts/test_release_workflow_policy.py
          python3 -m unittest discover -s test/release -p 'test_*.py' -v
      - name: Lint all GitHub Actions workflows
        run: scripts/release/lint_workflows.sh

  repository-readiness:
    name: Validate tagged release identity
    needs:
      - contract
      - policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.readiness.outputs.commit }}
      tag_object_sha: ${{ steps.readiness.outputs.tag_object_sha }}
      source_date_epoch: ${{ steps.readiness.outputs.source_date_epoch }}
      anchor_exists: ${{ steps.anchor.outputs.anchor_exists }}
      native_matrix: ${{ steps.readiness.outputs.native_matrix }}
      aur_builder: ${{ steps.readiness.outputs.aur_builder }}
      conan_builder: ${{ steps.readiness.outputs.conan_builder }}
    steps:
      - name: Checkout source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Probe the exact immutable release anchor
        id: anchor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          TAG: ${{ inputs.tag }}
        run: |
          value="$(python3 -I -S scripts/run_release_tool.py release.github_publication \
            probe-existing-release --repository "${REPOSITORY}" \
            --repository-id "${REPOSITORY_ID}" --tag "${TAG}")"
          [[ "${value}" == true || "${value}" == false ]]
          echo "anchor_exists=${value}" >>"${GITHUB_OUTPUT}"
      - name: Verify version, annotated tag, signature, and changelog
        id: readiness
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_VERSION: ${{ needs.contract.outputs.version }}
          DISPATCH_HEAD_SHA: ${{ github.sha }}
          ANCHOR_EXISTS: ${{ steps.anchor.outputs.anchor_exists }}
          DRY_RUN: ${{ needs.contract.outputs.dry_run }}
          PRIMARY_FINGERPRINT: ${{ vars.RELEASE_PRIMARY_FINGERPRINT }}
          TAG_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_TAG_SUBKEY_FINGERPRINT }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.repository_readiness
          --tag "${DISPATCH_TAG}" --version "${DISPATCH_VERSION}"
          --dispatch-head-sha "${DISPATCH_HEAD_SHA}"
          --anchor-exists "${ANCHOR_EXISTS}"
          --dry-run "${DRY_RUN}"
          --primary-fingerprint "${PRIMARY_FINGERPRINT}"
          --tag-fingerprint "${TAG_SUBKEY_FINGERPRINT}"
          --artifact-fingerprint "${ARTIFACT_SUBKEY_FINGERPRINT}"
          --public-key keys/release-signing-key.asc
          --trusted-signers release/trusted-release-signers.json
          --targets packaging/targets.json
          --native-builder-lock release/native-builders/lock.json
          --github-output "${GITHUB_OUTPUT}"
  immutability-gate:
    name: Verify immutable Releases and protected annotated tags
    needs:
      - contract
      - repository-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-admin-read
    permissions:
      contents: read
    steps:
      - name: Checkout protected current immutability policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create a repository-administration read token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_ADMIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_ADMIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: read
      - name: Require immutable Releases and a non-bypassable release-tag ruleset
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RULESET_ID: ${{ vars.RELEASE_TAG_RULESET_ID }}
          RULESET_UPDATED_AT: ${{ vars.RELEASE_TAG_RULESET_UPDATED_AT }}
          TAG: ${{ inputs.tag }}
          TAG_OBJECT_SHA: ${{ needs.repository-readiness.outputs.tag_object_sha }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          DRY_RUN: ${{ needs.contract.outputs.dry_run }}
        run: |
          [[ "${RULESET_ID}" =~ ^[1-9][0-9]*$ ]]
          python3 -I -S scripts/run_release_tool.py release.github_publication verify-state \
            --ruleset-id "${RULESET_ID}" \
            --ruleset-updated-at "${RULESET_UPDATED_AT}" --repository "${REPOSITORY}" \
            --tag "${TAG}" --tag-object-sha "${TAG_OBJECT_SHA}" --commit "${COMMIT}" \
            --dry-run "${DRY_RUN}"

  existing-anchor-policy:
    name: Load signed policy for an existing immutable anchor
    needs:
      - contract
      - repository-readiness
      - immutability-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.anchor.outputs.release_id }}
      manifest_sha256: ${{ steps.anchor.outputs.manifest_sha256 }}
    steps:
      - name: Checkout protected current anchor verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download and verify historical signed publication policy
        id: anchor
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.contract.outputs.version }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
          TAG_OBJECT_SHA: ${{ needs.repository-readiness.outputs.tag_object_sha }}
          PRIMARY_FINGERPRINT: ${{ vars.RELEASE_PRIMARY_FINGERPRINT }}
          TAG_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_TAG_SUBKEY_FINGERPRINT }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.github_anchor download-and-verify
          --directory existing-anchor --public-key keys/release-signing-key.asc
          --trusted-signers release/trusted-release-signers.json
          --tag "${TAG}" --version "${VERSION}" --commit "${COMMIT}"
          --repository "${REPOSITORY}"
          --tag-object-sha "${TAG_OBJECT_SHA}"
          --primary-fingerprint "${PRIMARY_FINGERPRINT}"
          --tag-fingerprint "${TAG_SUBKEY_FINGERPRINT}"
          --artifact-fingerprint "${ARTIFACT_SUBKEY_FINGERPRINT}"
          --anchor-existed true --targets packaging/targets.json
          --native-builder-lock release/native-builders/lock.json
          --conan-requirements packaging/conan-center/requirements.json
          --github-output "${GITHUB_OUTPUT}"
      - name: Preserve the historical signed policy handoff
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-existing-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: existing-anchor/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  preflight-cloudsmith:
    name: Preflight Cloudsmith routes required by this anchor or batch
    if: >-
      ${{ needs.contract.outputs.release_kind == 'stable' &&
          (needs.repository-readiness.outputs.anchor_exists == 'false' ||
           needs.contract.outputs.target_apt == 'true' ||
           needs.contract.outputs.target_rpm == 'true') }}
    needs:
      - contract
      - repository-readiness
      - immutability-gate
      - existing-anchor-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-cloudsmith
    permissions:
      contents: read
    env:
      # The CLI sends error reports to a third party unless this is set.
      CLOUDSMITH_NO_TELEMETRY: "1"
    outputs:
      namespace: ${{ steps.destination.outputs.namespace }}
      repository: ${{ steps.destination.outputs.repository }}
      repository_gpg_fingerprint: ${{ steps.destination.outputs.repository_gpg_fingerprint }}
    steps:
      - name: Checkout protected current provider policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download historical signed publication policy
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-existing-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: existing-anchor
      - name: Bind current Cloudsmith coordinates to the signed anchor
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.publication_contract
          --contract existing-anchor/release-publication-contract.json --name cloudsmith
          --namespace "${{ vars.CLOUDSMITH_NAMESPACE }}"
          --repository "${{ vars.CLOUDSMITH_REPOSITORY }}"
          --repository-gpg-fingerprint "${{ vars.CLOUDSMITH_REPOSITORY_GPG_FINGERPRINT }}"
      - name: Authenticate the pinned Cloudsmith CLI without publishing
        id: cloudsmith-cli
        uses: cloudsmith-io/cloudsmith-cli-action@69e169e2ad9bc9a1599c2dff464061a00fe9f8ba # v3.1.1
        with:
          cli-version: "1.30.0"
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
      - name: Verify the downloaded Cloudsmith CLI payload
        env:
          CLOUDSMITH_CLI_PATH: ${{ steps.cloudsmith-cli.outputs.cli-path }}
        run: bash scripts/release/verify_cloudsmith_cli.sh
      - name: Verify exact Cloudsmith repository read access
        env:
          CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
          CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
          CLOUDSMITH_REPOSITORY_GPG_FINGERPRINT: ${{ vars.CLOUDSMITH_REPOSITORY_GPG_FINGERPRINT }}
          CLOUDSMITH_USERNAME: ${{ vars.CLOUDSMITH_USERNAME }}
          TARGET_APT: ${{ needs.repository-readiness.outputs.anchor_exists == 'false' && 'true' || needs.contract.outputs.target_apt }}
          TARGET_RPM: ${{ needs.repository-readiness.outputs.anchor_exists == 'false' && 'true' || needs.contract.outputs.target_rpm }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.cloudsmith_publish preflight
          --namespace "${CLOUDSMITH_NAMESPACE}" --repository "${CLOUDSMITH_REPOSITORY}"
          --repository-gpg-fingerprint "${CLOUDSMITH_REPOSITORY_GPG_FINGERPRINT}"
          --expected-username "${CLOUDSMITH_USERNAME}"
          --apt-selected "${TARGET_APT}" --rpm-selected "${TARGET_RPM}"
          --targets packaging/targets.json
          --policy-source "${{ needs.repository-readiness.outputs.anchor_exists == 'true' && 'embedded' || 'current' }}"
          --signed-contract existing-anchor/release-publication-contract.json
      - name: Export verified public Cloudsmith destination
        id: destination
        env:
          NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
          REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
          REPOSITORY_GPG_FINGERPRINT: ${{ vars.CLOUDSMITH_REPOSITORY_GPG_FINGERPRINT }}
        run: |
          {
            echo "namespace=${NAMESPACE}"
            echo "repository=${REPOSITORY}"
            echo "repository_gpg_fingerprint=${REPOSITORY_GPG_FINGERPRINT}"
          } >>"${GITHUB_OUTPUT}"

  preflight-aur:
    name: Preflight AUR required by this anchor or batch
    if: >-
      ${{ needs.contract.outputs.release_kind == 'stable' &&
          (needs.repository-readiness.outputs.anchor_exists == 'false' ||
           needs.contract.outputs.target_aur == 'true') }}
    needs:
      - contract
      - repository-readiness
      - immutability-gate
      - existing-anchor-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-aur
    permissions:
      contents: read
    env:
      AUR_PACKAGE_BASE: mcp-cpp-sdk
      AUR_CLONE_URL: ssh://aur@aur.archlinux.org/mcp-cpp-sdk.git
    steps:
      - name: Checkout protected current provider policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download historical signed publication policy
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-existing-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: existing-anchor
      - name: Bind the AUR target to the signed anchor
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.publication_contract
          --contract existing-anchor/release-publication-contract.json --name aur
          --repository "${AUR_CLONE_URL}" --package-base "${AUR_PACKAGE_BASE}"
          --architecture x86_64
      - name: Verify the exact public AUR repository without credentials
        run: >-
          python3 -I -S scripts/run_release_tool.py release.aur_preflight
          --package "${AUR_PACKAGE_BASE}"
      - name: Authenticate to the non-mutating AUR SSH help interface
        env:
          AUR_SSH_PRIVATE_KEY_B64: ${{ secrets.AUR_SSH_PRIVATE_KEY_B64 }}
          AUR_SSH_KEY_PASSPHRASE: ${{ secrets.AUR_SSH_KEY_PASSPHRASE }}
          AUR_KNOWN_HOSTS: ${{ vars.AUR_KNOWN_HOSTS }}
        run: bash scripts/release/preflight_aur_auth.sh

  preflight-homebrew:
    name: Preflight Homebrew required by this anchor or batch
    if: >-
      ${{ needs.contract.outputs.release_kind == 'stable' &&
          (needs.repository-readiness.outputs.anchor_exists == 'false' ||
           needs.contract.outputs.target_homebrew == 'true') }}
    needs:
      - contract
      - repository-readiness
      - immutability-gate
      - existing-anchor-policy
    uses: ./.github/workflows/release-provider-preflight.yml
    with:
      provider: homebrew
      environment: release-homebrew
      anchor_existed: ${{ needs.repository-readiness.outputs.anchor_exists }}
    permissions:
      contents: read

  preflight-chocolatey:
    name: Preflight Chocolatey required by this anchor or batch
    if: >-
      ${{ needs.contract.outputs.release_kind == 'stable' &&
          (needs.repository-readiness.outputs.anchor_exists == 'false' ||
           needs.contract.outputs.target_chocolatey == 'true') }}
    needs:
      - contract
      - repository-readiness
      - immutability-gate
      - existing-anchor-policy
    uses: ./.github/workflows/release-provider-preflight.yml
    with:
      provider: chocolatey
      environment: release-chocolatey
      anchor_existed: ${{ needs.repository-readiness.outputs.anchor_exists }}
    permissions:
      contents: read

  preflight-conan-broker:
    name: Preflight ConanCenter required by this anchor or batch
    if: >-
      ${{ needs.contract.outputs.release_kind == 'stable' &&
          (needs.repository-readiness.outputs.anchor_exists == 'false' ||
           needs.contract.outputs.target_conan2 == 'true') }}
    needs:
      - contract
      - repository-readiness
      - immutability-gate
      - existing-anchor-policy
    uses: ./.github/workflows/release-provider-preflight.yml
    with:
      provider: conan
      environment: release-control-dispatch
      anchor_existed: ${{ needs.repository-readiness.outputs.anchor_exists }}
    permissions:
      contents: read

  preparation-gate:
    name: Admit validation or publication construction
    if: >-
      ${{ always() && needs.contract.result == 'success' &&
          needs.repository-readiness.result == 'success' &&
          needs.immutability-gate.result == 'success' &&
          needs.existing-anchor-policy.result == 'success' }}
    needs:
      - contract
      - repository-readiness
      - immutability-gate
      - existing-anchor-policy
      - preflight-cloudsmith
      - preflight-aur
      - preflight-homebrew
      - preflight-chocolatey
      - preflight-conan-broker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout protected current preflight gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require exact selected-success and unselected-skip results
        env:
          TARGET_CLOUDSMITH: ${{ needs.contract.outputs.release_kind == 'stable' && (needs.repository-readiness.outputs.anchor_exists == 'false' || needs.contract.outputs.target_apt == 'true' || needs.contract.outputs.target_rpm == 'true') }}
          TARGET_AUR: ${{ needs.contract.outputs.release_kind == 'stable' && (needs.repository-readiness.outputs.anchor_exists == 'false' || needs.contract.outputs.target_aur == 'true') }}
          TARGET_HOMEBREW: ${{ needs.contract.outputs.release_kind == 'stable' && (needs.repository-readiness.outputs.anchor_exists == 'false' || needs.contract.outputs.target_homebrew == 'true') }}
          TARGET_CHOCOLATEY: ${{ needs.contract.outputs.release_kind == 'stable' && (needs.repository-readiness.outputs.anchor_exists == 'false' || needs.contract.outputs.target_chocolatey == 'true') }}
          TARGET_CONAN: ${{ needs.contract.outputs.release_kind == 'stable' && (needs.repository-readiness.outputs.anchor_exists == 'false' || needs.contract.outputs.target_conan2 == 'true') }}
          RESULT_CLOUDSMITH: ${{ needs.preflight-cloudsmith.result }}
          RESULT_AUR: ${{ needs.preflight-aur.result }}
          RESULT_HOMEBREW: ${{ needs.preflight-homebrew.result }}
          RESULT_CHOCOLATEY: ${{ needs.preflight-chocolatey.result }}
          RESULT_CONAN: ${{ needs.preflight-conan-broker.result }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.provider_preflight gate
          --target-cloudsmith "${TARGET_CLOUDSMITH}" --result-cloudsmith "${RESULT_CLOUDSMITH}"
          --target-aur "${TARGET_AUR}" --result-aur "${RESULT_AUR}"
          --target-homebrew "${TARGET_HOMEBREW}" --result-homebrew "${RESULT_HOMEBREW}"
          --target-chocolatey "${TARGET_CHOCOLATEY}" --result-chocolatey "${RESULT_CHOCOLATEY}"
          --target-conan "${TARGET_CONAN}" --result-conan "${RESULT_CONAN}"
      - name: Require RELEASE_PUBLISHING_ENABLED
        if: ${{ needs.contract.outputs.mode == 'publish' }}
        env:
          RELEASE_PUBLISHING_ENABLED: ${{ vars.RELEASE_PUBLISHING_ENABLED }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.workflow_gate publishing
          --enabled "${RELEASE_PUBLISHING_ENABLED}"

  candidate:
    name: Construct and validate the complete release candidate
    if: ${{ always() && needs.preparation-gate.result == 'success' }}
    needs:
      - contract
      - repository-readiness
      - existing-anchor-policy
      - preparation-gate
      - preflight-cloudsmith
      - preflight-homebrew
      - preflight-chocolatey
      - preflight-conan-broker
    uses: ./.github/workflows/release-candidate.yml
    with:
      tag: ${{ inputs.tag }}
      version: ${{ needs.contract.outputs.version }}
      release_kind: ${{ needs.contract.outputs.release_kind }}
      anchor_exists: ${{ needs.repository-readiness.outputs.anchor_exists }}
      commit: ${{ needs.repository-readiness.outputs.commit }}
      source_date_epoch: ${{ needs.repository-readiness.outputs.source_date_epoch }}
      native_matrix: ${{ needs.repository-readiness.outputs.native_matrix }}
      aur_builder: ${{ needs.repository-readiness.outputs.aur_builder }}
      conan_builder: ${{ needs.repository-readiness.outputs.conan_builder }}
      homebrew_control_sha: ${{ needs.preflight-homebrew.outputs.control_sha }}
      homebrew_repository_id: ${{ needs.preflight-homebrew.outputs.repository_id }}
      homebrew_repository: ${{ needs.preflight-homebrew.outputs.repository }}
      chocolatey_control_sha: ${{ needs.preflight-chocolatey.outputs.control_sha }}
      chocolatey_repository_id: ${{ needs.preflight-chocolatey.outputs.repository_id }}
      chocolatey_repository: ${{ needs.preflight-chocolatey.outputs.repository }}
      conan_control_sha: ${{ needs.preflight-conan-broker.outputs.control_sha }}
      conan_repository_id: ${{ needs.preflight-conan-broker.outputs.repository_id }}
      conan_repository: ${{ needs.preflight-conan-broker.outputs.repository }}
      cloudsmith_namespace: ${{ needs.preflight-cloudsmith.outputs.namespace }}
      cloudsmith_repository: ${{ needs.preflight-cloudsmith.outputs.repository }}
      cloudsmith_repository_gpg_fingerprint: ${{ needs.preflight-cloudsmith.outputs.repository_gpg_fingerprint }}
    # A reusable workflow gets an environment secret only when the caller passes it by name.
    secrets:
      RELEASE_GPG_PRIVATE_KEY_B64: ${{ secrets.RELEASE_GPG_PRIVATE_KEY_B64 }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
    permissions:
      contents: read

  attestation:
    name: Attest signed release assets
    if: ${{ needs.contract.outputs.mode == 'publish' && needs.repository-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-github
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout protected current attestation policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download signed release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed
      - name: Select published attestation subjects
        run: |
          mkdir subjects
          find signed -maxdepth 1 -type f ! -name RELEASE_NOTES.md -exec cp {} subjects/ \;
      - name: Create GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: subjects/*
  github-release:
    name: Publish the immutable GitHub Release
    if: ${{ needs.contract.outputs.mode == 'publish' && needs.repository-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - candidate
      - attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-github
    permissions:
      contents: write
    steps:
      - name: Checkout protected current publication policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download signed release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed
      - name: Create and publish release under repository immutability
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_KIND: ${{ needs.contract.outputs.release_kind }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          TAG_OBJECT_SHA: ${{ needs.repository-readiness.outputs.tag_object_sha }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
        run: |
          python3 -I -S scripts/run_release_tool.py release.github_publication create-release \
            --directory signed --repository "${REPOSITORY}" \
            --repository-id "${REPOSITORY_ID}" --tag "${TAG}" \
            --release-kind "${RELEASE_KIND}" --tag-object-sha "${TAG_OBJECT_SHA}" \
            --commit "${COMMIT}"
  github-anchor:
    name: Verify and export the immutable GitHub anchor
    if: >-
      ${{ always() && needs.preparation-gate.result == 'success' &&
          (needs.repository-readiness.outputs.anchor_exists == 'true' || needs.github-release.result == 'success') }}
    needs:
      - contract
      - repository-readiness
      - existing-anchor-policy
      - preparation-gate
      - github-release
      - candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.anchor.outputs.release_id || steps.reuse.outputs.release_id }}
      manifest_sha256: ${{ steps.anchor.outputs.manifest_sha256 || steps.reuse.outputs.manifest_sha256 }}
    steps:
      - name: Checkout protected current verification material
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download and verify immutable assets, signatures, and release identity
        id: anchor
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.contract.outputs.version }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          ANCHOR_EXISTED: ${{ needs.repository-readiness.outputs.anchor_exists }}
          REPOSITORY: ${{ github.repository }}
          TAG_OBJECT_SHA: ${{ needs.repository-readiness.outputs.tag_object_sha }}
          PRIMARY_FINGERPRINT: ${{ vars.RELEASE_PRIMARY_FINGERPRINT }}
          TAG_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_TAG_SUBKEY_FINGERPRINT }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
        run: |
          python3 -I -S scripts/run_release_tool.py release.github_anchor download-and-verify \
            --directory verified --public-key keys/release-signing-key.asc \
            --trusted-signers release/trusted-release-signers.json \
            --tag "${TAG}" --version "${VERSION}" --commit "${COMMIT}" \
            --repository "${REPOSITORY}" \
            --tag-object-sha "${TAG_OBJECT_SHA}" \
            --primary-fingerprint "${PRIMARY_FINGERPRINT}" \
            --tag-fingerprint "${TAG_SUBKEY_FINGERPRINT}" \
            --artifact-fingerprint "${ARTIFACT_SUBKEY_FINGERPRINT}" \
            --anchor-existed "${ANCHOR_EXISTED}" \
            --targets packaging/targets.json \
            --native-builder-lock release/native-builders/lock.json \
            --conan-requirements packaging/conan-center/requirements.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Download the already verified historical anchor
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-existing-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified
      - name: Export the historical anchor identity
        id: reuse
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        env:
          RELEASE_ID: ${{ needs.existing-anchor-policy.outputs.release_id }}
          MANIFEST_SHA256: ${{ needs.existing-anchor-policy.outputs.manifest_sha256 }}
        run: |
          {
            echo "release_id=${RELEASE_ID}"
            echo "manifest_sha256=${MANIFEST_SHA256}"
          } >>"${GITHUB_OUTPUT}"
      - name: Upload verified immutable release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  publication:
    name: Publish the manually selected release channels
    needs:
      - contract
      - repository-readiness
      - github-anchor
    uses: ./.github/workflows/release-publication.yml
    with:
      tag: ${{ inputs.tag }}
      version: ${{ needs.contract.outputs.version }}
      mode: ${{ needs.contract.outputs.mode }}
      target_apt: ${{ needs.contract.outputs.target_apt }}
      target_rpm: ${{ needs.contract.outputs.target_rpm }}
      target_aur: ${{ needs.contract.outputs.target_aur }}
      target_homebrew: ${{ needs.contract.outputs.target_homebrew }}
      target_chocolatey: ${{ needs.contract.outputs.target_chocolatey }}
      target_conan2: ${{ needs.contract.outputs.target_conan2 }}
      cloudsmith_matrix: ${{ needs.contract.outputs.cloudsmith_matrix }}
      source_commit_sha: ${{ needs.repository-readiness.outputs.commit }}
      github_release_id: ${{ needs.github-anchor.outputs.release_id }}
      manifest_sha256: ${{ needs.github-anchor.outputs.manifest_sha256 }}
    # A reusable workflow gets an environment secret only when the caller passes it by name.
    secrets:
      AUR_SSH_PRIVATE_KEY_B64: ${{ secrets.AUR_SSH_PRIVATE_KEY_B64 }}
      AUR_SSH_KEY_PASSPHRASE: ${{ secrets.AUR_SSH_KEY_PASSPHRASE }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      HOMEBREW_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
      CHOCOLATEY_APP_PRIVATE_KEY: ${{ secrets.CHOCOLATEY_APP_PRIVATE_KEY }}
      CONAN_BROKER_APP_PRIVATE_KEY: ${{ secrets.CONAN_BROKER_APP_PRIVATE_KEY }}
    permissions:
      contents: read

  release-summary:
    name: Summarize release orchestration
    if: ${{ always() }}
    needs:
      - contract
      - candidate
      - github-anchor
      - publication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      OPERATION: ${{ inputs.operation }}
      TAG: ${{ inputs.tag }}
      CANDIDATE_RESULT: ${{ needs.candidate.result }}
      ANCHOR_RESULT: ${{ needs.github-anchor.result }}
      CLOUDSMITH_RESULT: ${{ needs.publication.outputs.cloudsmith_result || needs.publication.result }}
      AUR_RESULT: ${{ needs.publication.outputs.aur_result || needs.publication.result }}
      HOMEBREW_RESULT: ${{ needs.publication.outputs.homebrew_result || needs.publication.result }}
      CHOCOLATEY_RESULT: ${{ needs.publication.outputs.chocolatey_result || needs.publication.result }}
      CONAN_RESULT: ${{ needs.publication.outputs.conan_result || needs.publication.result }}
      HOMEBREW_URL: ${{ needs.publication.outputs.homebrew_url }}
      CHOCOLATEY_URL: ${{ needs.publication.outputs.chocolatey_url }}
      CONAN_URL: ${{ needs.publication.outputs.conan_url }}
    steps:
      - name: Write final workflow summary
        run: |
          {
            echo "# Release ${TAG}"
            echo "Operation: ${OPERATION}"
            echo ""
            echo "| Stage | Result | Downstream run |"
            echo "|---|---|---|"
            echo "| Candidate workflow | ${CANDIDATE_RESULT} | |"
            echo "| GitHub anchor | ${ANCHOR_RESULT} | |"
            echo "| Cloudsmith | ${CLOUDSMITH_RESULT} | |"
            echo "| AUR | ${AUR_RESULT} | |"
            echo "| Homebrew | ${HOMEBREW_RESULT} | ${HOMEBREW_URL} |"
            echo "| Chocolatey | ${CHOCOLATEY_RESULT} | ${CHOCOLATEY_URL} |"
            echo "| ConanCenter | ${CONAN_RESULT} | ${CONAN_URL} |"
          } >>"${GITHUB_STEP_SUMMARY}"
