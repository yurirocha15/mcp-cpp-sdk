          repositories: ${{ vars.CHOCOLATEY_APP_REPOSITORY }}
          permission-actions: write
          permission-contents: read
      - name: Dispatch fixed Chocolatey publisher workflow
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_OWNER: ${{ vars.CHOCOLATEY_APP_OWNER }}
          APP_REPOSITORY: ${{ vars.CHOCOLATEY_APP_REPOSITORY }}
          EXPECTED_REPOSITORY_ID: ${{ vars.CHOCOLATEY_APP_REPOSITORY_ID }}
          WORKFLOW: ${{ vars.CHOCOLATEY_APP_WORKFLOW }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          RELEASE_ID: ${{ needs.github-anchor.outputs.release_id }}
          MANIFEST_SHA256: ${{ needs.github-anchor.outputs.manifest_sha256 }}
        run: |
          [[ "${APP_OWNER}/${APP_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "${EXPECTED_REPOSITORY_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${WORKFLOW}" =~ ^[A-Za-z0-9_.-]+\.ya?ml$ ]]
          repository="$(gh api "repos/${APP_OWNER}/${APP_REPOSITORY}")"
          test "$(jq -r '.id|tostring' <<<"${repository}")" = "${EXPECTED_REPOSITORY_ID}"
          test "$(jq -r '.full_name' <<<"${repository}")" = "${APP_OWNER}/${APP_REPOSITORY}"
          test "$(jq -r '.default_branch' <<<"${repository}")" = main
          request_uuid="$(python3 -I -S -c 'import os,uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, os.environ["GITHUB_REPOSITORY"]+":"+os.environ["TAG"]+":"+os.environ["MANIFEST_SHA256"]+":chocolatey"))')"
          gh api --method POST "repos/${APP_OWNER}/${APP_REPOSITORY}/actions/workflows/${WORKFLOW}/dispatches" \
            -f ref=main -f "inputs[source_tag]=${TAG}" -f "inputs[source_commit_sha]=${COMMIT}" \
            -f "inputs[github_release_id]=${RELEASE_ID}" -f "inputs[source_workflow_run_id]=${GITHUB_RUN_ID}" \
            -f "inputs[release_manifest_sha256]=${MANIFEST_SHA256}" -f "inputs[request_uuid]=${request_uuid}"
      - name: Emit fixed Chocolatey submission result
        id: result
        run: echo 'result=SUBMITTED_PENDING_MODERATION' >> "${GITHUB_OUTPUT}"

  conan-recipe:
    name: Publish the exact ConanCenter recipe branch
    if: ${{ needs.contract.outputs.target_conan2 == 'true' }}
    needs:
      - contract
      - github-anchor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-conan-recipe
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.recipe.outputs.branch }}
      head_sha: ${{ steps.recipe.outputs.head_sha }}
      tree_sha256: ${{ steps.recipe.outputs.tree_sha256 }}
    steps:
      - name: Download the verified immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Verify fixed anchor handoff
        env:
          EXPECTED_MANIFEST: ${{ needs.github-anchor.outputs.manifest_sha256 }}
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          python3 -I -S <<'PY'
          import json, os
          from pathlib import Path
          anchor = json.loads(Path("release-assets/ANCHOR.json").read_text(encoding="utf-8"))
          if anchor.get("manifest_sha256") != os.environ["EXPECTED_MANIFEST"] or anchor.get("tag") != os.environ["EXPECTED_TAG"]:
              raise SystemExit("verified artifact handoff does not match the immutable anchor")
          PY
      - name: Create a fork-scoped recipe App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CONAN_RECIPE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONAN_RECIPE_APP_PRIVATE_KEY }}
          owner: ${{ vars.CONAN_RECIPE_APP_OWNER }}
          repositories: ${{ vars.CONAN_RECIPE_APP_REPOSITORY }}
          permission-contents: write
      - name: Create or verify the recipe-only fork branch
        id: recipe
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_OWNER: ${{ vars.CONAN_RECIPE_APP_OWNER }}
          APP_REPOSITORY: ${{ vars.CONAN_RECIPE_APP_REPOSITORY }}
          EXPECTED_REPOSITORY_ID: ${{ vars.CONAN_RECIPE_APP_REPOSITORY_ID }}
          VERSION: ${{ needs.contract.outputs.version }}
        run: |
          target="${APP_OWNER}/${APP_REPOSITORY}"
          [[ "${target}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "${EXPECTED_REPOSITORY_ID}" =~ ^[1-9][0-9]*$ ]]
          repository="$(gh api "repos/${target}")"
          test "$(jq -r '.id|tostring' <<<"${repository}")" = "${EXPECTED_REPOSITORY_ID}"
          test "$(jq -r '.full_name' <<<"${repository}")" = "${target}"
          test "$(jq -r '.fork,.parent.full_name,.default_branch' <<<"${repository}")" = $'true\nconan-io/conan-center-index\nmaster'
          fork_base="$(gh api "repos/${target}/git/ref/heads/master" --jq '.object.sha')"
          upstream_base="$(gh api 'repos/conan-io/conan-center-index/git/ref/heads/master' --jq '.object.sha')"
          test "${fork_base}" = "${upstream_base}"

          declare -A recipe_files=(
            [recipes/mcp-cpp-sdk/config.yml]=conan-recipe-config.yml
            [recipes/mcp-cpp-sdk/all/conandata.yml]=conan-recipe-conandata.yml
            [recipes/mcp-cpp-sdk/all/conanfile.py]=conan-recipe-conanfile.py
            [recipes/mcp-cpp-sdk/all/test_package/CMakeLists.txt]=conan-recipe-test-CMakeLists.txt
            [recipes/mcp-cpp-sdk/all/test_package/conanfile.py]=conan-recipe-test-conanfile.py
            [recipes/mcp-cpp-sdk/all/test_package/test_package.cpp]=conan-recipe-test-test_package.cpp
          )
          for asset in "${recipe_files[@]}"; do
            test -s "release-assets/${asset}"
          done

          branch="package/mcp-cpp-sdk-${VERSION}"
          refs="$(gh api "repos/${target}/git/matching-refs/heads/${branch}")"
          exact_count="$(jq --arg ref "refs/heads/${branch}" '[.[] | select(.ref == $ref)] | length' <<<"${refs}")"
          if [[ "${exact_count}" == 0 ]]; then
            base_tree="$(gh api "repos/${target}/git/commits/${fork_base}" --jq '.tree.sha')"
            tree_entries='[]'
            while IFS= read -r path; do
              asset="${recipe_files[${path}]}"
              content="$(base64 -w0 "release-assets/${asset}")"
              blob="$(gh api --method POST "repos/${target}/git/blobs" \
                -f content="${content}" -f encoding=base64 --jq .sha)"
              tree_entries="$(jq --arg path "${path}" --arg blob "${blob}" \
                '. + [{path:$path,mode:"100644",type:"blob",sha:$blob}]' <<<"${tree_entries}")"
            done < <(printf '%s\n' "${!recipe_files[@]}" | sort)
            tree="$(jq -n --arg base "${base_tree}" --argjson entries "${tree_entries}" \
              '{base_tree:$base,tree:$entries}' |
              gh api --method POST "repos/${target}/git/trees" --input - --jq .sha)"
            head="$(jq -n --arg message "mcp-cpp-sdk ${VERSION}" --arg tree "${tree}" --arg parent "${fork_base}" \
              '{message:$message,tree:$tree,parents:[$parent]}' |
              gh api --method POST "repos/${target}/git/commits" --input - --jq .sha)"
            gh api --method POST "repos/${target}/git/refs" \
              -f ref="refs/heads/${branch}" -f sha="${head}" >/dev/null
          elif [[ "${exact_count}" == 1 ]]; then
            head="$(jq -r --arg ref "refs/heads/${branch}" '.[] | select(.ref == $ref) | .object.sha' <<<"${refs}")"
            while IFS= read -r path; do
              asset="${recipe_files[${path}]}"
              gh api "repos/${target}/contents/${path}?ref=${branch}" --jq .content |
                tr -d '\n' | base64 --decode > remote-recipe-file
              cmp --silent "release-assets/${asset}" remote-recipe-file
            done < <(printf '%s\n' "${!recipe_files[@]}" | sort)
          else
            echo "::error::Ambiguous Conan recipe branch identity"
            exit 1
          fi

          gh api "repos/${target}/compare/master...${head}" --jq '.files[].filename' | sort > changed-files.txt
          printf '%s\n' "${!recipe_files[@]}" | sort > expected-files.txt
          cmp --silent expected-files.txt changed-files.txt
          git init --bare recipe.git
          git -C recipe.git fetch --no-tags --depth=1 "https://github.com/${target}.git" \
            "refs/heads/${branch}:refs/heads/recipe"
          test "$(git -C recipe.git rev-parse refs/heads/recipe)" = "${head}"
          git -C recipe.git archive --format=tar --prefix=recipe/ \
            "refs/heads/recipe:recipes/mcp-cpp-sdk" > recipe.tar
          tree_sha256="$(sha256sum recipe.tar | cut -d' ' -f1)"
          {
            echo "branch=${branch}"
            echo "head_sha=${head}"
            echo "tree_sha256=${tree_sha256}"
          } >> "${GITHUB_OUTPUT}"

  conan:
