name: Release

run-name: "release ${{ inputs.tag }} (${{ inputs.operation }})"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact annotated release tag, for example v0.2.0"
        required: true
        type: string
      operation:
        description: "Publish builds GitHub + complete stable bundle; checkboxes only gate external publishing"
        required: true
        type: choice
        options:
          - validate-selected
          - validate-all
          - publish-selected
          - publish-all
      conan2:
        description: "ConanCenter recipe PR"
        required: true
        default: false
        type: boolean
      apt:
        description: "Cloudsmith APT repositories"
        required: true
        default: false
        type: boolean
      rpm:
        description: "Cloudsmith RPM repositories"
        required: true
        default: false
        type: boolean
      aur:
        description: "Arch User Repository"
        required: true
        default: false
        type: boolean
      homebrew:
        description: "Homebrew tap PR and bottles"
        required: true
        default: false
        type: boolean
      chocolatey:
        description: "Chocolatey Community submission"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "Exact operation:tag:github[,channels] (or operation:tag:all)"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: release-publishing
  cancel-in-progress: false

env:
  RELEASE_ARTIFACT_RETENTION_DAYS: "30"

jobs:
  contract:
    name: Validate dispatch contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      operation: ${{ steps.contract.outputs.operation }}
      mode: ${{ steps.contract.outputs.mode }}
      version: ${{ steps.contract.outputs.version }}
      release_kind: ${{ steps.contract.outputs.release_kind }}
      normalized_channels: ${{ steps.contract.outputs.normalized_channels }}
      selection_label: ${{ steps.contract.outputs.selection_label }}
      cloudsmith_matrix: ${{ steps.contract.outputs.cloudsmith_matrix }}
      target_conan2: ${{ steps.contract.outputs.target_conan2 }}
      target_apt: ${{ steps.contract.outputs.target_apt }}
      target_rpm: ${{ steps.contract.outputs.target_rpm }}
      target_aur: ${{ steps.contract.outputs.target_aur }}
      target_homebrew: ${{ steps.contract.outputs.target_homebrew }}
      target_chocolatey: ${{ steps.contract.outputs.target_chocolatey }}
    steps:
      - name: Checkout protected contract validator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate untrusted dispatch inputs
        id: contract
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
          DISPATCH_CONAN2: ${{ inputs.conan2 }}
          DISPATCH_APT: ${{ inputs.apt }}
          DISPATCH_RPM: ${{ inputs.rpm }}
          DISPATCH_AUR: ${{ inputs.aur }}
          DISPATCH_HOMEBREW: ${{ inputs.homebrew }}
          DISPATCH_CHOCOLATEY: ${{ inputs.chocolatey }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_OWNER_ID: ${{ github.repository_owner_id }}
          EXPECTED_REPOSITORY: ${{ vars.RELEASE_EXPECTED_REPOSITORY }}
          EXPECTED_REPOSITORY_ID: ${{ vars.RELEASE_EXPECTED_REPOSITORY_ID }}
          EXPECTED_OWNER_ID: ${{ vars.RELEASE_EXPECTED_OWNER_ID }}
        run: python3 -I -S scripts/release_dispatch_contract.py

  policy:
    name: Offline release workflow policy
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout protected source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run offline policy and release-tool tests
        run: |
          python3 scripts/check_release_workflow.py
          PYTHONPATH=scripts python3 -m unittest -v \
            scripts/test_release_dispatch_contract.py \
            scripts/test_release_workflow_policy.py
          python3 -m unittest discover -s test/release -p 'test_*.py' -v
      - name: Lint all GitHub Actions workflows
        run: scripts/release/lint_workflows.sh

  repository-readiness:
    name: Validate tagged release identity
    needs:
      - contract
      - policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.readiness.outputs.commit }}
      tag_object_sha: ${{ steps.readiness.outputs.tag_object_sha }}
      source_date_epoch: ${{ steps.readiness.outputs.source_date_epoch }}
      anchor_exists: ${{ steps.anchor.outputs.anchor_exists }}
      native_matrix: ${{ steps.readiness.outputs.native_matrix }}
      aur_builder: ${{ steps.readiness.outputs.aur_builder }}
      conan_builder: ${{ steps.readiness.outputs.conan_builder }}
    steps:
      - name: Checkout source and tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Probe the exact immutable release anchor
        id: anchor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          TAG: ${{ inputs.tag }}
        run: |
          value="$(python3 -I -S scripts/run_release_tool.py release.github_publication \
            probe-existing-release --repository "${REPOSITORY}" \
            --repository-id "${REPOSITORY_ID}" --tag "${TAG}")"
          [[ "${value}" == true || "${value}" == false ]]
          echo "anchor_exists=${value}" >>"${GITHUB_OUTPUT}"
      - name: Verify version, annotated tag, signature, and changelog
        id: readiness
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_VERSION: ${{ needs.contract.outputs.version }}
          DISPATCH_HEAD_SHA: ${{ github.sha }}
          ANCHOR_EXISTS: ${{ steps.anchor.outputs.anchor_exists }}
          PRIMARY_FINGERPRINT: ${{ vars.RELEASE_PRIMARY_FINGERPRINT }}
          TAG_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_TAG_SUBKEY_FINGERPRINT }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.repository_readiness
          --tag "${DISPATCH_TAG}" --version "${DISPATCH_VERSION}"
          --dispatch-head-sha "${DISPATCH_HEAD_SHA}"
          --anchor-exists "${ANCHOR_EXISTS}"
          --primary-fingerprint "${PRIMARY_FINGERPRINT}"
          --tag-fingerprint "${TAG_SUBKEY_FINGERPRINT}"
          --artifact-fingerprint "${ARTIFACT_SUBKEY_FINGERPRINT}"
          --public-key keys/release-signing-key.asc
          --trusted-signers release/trusted-release-signers.json
          --targets packaging/targets.json
          --native-builder-lock release/native-builders/lock.json
          --github-output "${GITHUB_OUTPUT}"
  immutability-gate:
    name: Verify immutable Releases and protected annotated tags
    needs:
      - contract
      - repository-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-admin-read
    permissions:
      contents: read
    steps:
      - name: Checkout protected current immutability policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create a repository-administration read token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_ADMIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_ADMIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: read
      - name: Require immutable Releases and a non-bypassable release-tag ruleset
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RULESET_ID: ${{ vars.RELEASE_TAG_RULESET_ID }}
          RULESET_UPDATED_AT: ${{ vars.RELEASE_TAG_RULESET_UPDATED_AT }}
          TAG: ${{ inputs.tag }}
          TAG_OBJECT_SHA: ${{ needs.repository-readiness.outputs.tag_object_sha }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
        run: |
          [[ "${RULESET_ID}" =~ ^[1-9][0-9]*$ ]]
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPOSITORY}/immutable-releases" > immutable-releases.json
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPOSITORY}/rulesets/${RULESET_ID}" > tag-ruleset.json
          gh api "repos/${REPOSITORY}/git/ref/tags/${TAG}" > tag-ref.json
          gh api "repos/${REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" > tag-object.json
          python3 -I -S scripts/run_release_tool.py release.repository_immutability \
            --immutable-releases immutable-releases.json --ruleset tag-ruleset.json \
            --tag-ref tag-ref.json --tag-object tag-object.json --ruleset-id "${RULESET_ID}" \
            --ruleset-updated-at "${RULESET_UPDATED_AT}" --repository "${REPOSITORY}" \
            --tag "${TAG}" --tag-object-sha "${TAG_OBJECT_SHA}" --commit "${COMMIT}"

  existing-anchor-policy:
    name: Load signed policy for an existing immutable anchor
    needs:
      - contract
      - repository-readiness
      - immutability-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout protected current anchor verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download and verify historical signed publication policy
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.contract.outputs.version }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
          TAG_OBJECT_SHA: ${{ needs.repository-readiness.outputs.tag_object_sha }}
          PRIMARY_FINGERPRINT: ${{ vars.RELEASE_PRIMARY_FINGERPRINT }}
          TAG_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_TAG_SUBKEY_FINGERPRINT }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.github_anchor download-and-verify
          --directory existing-anchor --public-key keys/release-signing-key.asc
          --trusted-signers release/trusted-release-signers.json
          --tag "${TAG}" --version "${VERSION}" --commit "${COMMIT}"
          --repository "${REPOSITORY}"
          --tag-object-sha "${TAG_OBJECT_SHA}"
          --primary-fingerprint "${PRIMARY_FINGERPRINT}"
          --tag-fingerprint "${TAG_SUBKEY_FINGERPRINT}"
          --artifact-fingerprint "${ARTIFACT_SUBKEY_FINGERPRINT}"
          --anchor-existed true --targets packaging/targets.json
          --native-builder-lock release/native-builders/lock.json
          --conan-requirements packaging/conan-center/requirements.json
          --github-output "${GITHUB_OUTPUT}"
      - name: Preserve the historical signed policy handoff
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-existing-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: existing-anchor/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  fresh-provider-controls:
    name: Bind every future provider control into a fresh anchor
    needs:
      - contract
      - repository-readiness
      - immutability-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      homebrew_sha: ${{ steps.homebrew.outputs.control_sha }}
      chocolatey_sha: ${{ steps.chocolatey.outputs.control_sha }}
      conan_sha: ${{ steps.conan.outputs.control_sha }}
    steps:
      - name: Checkout protected current provider policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind immutable Homebrew control
        if: ${{ needs.contract.outputs.release_kind == 'stable' && needs.repository-readiness.outputs.anchor_exists == 'false' }}
        id: homebrew
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.provider_preflight workflow
          --owner "${{ vars.HOMEBREW_APP_OWNER }}"
          --repository "${{ vars.HOMEBREW_APP_REPOSITORY }}"
          --expected-repository-id "${{ vars.HOMEBREW_APP_REPOSITORY_ID }}"
          --workflow "${{ vars.HOMEBREW_APP_WORKFLOW }}"
          --controls packaging/provider-controls.json --provider homebrew
          --github-output "${GITHUB_OUTPUT}"
      - name: Bind immutable Chocolatey control
        if: ${{ needs.contract.outputs.release_kind == 'stable' && needs.repository-readiness.outputs.anchor_exists == 'false' }}
        id: chocolatey
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.provider_preflight workflow
          --owner "${{ vars.CHOCOLATEY_APP_OWNER }}"
          --repository "${{ vars.CHOCOLATEY_APP_REPOSITORY }}"
          --expected-repository-id "${{ vars.CHOCOLATEY_APP_REPOSITORY_ID }}"
          --workflow "${{ vars.CHOCOLATEY_APP_WORKFLOW }}"
          --controls packaging/provider-controls.json --provider chocolatey
          --github-output "${GITHUB_OUTPUT}"
      - name: Bind immutable Conan control
        if: ${{ needs.contract.outputs.release_kind == 'stable' && needs.repository-readiness.outputs.anchor_exists == 'false' }}
        id: conan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.provider_preflight workflow
          --owner "${{ vars.CONAN_BROKER_APP_OWNER }}"
          --repository "${{ vars.CONAN_BROKER_APP_REPOSITORY }}"
          --expected-repository-id "${{ vars.CONAN_BROKER_APP_REPOSITORY_ID }}"
          --workflow "${{ vars.CONAN_BROKER_APP_WORKFLOW }}"
          --controls packaging/provider-controls.json --provider conan
          --github-output "${GITHUB_OUTPUT}"

  preflight-cloudsmith:
    name: Preflight selected Cloudsmith routes
    if: ${{ needs.contract.outputs.target_apt == 'true' || needs.contract.outputs.target_rpm == 'true' }}
    needs:
      - contract
      - repository-readiness
      - immutability-gate
      - existing-anchor-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-cloudsmith
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout protected current provider policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download historical signed publication policy
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-existing-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: existing-anchor
      - name: Bind current Cloudsmith coordinates to the signed anchor
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.publication_contract
          --contract existing-anchor/release-publication-contract.json --name cloudsmith
          --namespace "${{ vars.CLOUDSMITH_NAMESPACE }}"
          --repository "${{ vars.CLOUDSMITH_REPOSITORY }}"
          --preflight-username "${{ vars.CLOUDSMITH_PREFLIGHT_SERVICE_USERNAME }}"
          --publish-username "${{ vars.CLOUDSMITH_PUBLISH_SERVICE_USERNAME }}"
      - name: Authenticate the pinned Cloudsmith CLI without publishing
        uses: cloudsmith-io/cloudsmith-cli-action@159f1619275d5d3147f059c3cc110938ec221d16 # v2.0.3
        with:
          cli-version: "1.19.0"
          oidc-namespace: ${{ vars.CLOUDSMITH_OIDC_NAMESPACE }}
          oidc-service-slug: ${{ vars.CLOUDSMITH_PREFLIGHT_OIDC_SERVICE_SLUG }}
      - name: Verify the downloaded Cloudsmith CLI payload
        run: bash scripts/release/verify_cloudsmith_cli.sh
      - name: Verify exact Cloudsmith repository read access
        env:
          CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
          CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
          CLOUDSMITH_PREFLIGHT_USERNAME: ${{ vars.CLOUDSMITH_PREFLIGHT_SERVICE_USERNAME }}
          TARGET_APT: ${{ needs.contract.outputs.target_apt }}
          TARGET_RPM: ${{ needs.contract.outputs.target_rpm }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.cloudsmith_publish preflight
          --namespace "${CLOUDSMITH_NAMESPACE}" --repository "${CLOUDSMITH_REPOSITORY}"
          --expected-username "${CLOUDSMITH_PREFLIGHT_USERNAME}"
          --apt-selected "${TARGET_APT}" --rpm-selected "${TARGET_RPM}"
          --targets packaging/targets.json
          --policy-source "${{ needs.repository-readiness.outputs.anchor_exists == 'true' && 'embedded' || 'current' }}"
          --signed-contract existing-anchor/release-publication-contract.json

  preflight-aur:
    name: Preflight selected AUR publisher
    if: ${{ needs.contract.outputs.target_aur == 'true' }}
    needs:
      - contract
      - repository-readiness
      - immutability-gate
      - existing-anchor-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-aur
    permissions:
      contents: read
    env:
      AUR_PACKAGE_BASE: mcp-cpp-sdk
      AUR_CLONE_URL: ssh://aur@aur.archlinux.org/mcp-cpp-sdk.git
    steps:
      - name: Checkout protected current provider policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download historical signed publication policy
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-existing-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: existing-anchor
      - name: Bind the AUR target to the signed anchor
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.publication_contract
          --contract existing-anchor/release-publication-contract.json --name aur
          --repository "${AUR_CLONE_URL}" --package-base "${AUR_PACKAGE_BASE}"
          --architecture x86_64
      - name: Verify the exact public AUR repository without credentials
        run: bash scripts/release/preflight_aur.sh
      - name: Authenticate to the non-mutating AUR SSH help interface
        env:
          AUR_SSH_PRIVATE_KEY_B64: ${{ secrets.AUR_SSH_PRIVATE_KEY_B64 }}
          AUR_SSH_KEY_PASSPHRASE: ${{ secrets.AUR_SSH_KEY_PASSPHRASE }}
          AUR_KNOWN_HOSTS: ${{ vars.AUR_KNOWN_HOSTS }}
        run: bash scripts/release/preflight_aur_auth.sh

  preflight-homebrew:
    name: Preflight selected Homebrew publisher
    if: ${{ needs.contract.outputs.target_homebrew == 'true' }}
    needs:
      - contract
      - repository-readiness
      - immutability-gate
      - existing-anchor-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-homebrew
    permissions:
      contents: read
    outputs:
      control_tag: ${{ steps.control.outputs.control_tag }}
      control_sha: ${{ steps.control.outputs.control_sha }}
    steps:
      - name: Checkout protected current provider policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download historical signed publication policy
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-existing-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: existing-anchor
      - name: Bind current Homebrew destination to the signed anchor
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.publication_contract
          --contract existing-anchor/release-publication-contract.json --name homebrew
          --repository "${{ vars.HOMEBREW_APP_OWNER }}/${{ vars.HOMEBREW_APP_REPOSITORY }}"
          --repository-id "${{ vars.HOMEBREW_APP_REPOSITORY_ID }}"
          --bot-login "${{ vars.HOMEBREW_APP_BOT_LOGIN }}"
      - name: Create a read-only Homebrew App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ vars.HOMEBREW_APP_OWNER }}
          repositories: ${{ vars.HOMEBREW_APP_REPOSITORY }}
          permission-actions: read
          permission-contents: read
      - name: Verify exact Homebrew repository and active workflow
        id: control
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_OWNER: ${{ vars.HOMEBREW_APP_OWNER }}
          APP_REPOSITORY: ${{ vars.HOMEBREW_APP_REPOSITORY }}
          EXPECTED_REPOSITORY_ID: ${{ vars.HOMEBREW_APP_REPOSITORY_ID }}
          WORKFLOW: ${{ vars.HOMEBREW_APP_WORKFLOW }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.provider_preflight workflow
          --owner "${APP_OWNER}" --repository "${APP_REPOSITORY}"
          --expected-repository-id "${EXPECTED_REPOSITORY_ID}" --workflow "${WORKFLOW}"
          --controls packaging/provider-controls.json --provider homebrew
          --policy-source "${{ needs.repository-readiness.outputs.anchor_exists == 'true' && 'embedded' || 'current' }}"
          --signed-contract existing-anchor/release-publication-contract.json
          --github-output "${GITHUB_OUTPUT}"

  preflight-chocolatey:
    name: Preflight selected Chocolatey publisher
    if: ${{ needs.contract.outputs.target_chocolatey == 'true' }}
    needs:
      - contract
      - repository-readiness
      - immutability-gate
      - existing-anchor-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-chocolatey
    permissions:
      contents: read
    outputs:
      control_tag: ${{ steps.control.outputs.control_tag }}
      control_sha: ${{ steps.control.outputs.control_sha }}
    steps:
      - name: Checkout protected current provider policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download historical signed publication policy
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-existing-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: existing-anchor
      - name: Bind current Chocolatey destination to the signed anchor
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.publication_contract
          --contract existing-anchor/release-publication-contract.json --name chocolatey
          --repository "${{ vars.CHOCOLATEY_APP_OWNER }}/${{ vars.CHOCOLATEY_APP_REPOSITORY }}"
          --repository-id "${{ vars.CHOCOLATEY_APP_REPOSITORY_ID }}"
      - name: Create a read-only Chocolatey App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CHOCOLATEY_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHOCOLATEY_APP_PRIVATE_KEY }}
          owner: ${{ vars.CHOCOLATEY_APP_OWNER }}
          repositories: ${{ vars.CHOCOLATEY_APP_REPOSITORY }}
          permission-actions: read
          permission-contents: read
      - name: Verify exact Chocolatey repository and active workflow
        id: control
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_OWNER: ${{ vars.CHOCOLATEY_APP_OWNER }}
          APP_REPOSITORY: ${{ vars.CHOCOLATEY_APP_REPOSITORY }}
          EXPECTED_REPOSITORY_ID: ${{ vars.CHOCOLATEY_APP_REPOSITORY_ID }}
          WORKFLOW: ${{ vars.CHOCOLATEY_APP_WORKFLOW }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.provider_preflight workflow
          --owner "${APP_OWNER}" --repository "${APP_REPOSITORY}"
          --expected-repository-id "${EXPECTED_REPOSITORY_ID}" --workflow "${WORKFLOW}"
          --controls packaging/provider-controls.json --provider chocolatey
          --policy-source "${{ needs.repository-readiness.outputs.anchor_exists == 'true' && 'embedded' || 'current' }}"
          --signed-contract existing-anchor/release-publication-contract.json
          --github-output "${GITHUB_OUTPUT}"

  preflight-conan-fork:
    name: Preflight selected ConanCenter recipe fork
    if: ${{ needs.contract.outputs.target_conan2 == 'true' }}
    needs:
      - contract
      - repository-readiness
      - immutability-gate
      - existing-anchor-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-conan-recipe
    permissions:
      contents: read
    steps:
      - name: Checkout protected current provider policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download historical signed publication policy
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-existing-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: existing-anchor
      - name: Bind current Conan fork destination to the signed anchor
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.publication_contract
          --contract existing-anchor/release-publication-contract.json --name conan_fork
          --repository "${{ vars.CONAN_RECIPE_APP_OWNER }}/${{ vars.CONAN_RECIPE_APP_REPOSITORY }}"
          --repository-id "${{ vars.CONAN_RECIPE_APP_REPOSITORY_ID }}"
          --upstream conan-io/conan-center-index
      - name: Create a read-only Conan recipe-fork App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CONAN_RECIPE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONAN_RECIPE_APP_PRIVATE_KEY }}
          owner: ${{ vars.CONAN_RECIPE_APP_OWNER }}
          repositories: ${{ vars.CONAN_RECIPE_APP_REPOSITORY }}
          permission-contents: read
      - name: Verify exact synchronized fork and dependency recipe availability
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_OWNER: ${{ vars.CONAN_RECIPE_APP_OWNER }}
          APP_REPOSITORY: ${{ vars.CONAN_RECIPE_APP_REPOSITORY }}
          EXPECTED_REPOSITORY_ID: ${{ vars.CONAN_RECIPE_APP_REPOSITORY_ID }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.provider_preflight conan-fork
          --owner "${APP_OWNER}" --repository "${APP_REPOSITORY}"
          --expected-repository-id "${EXPECTED_REPOSITORY_ID}"
          --requirements packaging/conan-center/requirements.json
          --policy-source "${{ needs.repository-readiness.outputs.anchor_exists == 'true' && 'embedded' || 'current' }}"
          --signed-contract existing-anchor/release-publication-contract.json

  preflight-conan-broker:
    name: Preflight selected ConanCenter control workflow
    if: ${{ needs.contract.outputs.target_conan2 == 'true' }}
    needs:
      - contract
      - repository-readiness
      - immutability-gate
      - existing-anchor-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-control-dispatch
    permissions:
      contents: read
    outputs:
      control_tag: ${{ steps.control.outputs.control_tag }}
      control_sha: ${{ steps.control.outputs.control_sha }}
    steps:
      - name: Checkout protected current provider policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download historical signed publication policy
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-existing-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: existing-anchor
      - name: Bind current Conan control destination to the signed anchor
        if: ${{ needs.repository-readiness.outputs.anchor_exists == 'true' }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.publication_contract
          --contract existing-anchor/release-publication-contract.json --name conan_control
          --repository "${{ vars.CONAN_BROKER_APP_OWNER }}/${{ vars.CONAN_BROKER_APP_REPOSITORY }}"
          --repository-id "${{ vars.CONAN_BROKER_APP_REPOSITORY_ID }}"
      - name: Create a read-only Conan control App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CONAN_BROKER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONAN_BROKER_APP_PRIVATE_KEY }}
          owner: ${{ vars.CONAN_BROKER_APP_OWNER }}
          repositories: ${{ vars.CONAN_BROKER_APP_REPOSITORY }}
          permission-actions: read
          permission-contents: read
      - name: Verify exact Conan control repository and active workflow
        id: control
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_OWNER: ${{ vars.CONAN_BROKER_APP_OWNER }}
          APP_REPOSITORY: ${{ vars.CONAN_BROKER_APP_REPOSITORY }}
          EXPECTED_REPOSITORY_ID: ${{ vars.CONAN_BROKER_APP_REPOSITORY_ID }}
          WORKFLOW: ${{ vars.CONAN_BROKER_APP_WORKFLOW }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.provider_preflight workflow
          --owner "${APP_OWNER}" --repository "${APP_REPOSITORY}"
          --expected-repository-id "${EXPECTED_REPOSITORY_ID}" --workflow "${WORKFLOW}"
          --controls packaging/provider-controls.json --provider conan
          --policy-source "${{ needs.repository-readiness.outputs.anchor_exists == 'true' && 'embedded' || 'current' }}"
          --signed-contract existing-anchor/release-publication-contract.json
          --github-output "${GITHUB_OUTPUT}"

  preparation-gate:
    name: Admit validation or publication construction
    if: >-
      ${{ always() && needs.contract.result == 'success' &&
          needs.repository-readiness.result == 'success' &&
          needs.immutability-gate.result == 'success' &&
          needs.existing-anchor-policy.result == 'success' }}
    needs:
      - contract
      - repository-readiness
      - immutability-gate
      - existing-anchor-policy
      - preflight-cloudsmith
      - preflight-aur
      - preflight-homebrew
      - preflight-chocolatey
      - preflight-conan-fork
      - preflight-conan-broker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout protected current preflight gate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require exact selected-success and unselected-skip results
        env:
          TARGET_CLOUDSMITH: ${{ needs.contract.outputs.target_apt == 'true' || needs.contract.outputs.target_rpm == 'true' }}
          TARGET_AUR: ${{ needs.contract.outputs.target_aur }}
          TARGET_HOMEBREW: ${{ needs.contract.outputs.target_homebrew }}
          TARGET_CHOCOLATEY: ${{ needs.contract.outputs.target_chocolatey }}
          TARGET_CONAN: ${{ needs.contract.outputs.target_conan2 }}
          RESULT_CLOUDSMITH: ${{ needs.preflight-cloudsmith.result }}
          RESULT_AUR: ${{ needs.preflight-aur.result }}
          RESULT_HOMEBREW: ${{ needs.preflight-homebrew.result }}
          RESULT_CHOCOLATEY: ${{ needs.preflight-chocolatey.result }}
          RESULT_CONAN_FORK: ${{ needs.preflight-conan-fork.result }}
          RESULT_CONAN_BROKER: ${{ needs.preflight-conan-broker.result }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.provider_preflight gate
          --target-cloudsmith "${TARGET_CLOUDSMITH}" --result-cloudsmith "${RESULT_CLOUDSMITH}"
          --target-aur "${TARGET_AUR}" --result-aur "${RESULT_AUR}"
          --target-homebrew "${TARGET_HOMEBREW}" --result-homebrew "${RESULT_HOMEBREW}"
          --target-chocolatey "${TARGET_CHOCOLATEY}" --result-chocolatey "${RESULT_CHOCOLATEY}"
          --target-conan-fork "${TARGET_CONAN}" --result-conan-fork "${RESULT_CONAN_FORK}"
          --target-conan-broker "${TARGET_CONAN}" --result-conan-broker "${RESULT_CONAN_BROKER}"
      - name: Require RELEASE_PUBLISHING_ENABLED
        if: ${{ needs.contract.outputs.mode == 'publish' }}
        env:
          RELEASE_PUBLISHING_ENABLED: ${{ vars.RELEASE_PUBLISHING_ENABLED }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.workflow_gate publishing
          --enabled "${RELEASE_PUBLISHING_ENABLED}"

  construct-core:
    name: Construct deterministic source and recipe artifacts
    if: ${{ needs.repository-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - preparation-gate
      - fresh-provider-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout the exact tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.repository-readiness.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build deterministic archives, SBOMs, and publisher recipes
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.repository-readiness.outputs.source_date_epoch }}
          RELEASE_KIND: ${{ needs.contract.outputs.release_kind }}
          PRIMARY_FINGERPRINT: ${{ vars.RELEASE_PRIMARY_FINGERPRINT }}
          TAG_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_TAG_SUBKEY_FINGERPRINT }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
          HOMEBREW_CONTROL_SHA: ${{ needs.fresh-provider-controls.outputs.homebrew_sha }}
          CHOCOLATEY_CONTROL_SHA: ${{ needs.fresh-provider-controls.outputs.chocolatey_sha }}
          CONAN_CONTROL_SHA: ${{ needs.fresh-provider-controls.outputs.conan_sha }}
          CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
          CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
          CLOUDSMITH_PREFLIGHT_USERNAME: ${{ vars.CLOUDSMITH_PREFLIGHT_SERVICE_USERNAME }}
          CLOUDSMITH_PUBLISH_USERNAME: ${{ vars.CLOUDSMITH_PUBLISH_SERVICE_USERNAME }}
          HOMEBREW_REPOSITORY_ID: ${{ vars.HOMEBREW_APP_REPOSITORY_ID }}
          HOMEBREW_BOT_LOGIN: ${{ vars.HOMEBREW_APP_BOT_LOGIN }}
          CHOCOLATEY_REPOSITORY_ID: ${{ vars.CHOCOLATEY_APP_REPOSITORY_ID }}
          CONAN_RECIPE_OWNER: ${{ vars.CONAN_RECIPE_APP_OWNER }}
          CONAN_RECIPE_REPOSITORY: ${{ vars.CONAN_RECIPE_APP_REPOSITORY }}
          CONAN_RECIPE_REPOSITORY_ID: ${{ vars.CONAN_RECIPE_APP_REPOSITORY_ID }}
          CONAN_CONTROL_REPOSITORY_ID: ${{ vars.CONAN_BROKER_APP_REPOSITORY_ID }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.construct_core
          --root . --output out --version "${VERSION}" --tag "${TAG}"
          --commit "${COMMIT}" --source-date-epoch "${SOURCE_DATE_EPOCH}"
          --release-kind "${RELEASE_KIND}" --repository "${GITHUB_REPOSITORY}"
          --primary-fingerprint "${PRIMARY_FINGERPRINT}"
          --artifact-fingerprint "${ARTIFACT_SUBKEY_FINGERPRINT}"
          --homebrew-control-commit "${HOMEBREW_CONTROL_SHA}"
          --chocolatey-control-commit "${CHOCOLATEY_CONTROL_SHA}"
          --conan-control-commit "${CONAN_CONTROL_SHA}"
          --cloudsmith-namespace "${CLOUDSMITH_NAMESPACE}"
          --cloudsmith-repository "${CLOUDSMITH_REPOSITORY}"
          --cloudsmith-preflight-username "${CLOUDSMITH_PREFLIGHT_USERNAME}"
          --cloudsmith-publish-username "${CLOUDSMITH_PUBLISH_USERNAME}"
          --homebrew-repository-id "${HOMEBREW_REPOSITORY_ID}"
          --homebrew-bot-login "${HOMEBREW_BOT_LOGIN}"
          --chocolatey-repository-id "${CHOCOLATEY_REPOSITORY_ID}"
          --conan-fork-repository "${CONAN_RECIPE_OWNER}/${CONAN_RECIPE_REPOSITORY}"
          --conan-fork-repository-id "${CONAN_RECIPE_REPOSITORY_ID}"
          --conan-control-repository-id "${CONAN_CONTROL_REPOSITORY_ID}"
      - name: Upload core artifact part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  build-native:
    name: Build ${{ matrix.format }} ${{ matrix.id }}
    if: ${{ needs.contract.outputs.release_kind == 'stable' && needs.repository-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - preparation-gate
      - construct-core
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.repository-readiness.outputs.native_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.repository-readiness.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download canonical source archive for RPM construction
        if: ${{ matrix.format == 'rpm' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: core
      - name: Build native package
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          TAG: ${{ inputs.tag }}
          FORMAT: ${{ matrix.format }}
          ROUTE_ID: ${{ matrix.id }}
          DISTRIBUTION: ${{ matrix.distribution }}
          RELEASE: ${{ matrix.release }}
          ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_DATE_EPOCH: ${{ needs.repository-readiness.outputs.source_date_epoch }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.native_builder run
          --lock release/native-builders/lock.json --image "${{ matrix.builder_image }}"
          --kind "${FORMAT}" --version "${VERSION}" --tag "${TAG}"
          --repository "${GITHUB_REPOSITORY}" --target-id "${ROUTE_ID}"
          --distribution "${DISTRIBUTION}"
          --release "${RELEASE}" --architecture "${ARCHITECTURE}"
          --source-date-epoch "${SOURCE_DATE_EPOCH}" --core core --output out
      - name: Upload native package artifact part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.format }}-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  build-windows:
    name: Build signed-anchor Windows payload input
    if: ${{ needs.contract.outputs.release_kind == 'stable' && needs.repository-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - preparation-gate
      - construct-core
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.repository-readiness.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the reviewed Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ vars.WINDOWS_RELEASE_PYTHON_VERSION }}
          check-latest: false
      - name: Enter the installed x64 Visual Studio developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install the exact hash-locked Conan 2 client
        env:
          WINDOWS_RELEASE_CONAN_VERSION: ${{ vars.WINDOWS_RELEASE_CONAN_VERSION }}
        run: >-
          & ./scripts/release/install_windows_conan.ps1
          -PythonPath (Get-Command python.exe -CommandType Application).Source
          -ExpectedVersion $env:WINDOWS_RELEASE_CONAN_VERSION
          -Requirements release/windows/conan-requirements.txt
          -GitHubPath $env:GITHUB_PATH
      - name: Build and package the MSVC 2022 SDK
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          TAG: ${{ inputs.tag }}
          WINDOWS_RELEASE_CMAKE_VERSION: ${{ vars.WINDOWS_RELEASE_CMAKE_VERSION }}
          WINDOWS_RELEASE_CONAN_VERSION: ${{ vars.WINDOWS_RELEASE_CONAN_VERSION }}
          WINDOWS_RELEASE_CHOCO_VERSION: ${{ vars.WINDOWS_RELEASE_CHOCO_VERSION }}
          WINDOWS_RELEASE_PYTHON_VERSION: ${{ vars.WINDOWS_RELEASE_PYTHON_VERSION }}
          WINDOWS_RELEASE_VCTOOLS_VERSION: ${{ vars.WINDOWS_RELEASE_VCTOOLS_VERSION }}
          WINDOWS_RELEASE_MSC_VER: ${{ vars.WINDOWS_RELEASE_MSC_VER }}
        run: >-
          & ./scripts/release/build_windows.ps1
          -Version $env:VERSION -Tag $env:TAG -Repository $env:GITHUB_REPOSITORY
          -ExpectedCMakeVersion $env:WINDOWS_RELEASE_CMAKE_VERSION
          -ExpectedConanVersion $env:WINDOWS_RELEASE_CONAN_VERSION
          -ExpectedChocolateyVersion $env:WINDOWS_RELEASE_CHOCO_VERSION
          -ExpectedPythonVersion $env:WINDOWS_RELEASE_PYTHON_VERSION
          -ExpectedVCToolsVersion $env:WINDOWS_RELEASE_VCTOOLS_VERSION
          -ExpectedMscVer ([int]$env:WINDOWS_RELEASE_MSC_VER)
      - name: Upload Windows artifact part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  build-abi:
    name: Build canonical ABI evidence and compare compatible lines
    if: ${{ needs.contract.outputs.release_kind == 'stable' && needs.repository-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - preparation-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout the exact tagged ABI policy and source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.repository-readiness.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build the corpus in the digest-pinned offline builder
        env:
          ABI_BUILDER_IMAGE: ${{ vars.ABI_BUILDER_IMAGE }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.repository-readiness.outputs.source_date_epoch }}
          ABI_IO: ${{ runner.temp }}/abi-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.abi_build container-build
          --builder-image "${ABI_BUILDER_IMAGE}" --source . --io-directory "${ABI_IO}"
          --tag "${TAG}" --commit "${COMMIT}" --source-date-epoch "${SOURCE_DATE_EPOCH}"
      - name: Select the exact immutable ABI baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          ABI_IO: ${{ runner.temp }}/abi-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh api --paginate --slurp -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPOSITORY}/releases?per_page=100" > "${ABI_IO}/releases.json"
          python3 -I -S scripts/run_release_tool.py release.abi_policy select \
            --tag "${TAG}" --catalog "${ABI_IO}/releases.json" \
            --policy release/abi-policy.json --selection "${ABI_IO}/selection.json" \
            --decision "${ABI_IO}/decision.json" --github-output "${GITHUB_OUTPUT}"
      - name: Read and plan the baseline control assets
        if: ${{ steps.baseline.outputs.has_baseline == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASELINE_RELEASE_ID: ${{ steps.baseline.outputs.baseline_release_id }}
          ABI_IO: ${{ runner.temp }}/abi-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh api --paginate --slurp -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPOSITORY}/releases/${BASELINE_RELEASE_ID}/assets?per_page=100" \
            > "${ABI_IO}/baseline-assets.json"
          python3 -I -S scripts/run_release_tool.py release.abi_policy plan-downloads \
            --selection "${ABI_IO}/selection.json" --assets "${ABI_IO}/baseline-assets.json" \
            --output "${ABI_IO}/download-plan.json"
      - name: Download and authenticate the exact baseline bundle
        if: ${{ steps.baseline.outputs.has_baseline == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ABI_IO: ${{ runner.temp }}/abi-${{ github.run_id }}-${{ github.run_attempt }}
          PRIMARY_FINGERPRINT: ${{ vars.RELEASE_PRIMARY_FINGERPRINT }}
          TAG_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_TAG_SUBKEY_FINGERPRINT }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
        run: |
          python3 -I -S scripts/run_release_tool.py release.abi_policy download \
            --plan "${ABI_IO}/download-plan.json" --repository "${REPOSITORY}" \
            --directory "${ABI_IO}/baseline"
          python3 -I -S scripts/run_release_tool.py release.abi_policy verify-bundle \
            --selection "${ABI_IO}/selection.json" --assets "${ABI_IO}/baseline-assets.json" \
            --directory "${ABI_IO}/baseline" --public-key keys/release-signing-key.asc \
            --primary-fingerprint "${PRIMARY_FINGERPRINT}" \
            --tag-fingerprint "${TAG_SUBKEY_FINGERPRINT}" \
            --artifact-fingerprint "${ARTIFACT_SUBKEY_FINGERPRINT}" \
            --output "${ABI_IO}/baseline-evidence.json"
      - name: Compare with the exact builder-bound abidiff binary
        if: ${{ steps.baseline.outputs.has_baseline == 'true' }}
        env:
          ABI_BUILDER_IMAGE: ${{ vars.ABI_BUILDER_IMAGE }}
          ABI_IO: ${{ runner.temp }}/abi-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.abi_build container-compare
          --builder-image "${ABI_BUILDER_IMAGE}" --source . --io-directory "${ABI_IO}"
      - name: Upload canonical ABI artifact part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-abi-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/abi-${{ github.run_id }}-${{ github.run_attempt }}/output/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
      - name: Preserve ABI identity, selection, and comparison evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-abi-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/abi-${{ github.run_id }}-${{ github.run_attempt }}/selection.json
            ${{ runner.temp }}/abi-${{ github.run_id }}-${{ github.run_attempt }}/decision.json
            ${{ runner.temp }}/abi-${{ github.run_id }}-${{ github.run_attempt }}/baseline-evidence.json
            ${{ runner.temp }}/abi-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  assemble-unsigned:
    name: Assemble and bind unsigned release payloads
    if: >-
      ${{ always() && needs.construct-core.result == 'success' &&
          (needs.build-native.result == 'success' || needs.build-native.result == 'skipped') &&
          (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
          (needs.build-abi.result == 'success' || needs.build-abi.result == 'skipped') }}
    needs:
      - contract
      - repository-readiness
      - construct-core
      - build-native
      - build-windows
      - build-abi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout protected current release construction code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download core artifact part
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: parts
      - name: Download APT artifact parts
        if: ${{ needs.contract.outputs.release_kind == 'stable' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-apt-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: parts
          merge-multiple: true
      - name: Download RPM artifact parts
        if: ${{ needs.contract.outputs.release_kind == 'stable' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-rpm-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: parts
          merge-multiple: true
      - name: Download Windows artifact part
        if: ${{ needs.contract.outputs.release_kind == 'stable' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: parts
      - name: Download ABI artifact part
        if: ${{ needs.contract.outputs.release_kind == 'stable' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-abi-${{ github.run_id }}-${{ github.run_attempt }}
          path: parts
      - name: Construct release manifest and unsigned checksum boundary
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          PRIMARY_FINGERPRINT: ${{ vars.RELEASE_PRIMARY_FINGERPRINT }}
          TAG_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_TAG_SUBKEY_FINGERPRINT }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.assemble_unsigned
          --parts parts --output unsigned --version "${VERSION}" --tag "${TAG}"
          --commit "${COMMIT}" --primary-fingerprint "${PRIMARY_FINGERPRINT}"
          --tag-subkey-fingerprint "${TAG_SUBKEY_FINGERPRINT}"
          --artifact-subkey-fingerprint "${ARTIFACT_SUBKEY_FINGERPRINT}"
      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  signing:
    name: Sign the assembled release payloads
    if: ${{ needs.repository-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - assemble-unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-signing
    permissions:
      contents: read
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - name: Checkout protected current signing tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download unsigned release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed
      - name: Verify unsigned boundary and create detached signatures
        env:
          RELEASE_GPG_PRIVATE_KEY_B64: ${{ secrets.RELEASE_GPG_PRIVATE_KEY_B64 }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
        run: bash scripts/release/sign_release.sh signed
      - name: Upload signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
      - name: Emit fixed signing result
        id: result
        run: echo 'result=SIGNED' >> "${GITHUB_OUTPUT}"

  candidate-gate:
    name: Verify the complete signed candidate before publication
    if: ${{ needs.repository-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - signing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.verify.outputs.manifest_sha256 }}
    steps:
      - name: Checkout protected current verification policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download the signed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Verify exact identity, inventory, checksums, and signatures
        id: verify
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          PRIMARY_FINGERPRINT: ${{ vars.RELEASE_PRIMARY_FINGERPRINT }}
          TAG_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_TAG_SUBKEY_FINGERPRINT }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
        run: |
          python3 -I -S scripts/run_release_tool.py release.verify_candidate \
            --directory candidate --tag "${TAG}" --commit "${COMMIT}" \
            --primary-fingerprint "${PRIMARY_FINGERPRINT}" \
            --tag-fingerprint "${TAG_SUBKEY_FINGERPRINT}" \
            --artifact-fingerprint "${ARTIFACT_SUBKEY_FINGERPRINT}" \
            --public-key keys/release-signing-key.asc --targets packaging/targets.json \
            --native-builder-lock release/native-builders/lock.json \
            --conan-requirements packaging/conan-center/requirements.json \
            --release-notes included \
            --github-output "${GITHUB_OUTPUT}"
      - name: Upload the verified candidate handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  validate-homebrew-package:
    name: Validate Homebrew package (${{ matrix.bottle_tag }})
    if: ${{ needs.contract.outputs.release_kind == 'stable' && needs.repository-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - candidate-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            bottle_tag: sequoia
          - runner: macos-15
            bottle_tag: arm64_sequoia
          - runner: ubuntu-24.04
            bottle_tag: x86_64_linux
          - runner: ubuntu-24.04-arm
            bottle_tag: arm64_linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Configure Linuxbrew command path
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          echo /home/linuxbrew/.linuxbrew/bin >>"${GITHUB_PATH}"
      - name: Checkout protected current package validation policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download signed immutable-release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Audit, install, test, and consume the exact formula
        env:
          VERSION: ${{ needs.contract.outputs.version }}
        shell: bash
        run: >-
          scripts/release/validate_homebrew_candidate.sh
          "${VERSION}" release-assets
          "${RUNNER_TEMP}/mcp-cpp-sdk-homebrew-validation"

  validate-conan-linux:
    name: Validate ConanCenter recipe (Linux shared and static)
    if: ${{ needs.contract.outputs.release_kind == 'stable' && needs.repository-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - candidate-gate
    runs-on: ${{ fromJSON(needs.repository-readiness.outputs.conan_builder).runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout protected current Conan validation policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download signed immutable-release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Create and consume the exact recipe with both linkages
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          BUILDER_IMAGE: ${{ fromJSON(needs.repository-readiness.outputs.conan_builder).builder_image }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.native_builder run
          --lock release/native-builders/lock.json --image "${BUILDER_IMAGE}"
          --kind conan --target-id conan-linux-x86_64 --architecture x86_64
          --version "${VERSION}" --assets release-assets --output conan-validation
      - name: Upload exact Linux Conan validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conan-validation-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: conan-validation/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  validate-conan-windows:
    name: Validate ConanCenter recipe (Windows shared and static)
    if: ${{ needs.contract.outputs.release_kind == 'stable' && needs.repository-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - candidate-gate
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout protected current Conan validation policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the reviewed Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ vars.WINDOWS_RELEASE_PYTHON_VERSION }}
          check-latest: false
      - name: Enter the installed x64 Visual Studio developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install the exact hash-locked Conan 2 client
        env:
          WINDOWS_RELEASE_CONAN_VERSION: ${{ vars.WINDOWS_RELEASE_CONAN_VERSION }}
        run: >-
          & ./scripts/release/install_windows_conan.ps1
          -PythonPath (Get-Command python.exe -CommandType Application).Source
          -ExpectedVersion $env:WINDOWS_RELEASE_CONAN_VERSION
          -Requirements release/windows/conan-requirements.txt
          -GitHubPath $env:GITHUB_PATH
      - name: Download signed immutable-release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Create and consume the exact recipe with both linkages
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          WINDOWS_RELEASE_CONAN_VERSION: ${{ vars.WINDOWS_RELEASE_CONAN_VERSION }}
          WINDOWS_RELEASE_VCTOOLS_VERSION: ${{ vars.WINDOWS_RELEASE_VCTOOLS_VERSION }}
          WINDOWS_RELEASE_MSC_VER: ${{ vars.WINDOWS_RELEASE_MSC_VER }}
        run: |
          New-Item -ItemType Directory -Path conan-validation | Out-Null
          & ./scripts/release/validate_conan_candidate.ps1 `
            -Version $env:VERSION `
            -CandidateDirectory release-assets `
            -WorkDirectory "$env:RUNNER_TEMP/mcp-cpp-sdk-conan-candidate" `
            -Evidence conan-validation/conan-validation-windows.json `
            -ExpectedConanVersion $env:WINDOWS_RELEASE_CONAN_VERSION `
            -ExpectedVCToolsVersion $env:WINDOWS_RELEASE_VCTOOLS_VERSION `
            -ExpectedMscVer ([int]$env:WINDOWS_RELEASE_MSC_VER)
      - name: Upload exact Windows Conan validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conan-validation-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: conan-validation/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  package-validation-gate:
    name: Require package-manager validation before a stable anchor
    if: ${{ always() }}
    needs:
      - contract
      - repository-readiness
      - validate-homebrew-package
      - validate-conan-linux
      - validate-conan-windows
      - validate-aur-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout protected current package-result policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Enforce every required package-manager result
        env:
          RELEASE_KIND: ${{ needs.contract.outputs.release_kind }}
          ANCHOR_EXISTS: ${{ needs.repository-readiness.outputs.anchor_exists }}
          HOMEBREW_RESULT: ${{ needs.validate-homebrew-package.result }}
          CONAN_LINUX_RESULT: ${{ needs.validate-conan-linux.result }}
          CONAN_WINDOWS_RESULT: ${{ needs.validate-conan-windows.result }}
          AUR_RESULT: ${{ needs.validate-aur-packages.result }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.workflow_gate packages
          --release-kind "${RELEASE_KIND}" --anchor-exists "${ANCHOR_EXISTS}"
          --homebrew-result "${HOMEBREW_RESULT}"
          --conan-linux-result "${CONAN_LINUX_RESULT}"
          --conan-windows-result "${CONAN_WINDOWS_RESULT}"
          --aur-result "${AUR_RESULT}"

  validate-aur-packages:
    name: Validate AUR package (x86_64)
    if: ${{ needs.contract.outputs.release_kind == 'stable' && needs.repository-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - candidate-gate
    runs-on: ${{ fromJSON(needs.repository-readiness.outputs.aur_builder).runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout protected current validation policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download signed immutable-release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Build, install, and consume both AUR split packages
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          BUILDER_IMAGE: ${{ fromJSON(needs.repository-readiness.outputs.aur_builder).builder_image }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.native_builder run
          --lock release/native-builders/lock.json --image "${BUILDER_IMAGE}"
          --kind aur --target-id aur-x86_64 --architecture x86_64
          --version "${VERSION}" --assets release-assets --output aur-validation

  validation-complete:
    name: Validation completed without publication
    if: ${{ always() && needs.contract.outputs.mode == 'validate' && needs.preparation-gate.result == 'success' }}
    needs:
      - contract
      - repository-readiness
      - preparation-gate
      - build-abi
      - candidate-gate
      - package-validation-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact tagged validation-result policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require complete construction and signing validation
        env:
          ANCHOR_EXISTS: ${{ needs.repository-readiness.outputs.anchor_exists }}
          RELEASE_KIND: ${{ needs.contract.outputs.release_kind }}
          CANDIDATE_RESULT: ${{ needs.candidate-gate.result }}
          ABI_RESULT: ${{ needs.build-abi.result }}
          PACKAGE_GATE_RESULT: ${{ needs.package-validation-gate.result }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.workflow_gate validation
          --anchor-exists "${ANCHOR_EXISTS}" --release-kind "${RELEASE_KIND}"
          --candidate-result "${CANDIDATE_RESULT}" --abi-result "${ABI_RESULT}"
          --package-gate-result "${PACKAGE_GATE_RESULT}"
      - name: Report read-only completion
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNELS: ${{ needs.contract.outputs.selection_label }}
        run: |
          echo "Validated ${RELEASE_TAG}, channels ${RELEASE_CHANNELS}."
          echo "No GitHub Release, attestation, downstream dispatch, package publication, or provider mutation occurred."
          echo "Validation artifacts and protected-environment approvals remain internal to this workflow run."

  attestation:
    name: Attest signed release assets
    if: ${{ needs.contract.outputs.mode == 'publish' && needs.repository-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - candidate-gate
      - package-validation-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-github
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - name: Checkout protected current attestation policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed
      - name: Select published attestation subjects
        run: |
          mkdir subjects
          find signed -maxdepth 1 -type f ! -name RELEASE_NOTES.md -exec cp {} subjects/ \;
      - name: Create GitHub build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: subjects/*
      - name: Emit fixed attestation result
        id: result
        run: echo 'result=ATTESTED' >> "${GITHUB_OUTPUT}"

  github-release:
    name: Publish the immutable GitHub Release
    if: ${{ needs.contract.outputs.mode == 'publish' && needs.repository-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - candidate-gate
      - attestation
      - package-validation-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-github
    permissions:
      contents: write
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - name: Checkout protected current publication policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed
      - name: Create and publish release under repository immutability
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_KIND: ${{ needs.contract.outputs.release_kind }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          TAG_OBJECT_SHA: ${{ needs.repository-readiness.outputs.tag_object_sha }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
        run: |
          python3 -I -S scripts/run_release_tool.py release.github_publication create-release \
            --directory signed --repository "${REPOSITORY}" \
            --repository-id "${REPOSITORY_ID}" --tag "${TAG}" \
