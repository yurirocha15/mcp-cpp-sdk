name: Release

run-name: "release ${{ inputs.tag }} (${{ inputs.mode }}; ${{ inputs.targets }})"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact annotated release tag, for example v0.2.0"
        required: true
        type: string
      mode:
        description: "Validate without writes, or publish"
        required: true
        type: choice
        options:
          - validate
          - publish
      targets:
        description: "all for a fresh stable release; canonical subsets are retries"
        required: true
        default: all
        type: string
      ledger_issue:
        description: "Existing manually-created PREPARING release-ledger issue number"
        required: true
        type: string
      confirmation:
        description: "Exact mode:tag:targets:ledger_issue confirmation"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: release-publishing
  cancel-in-progress: false

env:
  RELEASE_ARTIFACT_RETENTION_DAYS: "1"

jobs:
  contract:
    name: Validate dispatch contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.contract.outputs.mode }}
      version: ${{ steps.contract.outputs.version }}
      release_kind: ${{ steps.contract.outputs.release_kind }}
      normalized_targets: ${{ steps.contract.outputs.normalized_targets }}
      ledger_issue: ${{ steps.contract.outputs.ledger_issue }}
      retry: ${{ steps.contract.outputs.retry }}
      target_github: ${{ steps.contract.outputs.target_github }}
      target_conan2: ${{ steps.contract.outputs.target_conan2 }}
      target_apt: ${{ steps.contract.outputs.target_apt }}
      target_rpm: ${{ steps.contract.outputs.target_rpm }}
      target_aur: ${{ steps.contract.outputs.target_aur }}
      target_homebrew: ${{ steps.contract.outputs.target_homebrew }}
      target_chocolatey: ${{ steps.contract.outputs.target_chocolatey }}
    steps:
      - name: Checkout protected contract validator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate untrusted dispatch inputs
        id: contract
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_TARGETS: ${{ inputs.targets }}
          DISPATCH_LEDGER_ISSUE: ${{ inputs.ledger_issue }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_OWNER_ID: ${{ github.repository_owner_id }}
          EXPECTED_REPOSITORY: ${{ vars.RELEASE_EXPECTED_REPOSITORY }}
          EXPECTED_REPOSITORY_ID: ${{ vars.RELEASE_EXPECTED_REPOSITORY_ID }}
          EXPECTED_OWNER_ID: ${{ vars.RELEASE_EXPECTED_OWNER_ID }}
        run: python3 -I -S scripts/release_dispatch_contract.py

  policy:
    name: Offline release workflow policy
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout protected source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run offline policy and release-tool tests
        run: |
          python3 scripts/check_release_workflow.py
          PYTHONPATH=scripts python3 -m unittest -v \
            scripts/test_release_dispatch_contract.py \
            scripts/test_release_workflow_policy.py
          python3 -m unittest discover -s test/release -p 'test_*.py' -v
      - name: Run actionlint when preinstalled
        run: |
          if command -v actionlint >/dev/null 2>&1; then
            actionlint -no-color -ignore 'label ".*" is unknown' .github/workflows/release.yml
          else
            echo "actionlint is unavailable; offline policy checks completed"
          fi

  repository-readiness:
    name: Validate tagged release identity
    needs:
      - contract
      - policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.readiness.outputs.commit }}
      source_date_epoch: ${{ steps.readiness.outputs.source_date_epoch }}
    steps:
      - name: Checkout source and tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version, annotated tag, signature, and changelog
        id: readiness
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_VERSION: ${{ needs.contract.outputs.version }}
          PRIMARY_FINGERPRINT: ${{ vars.RELEASE_PRIMARY_FINGERPRINT }}
          TAG_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_TAG_SUBKEY_FINGERPRINT }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
        run: |
          python3 -I -S <<'PY'
          from datetime import date
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          def git(*arguments: str, check: bool = True) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  ["git", *arguments], check=check, text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              )

          tag = os.environ["DISPATCH_TAG"]
          version = os.environ["DISPATCH_VERSION"]
          object_type = git("cat-file", "-t", f"refs/tags/{tag}", check=False)
          if object_type.returncode != 0 or object_type.stdout.strip() != "tag":
              raise SystemExit("release requires an existing annotated tag")
          commit = git("rev-list", "-n", "1", f"refs/tags/{tag}").stdout.strip()
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("tag did not resolve to one commit")
          if git("merge-base", "--is-ancestor", commit, "origin/main", check=False).returncode:
              raise SystemExit("tag commit is not reachable from origin/main")
          tagged_version = git("show", f"{commit}:VERSION", check=False)
          if tagged_version.returncode or tagged_version.stdout.strip() != version:
              raise SystemExit("VERSION in the tagged tree does not match the tag")
          changelog = git("show", f"{commit}:CHANGELOG.md", check=False)
          heading = re.compile(
              rf"(?m)^## \[{re.escape(version)}\] - ([0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}})$"
          )
          match = heading.search(changelog.stdout) if changelog.returncode == 0 else None
          if match is None:
              raise SystemExit("tagged CHANGELOG.md lacks an exact dated version heading")
          try:
              release_date = date.fromisoformat(match.group(1))
          except ValueError as error:
              raise SystemExit("tagged CHANGELOG.md contains an invalid release date") from error
          if release_date > date.today():
              raise SystemExit("tagged CHANGELOG.md release date is in the future")

          key_path = Path("keys/release-signing-key.asc")
          fingerprints = {
              "primary": os.environ["PRIMARY_FINGERPRINT"],
              "tag": os.environ["TAG_SUBKEY_FINGERPRINT"],
              "artifact": os.environ["ARTIFACT_SUBKEY_FINGERPRINT"],
          }
          if not key_path.is_file():
              raise SystemExit("trusted release public key is missing")
          if any(re.fullmatch(r"[0-9A-F]{40}|[0-9A-F]{64}", value) is None for value in fingerprints.values()):
              raise SystemExit("release fingerprint variables are missing or invalid")
          if len(set(fingerprints.values())) != 3:
              raise SystemExit("release fingerprint roles must be distinct")
          with tempfile.TemporaryDirectory() as home:
              environment = {**os.environ, "GNUPGHOME": home}
              shown = subprocess.run(
                  ["gpg", "--batch", "--with-colons", "--import-options", "show-only", "--import", str(key_path)],
                  check=True, text=True, stdout=subprocess.PIPE, env=environment,
              ).stdout.splitlines()
              actual = {line.split(":")[9] for line in shown if line.startswith("fpr:")}
              if actual != set(fingerprints.values()):
                  raise SystemExit("public key fingerprints do not exactly match configured roles")
              subprocess.run(["gpg", "--batch", "--import", str(key_path)], check=True, env=environment)
              status = subprocess.run(
                  ["git", "verify-tag", "--raw", tag], check=False, text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, env=environment,
              )
              if status.returncode:
                  raise SystemExit("annotated tag signature verification failed")
              status_path = Path(home) / "tag.status"
              status_path.write_text(status.stdout, encoding="utf-8")
              subprocess.run(
                  ["python3", "-I", "-S", "release/verify_gnupg_status.py", "--status", str(status_path),
                   "--signing-fingerprint", fingerprints["tag"], "--primary-fingerprint", fingerprints["primary"]],
                  check=True,
              )

          epoch = git("show", "-s", "--format=%ct", commit).stdout.strip()
          if re.fullmatch(r"[1-9][0-9]*", epoch) is None:
              raise SystemExit("tag commit timestamp is invalid")
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"commit={commit}\nsource_date_epoch={epoch}\n")
          PY

  ledger-readiness:
    name: Verify manual PREPARING ledger and anchor state
    needs:
      - contract
      - repository-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      anchor_exists: ${{ steps.ledger.outputs.anchor_exists }}
    steps:
      - name: Read and verify the ledger issue and existing release
        id: ledger
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          LEDGER_ISSUE: ${{ needs.contract.outputs.ledger_issue }}
          DISPATCH_MODE: ${{ needs.contract.outputs.mode }}
          RELEASE_KIND: ${{ needs.contract.outputs.release_kind }}
          IS_RETRY: ${{ needs.contract.outputs.retry }}
        run: |
          gh api "repos/${REPOSITORY}/issues/${LEDGER_ISSUE}" > issue.json
          python3 -I -S <<'PY'
          import json
          import os
          from pathlib import Path

          issue = json.loads(Path("issue.json").read_text(encoding="utf-8"))
          tag = os.environ["TAG"]
          expected_title = f"[release] {tag} PREPARING"
          marker = f"<!-- release-ledger:v1 tag={tag} state=PREPARING -->"
          if issue.get("pull_request") is not None or issue.get("state") != "open":
              raise SystemExit("ledger must be an open issue, not a pull request")
          if issue.get("title") != expected_title or marker not in (issue.get("body") or ""):
              raise SystemExit("ledger title or PREPARING marker is not exact")
          if issue.get("author_association") not in {"OWNER", "MEMBER", "COLLABORATOR"}:
              raise SystemExit("ledger was not created by a trusted repository participant")
          labels = {item.get("name") for item in issue.get("labels", [])}
          if "release-ledger" not in labels:
              raise SystemExit("ledger issue requires the release-ledger label")
          PY
          anchor_exists=false
          if gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            anchor_exists=true
          fi
          if [[ "${DISPATCH_MODE}" == publish ]]; then
            if [[ "${IS_RETRY}" == true && "${anchor_exists}" != true ]]; then
              echo "::error::A partial stable publication is a retry and requires an existing immutable GitHub release"
              exit 1
            fi
            if [[ "${RELEASE_KIND}" == stable && "${IS_RETRY}" != true && "${anchor_exists}" == true ]]; then
              echo "::error::A fresh stable publication requires no existing release; select a canonical target subset for retry"
              exit 1
            fi
          fi
          echo "anchor_exists=${anchor_exists}" >> "${GITHUB_OUTPUT}"

  immutability-gate:
    name: Verify immutable Releases with an administration-read App
    if: ${{ needs.contract.outputs.mode == 'publish' }}
    needs:
      - contract
      - repository-readiness
      - ledger-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-admin-read
    permissions:
      contents: read
    steps:
      - name: Create a repository-administration read token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_ADMIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_ADMIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
      - name: Require repository-level immutable Releases
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPOSITORY}/immutable-releases" > immutable-releases.json
          python3 -I -S <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("immutable-releases.json").read_text(encoding="utf-8"))
          if set(value) != {"enabled", "enforced_by_owner"}:
              raise SystemExit("immutable Releases response schema is unexpected")
          if value["enabled"] is not True or not isinstance(value["enforced_by_owner"], bool):
              raise SystemExit("immutable Releases are not enabled")
          PY

  validation-complete:
    name: Validation completed without publication
    if: ${{ needs.contract.outputs.mode == 'validate' }}
    needs:
      - contract
      - repository-readiness
      - ledger-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Report read-only completion
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGETS: ${{ needs.contract.outputs.normalized_targets }}
          LEDGER_ISSUE: ${{ needs.contract.outputs.ledger_issue }}
        run: |
          echo "Validated ${RELEASE_TAG}, targets ${RELEASE_TARGETS}, ledger #${LEDGER_ISSUE}."
          echo "No release, issue, dispatch, package, deployment, or upload was created."

  publication-gate:
    name: Enforce the exact publication kill switch
    if: ${{ needs.contract.outputs.mode == 'publish' }}
    needs:
      - contract
      - repository-readiness
      - ledger-readiness
      - immutability-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require RELEASE_PUBLISHING_ENABLED
        env:
          RELEASE_PUBLISHING_ENABLED: ${{ vars.RELEASE_PUBLISHING_ENABLED }}
        run: |
          if [[ "${RELEASE_PUBLISHING_ENABLED}" != true ]]; then
            echo "::error::RELEASE_PUBLISHING_ENABLED must be exactly true"
            exit 1
          fi

  construct-core:
    name: Construct deterministic source and recipe artifacts
    if: ${{ needs.ledger-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - ledger-readiness
      - publication-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout the exact tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.repository-readiness.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build deterministic archives, SBOMs, and publisher recipes
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.repository-readiness.outputs.source_date_epoch }}
          RELEASE_KIND: ${{ needs.contract.outputs.release_kind }}
          PRIMARY_FINGERPRINT: ${{ vars.RELEASE_PRIMARY_FINGERPRINT }}
          TAG_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_TAG_SUBKEY_FINGERPRINT }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
        run: |
          rm -rf out
          mkdir -p out
          python3 -m release.cli source-archives \
            --root . --inventory release/source-archive-inventory.txt \
            --version "${VERSION}" --source-date-epoch "${SOURCE_DATE_EPOCH}" --output-dir out
          python3 -m release.cli sbom \
            --root . --inventory release/source-archive-inventory.txt \
            --version "${VERSION}" --source-date-epoch "${SOURCE_DATE_EPOCH}" \
            --namespace-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" --output-dir out
          cp keys/release-signing-key.asc out/release-signing-key.asc
          python3 -I -S <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path
          import sys

          sys.path.insert(0, ".")
          from release.templates import render_file

          out = Path("out")
          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repository = os.environ["GITHUB_REPOSITORY"]
          tarball = out / f"mcp-cpp-sdk-{version}.tar.gz"
          source_sha = hashlib.sha256(tarball.read_bytes()).hexdigest()
          source_url = f"https://github.com/{repository}/releases/download/{tag}/{tarball.name}"
          source_tree = subprocess.run(
              ["git", "archive", "--format=tar", os.environ["COMMIT"]],
              check=True, stdout=subprocess.PIPE,
          ).stdout
          metadata = {
              "commit": os.environ["COMMIT"],
              "source_date_epoch": int(os.environ["SOURCE_DATE_EPOCH"]),
              "source_tree_sha256": hashlib.sha256(source_tree).hexdigest(),
              "source_sha256": source_sha,
          }
          (out / "core-metadata.json").write_text(json.dumps(metadata, sort_keys=True) + "\n", encoding="utf-8")
          (out / "RELEASE_NOTES.md").write_text(
              f"mcp-cpp-sdk {version}\n\nSee CHANGELOG.md in the signed source archive.\n",
              encoding="utf-8",
          )
          if os.environ["RELEASE_KIND"] == "stable":
              render_file(Path("packaging/aur/PKGBUILD.in"), out / "aur-PKGBUILD", {
                  "VERSION": version, "PKGREL": "1", "SOURCE_URL": source_url,
                  "SOURCE_SHA256": source_sha,
                  "SOURCE_SIGNATURE_URL": source_url + ".asc",
                  "PRIMARY_FINGERPRINT": os.environ["PRIMARY_FINGERPRINT"],
                  "ARTIFACT_SUBKEY_FINGERPRINT": os.environ["ARTIFACT_SUBKEY_FINGERPRINT"],
              })
              (out / "aur-SRCINFO").write_text(
                  "pkgbase = mcp-cpp-sdk\n\tpkgdesc = Model Context Protocol C++ SDK\n"
                  f"\tpkgver = {version}\n\tpkgrel = 1\n\turl = https://github.com/{repository}\n"
                  "\tarch = x86_64\n\tarch = aarch64\n\tlicense = Apache-2.0\n"
                  "\tmakedepends = boost>=1.74\n\tmakedepends = cmake>=3.20\n\tmakedepends = gtest\n\tmakedepends = ninja\n"
                  "\tdepends = boost-libs>=1.74\n\tdepends = nlohmann-json>=3.10.5\n\tdepends = openssl>=3.0\n"
                  "\toptions = !debug\n\toptions = staticlibs\n"
                  f"\tsource = mcp-cpp-sdk-{version}.tar.gz::{source_url}\n"
                  f"\tsource = mcp-cpp-sdk-{version}.tar.gz.asc::{source_url}.asc\n"
                  f"\tvalidpgpkeys = {os.environ['PRIMARY_FINGERPRINT']}\n"
                  f"\tsha256sums = {source_sha}\n\tsha256sums = SKIP\n"
                  "\npkgname = mcp-cpp-sdk\n\npkgname = mcp-cpp-sdk-static\n\tdepends = mcp-cpp-sdk\n",
                  encoding="utf-8",
              )
              render_file(Path("packaging/homebrew/mcp-cpp-sdk.rb.in"), out / "homebrew-mcp-cpp-sdk.rb", {
                  "VERSION": version, "SOURCE_URL": source_url, "SOURCE_SHA256": source_sha,
              })
              render_file(
                  Path("packaging/conan-center/config.yml.in"),
                  out / "conan-recipe-config.yml",
                  {"VERSION": version},
              )
              render_file(
                  Path("packaging/conan-center/all/conandata.yml.in"),
                  out / "conan-recipe-conandata.yml",
                  {"VERSION": version, "SOURCE_URL": source_url, "SOURCE_SHA256": source_sha},
              )
              for source, destination in (
                  ("packaging/conan-center/all/conanfile.py.in", "conan-recipe-conanfile.py"),
                  ("packaging/conan-center/all/test_package/CMakeLists.txt.in", "conan-recipe-test-CMakeLists.txt"),
                  ("packaging/conan-center/all/test_package/conanfile.py.in", "conan-recipe-test-conanfile.py"),
                  ("packaging/conan-center/all/test_package/test_package.cpp.in", "conan-recipe-test-test_package.cpp"),
              ):
                  shutil.copyfile(source, out / destination)
              (out / "conan-source.json").write_text(json.dumps({
                  "recipe": "mcp-cpp-sdk", "version": version, "tag": tag,
                  "commit": os.environ["COMMIT"], "source_url": source_url,
                  "source_sha256": source_sha,
              }, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload core artifact part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  build-apt:
    name: Build APT ${{ matrix.id }}
    if: ${{ needs.contract.outputs.target_apt == 'true' && needs.ledger-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - ledger-readiness
      - publication-gate
      - construct-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: ubuntu-jammy-amd64, distribution: ubuntu, release: jammy, architecture: amd64, runner: release-ubuntu-jammy-amd64}
          - {id: ubuntu-jammy-arm64, distribution: ubuntu, release: jammy, architecture: arm64, runner: release-ubuntu-jammy-arm64}
          - {id: ubuntu-noble-amd64, distribution: ubuntu, release: noble, architecture: amd64, runner: release-ubuntu-noble-amd64}
          - {id: ubuntu-noble-arm64, distribution: ubuntu, release: noble, architecture: arm64, runner: release-ubuntu-noble-arm64}
          - {id: ubuntu-resolute-amd64, distribution: ubuntu, release: resolute, architecture: amd64, runner: release-ubuntu-resolute-amd64}
          - {id: ubuntu-resolute-arm64, distribution: ubuntu, release: resolute, architecture: arm64, runner: release-ubuntu-resolute-arm64}
          - {id: debian-bookworm-amd64, distribution: debian, release: bookworm, architecture: amd64, runner: release-debian-bookworm-amd64}
          - {id: debian-bookworm-arm64, distribution: debian, release: bookworm, architecture: arm64, runner: release-debian-bookworm-arm64}
          - {id: debian-trixie-amd64, distribution: debian, release: trixie, architecture: amd64, runner: release-debian-trixie-amd64}
          - {id: debian-trixie-arm64, distribution: debian, release: trixie, architecture: arm64, runner: release-debian-trixie-arm64}
    runs-on: [self-hosted, release, "${{ matrix.runner }}"]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.repository-readiness.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build native Debian packages
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          RELEASE: ${{ matrix.release }}
          ROUTE_ID: ${{ matrix.id }}
          DISTRIBUTION: ${{ matrix.distribution }}
          ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_DATE_EPOCH: ${{ needs.repository-readiness.outputs.source_date_epoch }}
          DEBFULLNAME: mcp-cpp-sdk release automation
          DEBEMAIL: releases@users.noreply.github.com
        run: |
          test "$(dpkg --print-architecture)" = "${ARCHITECTURE}"
          rm -rf debian out
          rm -f ../*.deb ../*.changes ../*.buildinfo
          mkdir -p debian out
          python3 -I -S <<'PY'
          from datetime import datetime, timezone
          import os
          import shutil
          from pathlib import Path
          import sys

          sys.path.insert(0, ".")
          from release.model import SemVer
          from release.templates import render_file

          version = SemVer.parse(os.environ["VERSION"], stable_only=True)
          source = Path("packaging/debian")
          target = Path("debian")
          for template in source.rglob("*.in"):
              relative = template.relative_to(source)
              output = target / Path(str(relative).removesuffix(".in"))
              output.parent.mkdir(parents=True, exist_ok=True)
              tokens = {}
              if template.name == "control.in":
                  tokens = {"MAINTAINER": "mcp-cpp-sdk maintainers <releases@users.noreply.github.com>"}
              elif template.name == "copyright.in":
                  tokens = {"COPYRIGHT": "mcp-cpp-sdk contributors"}
              elif template.name == "changelog.in":
                  tokens = {
                      "DEBIAN_VERSION": version.debian_version,
                      "DEBIAN_DISTRIBUTION": os.environ["RELEASE"],
                      "MAINTAINER": "mcp-cpp-sdk maintainers <releases@users.noreply.github.com>",
                      "RFC2822_DATE": datetime.fromtimestamp(
                          int(os.environ["SOURCE_DATE_EPOCH"]), timezone.utc
                      ).strftime("%a, %d %b %Y %H:%M:%S +0000"),
                  }
              render_file(template, output, tokens)
              if template.name == "rules.in":
                  output.chmod(0o755)
          PY
          dpkg-buildpackage --build=binary --no-sign
          python3 -I -S <<'PY'
          import json
          import os
          from pathlib import Path

          packages = sorted(Path("..").glob("*.deb"))
          if not packages:
              raise SystemExit("Debian build produced no .deb packages")
          routes = []
          for package in packages:
              name = f"{os.environ['ROUTE_ID']}--{package.name}"
              package.replace(Path("out") / name)
              routes.append({"asset": name, "format": "apt", "distribution": os.environ["DISTRIBUTION"], "release": os.environ["RELEASE"]})
          Path("out", f"route-{os.environ['ROUTE_ID']}.json").write_text(json.dumps(routes, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload APT artifact part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apt-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  build-rpm:
    name: Build RPM ${{ matrix.id }}
    if: ${{ needs.contract.outputs.target_rpm == 'true' && needs.ledger-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - ledger-readiness
      - publication-gate
      - construct-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: fedora-43-x86_64, distribution: fedora, release: "43", architecture: x86_64, runner: release-fedora-43-x86_64}
          - {id: fedora-43-aarch64, distribution: fedora, release: "43", architecture: aarch64, runner: release-fedora-43-aarch64}
          - {id: fedora-44-x86_64, distribution: fedora, release: "44", architecture: x86_64, runner: release-fedora-44-x86_64}
          - {id: fedora-44-aarch64, distribution: fedora, release: "44", architecture: aarch64, runner: release-fedora-44-aarch64}
          - {id: el-9-x86_64, distribution: el, release: "9", architecture: x86_64, runner: release-el-9-x86_64}
          - {id: el-9-aarch64, distribution: el, release: "9", architecture: aarch64, runner: release-el-9-aarch64}
          - {id: el-10-x86_64, distribution: el, release: "10", architecture: x86_64, runner: release-el-10-x86_64}
          - {id: el-10-aarch64, distribution: el, release: "10", architecture: aarch64, runner: release-el-10-aarch64}
    runs-on: [self-hosted, release, "${{ matrix.runner }}"]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.repository-readiness.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download canonical source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: core
      - name: Build native RPM packages
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          TAG: ${{ inputs.tag }}
          ROUTE_ID: ${{ matrix.id }}
          DISTRIBUTION: ${{ matrix.distribution }}
          RELEASE: ${{ matrix.release }}
          ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_DATE_EPOCH: ${{ needs.repository-readiness.outputs.source_date_epoch }}
        run: |
          test "$(uname -m)" = "${ARCHITECTURE}"
          rm -rf rpmbuild out
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS} out
          cp "core/mcp-cpp-sdk-${VERSION}.tar.gz" rpmbuild/SOURCES/
          python3 -I -S <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, ".")
          from release.model import SemVer
          from release.templates import render_file

          version = SemVer.parse(os.environ["VERSION"], stable_only=True)
          rpm_version, rpm_release = version.rpm_version_release
          archive = Path("core") / f"mcp-cpp-sdk-{version}.tar.gz"
          render_file(Path("packaging/rpm/mcp-cpp-sdk.spec.in"), Path("rpmbuild/SPECS/mcp-cpp-sdk.spec"), {
              "RPM_VERSION": rpm_version,
              "RPM_RELEASE": rpm_release,
              "RPM_CHANGELOG_DATE": datetime.fromtimestamp(
                  int(os.environ["SOURCE_DATE_EPOCH"]), timezone.utc
              ).strftime("%a %b %d %Y"),
              "SOURCE_URL": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/{archive.name}",
              "SOURCE_SHA256": hashlib.sha256(archive.read_bytes()).hexdigest(),
          })
          PY
          rpmbuild --define "_topdir ${PWD}/rpmbuild" -ba rpmbuild/SPECS/mcp-cpp-sdk.spec
          python3 -I -S <<'PY'
          import json
          import os
          from pathlib import Path

          packages = sorted([*Path("rpmbuild/RPMS").rglob("*.rpm"), *Path("rpmbuild/SRPMS").glob("*.rpm")])
          if not packages:
              raise SystemExit("RPM build produced no packages")
          routes = []
          for package in packages:
              name = f"{os.environ['ROUTE_ID']}--{package.name}"
              package.replace(Path("out") / name)
              routes.append({"asset": name, "format": "rpm", "distribution": os.environ["DISTRIBUTION"], "release": os.environ["RELEASE"]})
          Path("out", f"route-{os.environ['ROUTE_ID']}.json").write_text(json.dumps(routes, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload RPM artifact part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rpm-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  build-windows:
    name: Build signed-anchor Windows payload input
    if: ${{ needs.contract.outputs.target_chocolatey == 'true' && needs.ledger-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - ledger-readiness
      - publication-gate
      - construct-core
    runs-on: [self-hosted, release, release-windows-x64-v143]
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.repository-readiness.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build and package the MSVC 2022 SDK
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          Remove-Item -Recurse -Force build,stage,out,chocolatey -ErrorAction SilentlyContinue
          python scripts/init.py
          python scripts/build.py --test
          cmake --install build/release --prefix stage --config Release
          New-Item -ItemType Directory -Force out | Out-Null
          $archive = "out/mcp-cpp-sdk-$env:VERSION-windows-x64-v143-md.zip"
          Compress-Archive -Path stage/* -DestinationPath $archive -CompressionLevel Optimal
          $sha = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$(Split-Path -Leaf $archive)"
          @{
            VERSION = $env:VERSION
            ARCHIVE_URL = $url
            ARCHIVE_SHA256 = $sha
          } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 install-values.json
          @{
            VERSION = $env:VERSION
            AUTHORS = "mcp-cpp-sdk contributors"
            OWNERS = "mcp-cpp-sdk maintainers"
            SUMMARY = "Model Context Protocol C++ SDK"
            DESCRIPTION = "C++20 Model Context Protocol SDK development package."
            PROJECT_URL = "https://github.com/$env:GITHUB_REPOSITORY"
            PACKAGE_SOURCE_URL = "https://github.com/$env:GITHUB_REPOSITORY"
            COPYRIGHT = "mcp-cpp-sdk contributors"
            TAGS = "mcp cpp sdk development admin"
          } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 nuspec-values.json
          python -m release.cli render --template packaging/chocolatey/chocolateyinstall.ps1.in --values install-values.json --output chocolatey/tools/chocolateyinstall.ps1
          Copy-Item packaging/chocolatey/chocolateyuninstall.ps1.in chocolatey/tools/chocolateyuninstall.ps1
          python -m release.cli render --template packaging/chocolatey/mcp-cpp-sdk.nuspec.in --values nuspec-values.json --output chocolatey/mcp-cpp-sdk.nuspec
          Copy-Item LICENSE chocolatey/LICENSE.txt
          "The archive SHA-256 is $sha and is bound by the immutable GitHub Release manifest." | Set-Content chocolatey/VERIFICATION.txt
          choco pack chocolatey/mcp-cpp-sdk.nuspec --outputdirectory out --yes
      - name: Upload Windows artifact part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  assemble-unsigned:
    name: Assemble and bind unsigned release payloads
    if: >-
      ${{ always() && needs.construct-core.result == 'success' &&
          (needs.build-apt.result == 'success' || needs.build-apt.result == 'skipped') &&
          (needs.build-rpm.result == 'success' || needs.build-rpm.result == 'skipped') &&
          (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') }}
    needs:
      - contract
      - repository-readiness
      - ledger-readiness
      - construct-core
      - build-apt
      - build-rpm
      - build-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout release construction code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.repository-readiness.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download core artifact part
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: parts
      - name: Download APT artifact parts
        if: ${{ needs.contract.outputs.target_apt == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-apt-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: parts
          merge-multiple: true
      - name: Download RPM artifact parts
        if: ${{ needs.contract.outputs.target_rpm == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-rpm-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: parts
          merge-multiple: true
      - name: Download Windows artifact part
        if: ${{ needs.contract.outputs.target_chocolatey == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: parts
      - name: Construct release manifest and unsigned checksum boundary
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          LEDGER_ISSUE: ${{ needs.contract.outputs.ledger_issue }}
          PRIMARY_FINGERPRINT: ${{ vars.RELEASE_PRIMARY_FINGERPRINT }}
          TAG_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_TAG_SUBKEY_FINGERPRINT }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
        run: |
          rm -rf unsigned
          python3 -I -S <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import sys

          sys.path.insert(0, ".")
          from release.artifacts import ArtifactRecord, build_release_manifest, build_sha256sums, canonical_json_bytes
          from release.model import SemVer

          parts = Path("parts")
          output = Path("unsigned")
          output.mkdir()
          internal = {"core-metadata.json"}
          routes = []
          for route_path in sorted(parts.glob("route-*.json")):
              value = json.loads(route_path.read_text(encoding="utf-8"))
              if not isinstance(value, list):
                  raise SystemExit("route fragment must be a list")
              routes.extend(value)
              internal.add(route_path.name)
          if routes:
              (output / "cloudsmith-routes.json").write_text(json.dumps(routes, sort_keys=True) + "\n", encoding="utf-8")
          for path in sorted(parts.iterdir()):
              if path.is_file() and path.name not in internal and not path.name.startswith("route-"):
                  destination = output / path.name
                  if destination.exists():
                      raise SystemExit(f"duplicate release asset name: {path.name}")
                  shutil.copyfile(path, destination)
          metadata = json.loads((parts / "core-metadata.json").read_text(encoding="utf-8"))
          payloads = []
          for path in sorted(output.iterdir()):
              if path.name == "RELEASE_NOTES.md":
                  continue
              role = "publisher-input"
              if path.name.endswith((".tar.gz", ".zip")):
                  role = "source-or-binary-archive"
              elif path.name.endswith((".deb", ".rpm", ".nupkg")):
                  role = "native-package"
              elif path.name.endswith((".spdx.json", ".cdx.json")):
                  role = "sbom"
              payloads.append(ArtifactRecord.from_path(path, role=role))
          manifest = build_release_manifest(
              version=SemVer.parse(os.environ["VERSION"]), tag=os.environ["TAG"], commit=os.environ["COMMIT"],
              source_tree_sha256=metadata["source_tree_sha256"], ledger_issue_id=os.environ["LEDGER_ISSUE"],
              ledger_issue_url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['LEDGER_ISSUE']}",
              primary_fingerprint=os.environ["PRIMARY_FINGERPRINT"],
              tag_subkey_fingerprint=os.environ["TAG_SUBKEY_FINGERPRINT"],
              artifact_subkey_fingerprint=os.environ["ARTIFACT_SUBKEY_FINGERPRINT"],
              payloads=payloads,
              dependency_closure=[
                  {"name": "boost", "minimum": "1.74"},
                  {"name": "nlohmann_json", "minimum": "3.10.5"},
                  {"name": "openssl", "minimum": "3.0"},
                  {"name": "zlib", "minimum": "1.2.11"},
              ],
              provenance_subjects=[{"name": record.name, "digest": {"sha256": record.sha256}} for record in payloads],
          )
          (output / "release-manifest.json").write_bytes(canonical_json_bytes(manifest))
          checksum_inputs = [path for path in output.iterdir() if path.name not in {"RELEASE_NOTES.md"}]
          (output / "UNSIGNED-SHA256SUMS").write_bytes(build_sha256sums(checksum_inputs))
          PY
      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  signing:
    name: Sign the assembled release payloads
    if: ${{ needs.ledger-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - ledger-readiness
      - assemble-unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-signing
    permissions:
      contents: read
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - name: Download unsigned release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed
      - name: Verify unsigned boundary and create detached signatures
        env:
          RELEASE_GPG_PRIVATE_KEY_B64: ${{ secrets.RELEASE_GPG_PRIVATE_KEY_B64 }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
        run: |
          cd signed
          sha256sum --check UNSIGNED-SHA256SUMS
          rm UNSIGNED-SHA256SUMS
          export GNUPGHOME="${RUNNER_TEMP}/release-gnupg"
          install -d -m 700 "${GNUPGHOME}"
          printf '%s' "${RELEASE_GPG_PRIVATE_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/release-key.asc"
          gpg --batch --import "${RUNNER_TEMP}/release-key.asc"
          gpg --batch --with-colons --list-secret-keys "${ARTIFACT_SUBKEY_FINGERPRINT}!" | grep -F "${ARTIFACT_SUBKEY_FINGERPRINT}"
          mapfile -t detached < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name 'release-manifest.json' \) -printf '%f\n' | sort)
          for asset in "${detached[@]}"; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "${ARTIFACT_SUBKEY_FINGERPRINT}!" --armor --detach-sign "${asset}" \
              <<<"${RELEASE_GPG_PASSPHRASE}"
          done
          python3 -I -S <<'PY'
          import hashlib
          from pathlib import Path

          excluded = {"RELEASE_NOTES.md", "SHA256SUMS", "SHA256SUMS.asc"}
          paths = sorted(path for path in Path(".").iterdir() if path.is_file() and path.name not in excluded)
          Path("SHA256SUMS").write_text(
              "".join(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n" for path in paths),
              encoding="ascii",
          )
          PY
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "${ARTIFACT_SUBKEY_FINGERPRINT}!" --armor --detach-sign SHA256SUMS \
            <<<"${RELEASE_GPG_PASSPHRASE}"
          rm -rf "${GNUPGHOME}" "${RUNNER_TEMP}/release-key.asc"
      - name: Upload signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
      - name: Emit fixed signing result
        id: result
        run: echo 'result=SIGNED' >> "${GITHUB_OUTPUT}"

  validate-aur-packages:
    name: Validate AUR package (${{ matrix.architecture }})
    if: ${{ needs.contract.outputs.target_aur == 'true' && needs.ledger-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - ledger-readiness
      - signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - {architecture: x86_64, runner: release-arch-x86_64}
          - {architecture: aarch64, runner: release-arch-aarch64}
    runs-on: [self-hosted, release, "${{ matrix.runner }}"]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Download signed immutable-release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Build, install, and consume both AUR split packages
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ needs.contract.outputs.version }}
        run: |
          test "$(uname -m)" = "${ARCHITECTURE}"
          rm -rf aur-check
          mkdir aur-check
          cp release-assets/aur-PKGBUILD aur-check/PKGBUILD
          cp release-assets/aur-SRCINFO aur-check/.SRCINFO
          cp "release-assets/mcp-cpp-sdk-${VERSION}.tar.gz" aur-check/
          cp "release-assets/mcp-cpp-sdk-${VERSION}.tar.gz.asc" aur-check/
          cp release-assets/release-signing-key.asc aur-check/
          cd aur-check
          export GNUPGHOME="${RUNNER_TEMP}/aur-validation-gnupg"
          install -d -m 700 "${GNUPGHOME}"
          trap 'rm -rf "${GNUPGHOME}"' EXIT
          gpg --batch --import release-signing-key.asc
          makepkg --printsrcinfo > generated.SRCINFO
          cmp --silent .SRCINFO generated.SRCINFO
          makepkg --verifysource --noconfirm
          makepkg --cleanbuild --noconfirm
          mapfile -t packages < <(makepkg --packagelist)
          test "${#packages[@]}" = 2
          for package in "${packages[@]}"; do
            test -s "${package}"
          done
          sudo pacman -U --noconfirm "${packages[@]}"
          mkdir consumer
          python3 -I -S <<'PY'
          from pathlib import Path

          Path("consumer/CMakeLists.txt").write_text(
              """cmake_minimum_required(VERSION 3.20)
          project(mcp_cpp_sdk_aur_consumer LANGUAGES CXX)
          find_package(mcp-cpp-sdk CONFIG REQUIRED COMPONENTS shared static)
          add_executable(shared-consumer main.cpp)
          target_link_libraries(shared-consumer PRIVATE mcp::sdk_shared)
          add_executable(static-consumer main.cpp)
          target_link_libraries(static-consumer PRIVATE mcp::sdk_static)
          """,
              encoding="utf-8",
          )
          Path("consumer/main.cpp").write_text(
              "#include <mcp/mcp.hpp>\nint main() { return 0; }\n",
              encoding="utf-8",
          )
          PY
          cmake -S consumer -B consumer/build -G Ninja
          cmake --build consumer/build
          ./consumer/build/shared-consumer
          ./consumer/build/static-consumer

  aur-validation-gate:
    name: Require native AUR validation when selected
    if: ${{ always() }}
    needs:
      - contract
      - ledger-readiness
      - validate-aur-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce selected-target validation result
        env:
          TARGET_AUR: ${{ needs.contract.outputs.target_aur }}
          ANCHOR_EXISTS: ${{ needs.ledger-readiness.outputs.anchor_exists }}
          VALIDATION_RESULT: ${{ needs.validate-aur-packages.result }}
        run: |
          expected=skipped
          if [[ "${TARGET_AUR}" == true && "${ANCHOR_EXISTS}" == false ]]; then
            expected=success
          fi
          test "${VALIDATION_RESULT}" = "${expected}"

  attestation:
    name: Attest signed release assets
    if: ${{ needs.ledger-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - ledger-readiness
      - signing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-github
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - name: Download signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed
      - name: Select published attestation subjects
        run: |
          mkdir subjects
          find signed -maxdepth 1 -type f ! -name RELEASE_NOTES.md -exec cp {} subjects/ \;
      - name: Create GitHub build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: subjects/*
      - name: Emit fixed attestation result
        id: result
        run: echo 'result=ATTESTED' >> "${GITHUB_OUTPUT}"

  github-release:
    name: Publish the immutable GitHub Release
    if: ${{ needs.ledger-readiness.outputs.anchor_exists == 'false' }}
    needs:
      - contract
      - repository-readiness
      - ledger-readiness
      - signing
      - attestation
      - aur-validation-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-github
    permissions:
      contents: write
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - name: Download signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed
      - name: Create and publish release under repository immutability
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_KIND: ${{ needs.contract.outputs.release_kind }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release appeared after preflight; refusing an ambiguous mutation"
            exit 1
          fi
          mapfile -t assets < <(find signed -maxdepth 1 -type f ! -name RELEASE_NOTES.md -print | sort)
          arguments=("${TAG}" "${assets[@]}" --repo "${REPOSITORY}" --verify-tag --title "mcp-cpp-sdk ${TAG}" --notes-file signed/RELEASE_NOTES.md)
          if [[ "${RELEASE_KIND}" == rc ]]; then
            arguments+=(--prerelease --latest=false)
          fi
          gh release create "${arguments[@]}"
      - name: Emit fixed GitHub publication result
        id: result
        run: echo 'result=PUBLISHED' >> "${GITHUB_OUTPUT}"

  github-anchor:
    name: Verify and export the immutable GitHub anchor
    if: >-
      ${{ always() && needs.publication-gate.result == 'success' &&
          (needs.ledger-readiness.outputs.anchor_exists == 'true' || needs.github-release.result == 'success') }}
    needs:
      - contract
      - repository-readiness
      - ledger-readiness
      - publication-gate
      - github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.anchor.outputs.release_id }}
      manifest_sha256: ${{ steps.anchor.outputs.manifest_sha256 }}
      result: ${{ steps.anchor.outputs.result }}
      bundle_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout public verification material
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.repository-readiness.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: gh release download "${TAG}" --repo "${REPOSITORY}" --dir verified
      - name: Verify immutable asset set, signatures, manifest, and release identity
        id: anchor
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.contract.outputs.version }}
          COMMIT: ${{ needs.repository-readiness.outputs.commit }}
          LEDGER_ISSUE: ${{ needs.contract.outputs.ledger_issue }}
          RELEASE_KIND: ${{ needs.contract.outputs.release_kind }}
          ANCHOR_EXISTED: ${{ needs.ledger-readiness.outputs.anchor_exists }}
          REPOSITORY: ${{ github.repository }}
          PRIMARY_FINGERPRINT: ${{ vars.RELEASE_PRIMARY_FINGERPRINT }}
          TAG_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_TAG_SUBKEY_FINGERPRINT }}
          ARTIFACT_SUBKEY_FINGERPRINT: ${{ vars.RELEASE_ARTIFACT_SUBKEY_FINGERPRINT }}
        run: |
          gh release view "${TAG}" --repo "${REPOSITORY}" \
            --json databaseId,isDraft,isImmutable,isPrerelease,tagName > release.json
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPOSITORY}/releases/tags/${TAG}" > release-api.json
          export GNUPGHOME="${RUNNER_TEMP}/anchor-gnupg"
          install -d -m 700 "${GNUPGHOME}"
          gpg --batch --import keys/release-signing-key.asc
          gpg --batch --no-auto-key-retrieve --status-fd 1 \
            --verify verified/SHA256SUMS.asc verified/SHA256SUMS > checksum.status
          python3 -I -S release/verify_gnupg_status.py --status checksum.status \
            --signing-fingerprint "${ARTIFACT_SUBKEY_FINGERPRINT}" \
            --primary-fingerprint "${PRIMARY_FINGERPRINT}"
          for signature in verified/release-manifest.json.asc verified/*.tar.gz.asc verified/*.zip.asc; do
            [[ -f "${signature}" ]] || continue
            asset="${signature%.asc}"
            gpg --batch --no-auto-key-retrieve --status-fd 1 \
              --verify "${signature}" "${asset}" > detached.status
            python3 -I -S release/verify_gnupg_status.py --status detached.status \
              --signing-fingerprint "${ARTIFACT_SUBKEY_FINGERPRINT}" \
              --primary-fingerprint "${PRIMARY_FINGERPRINT}"
          done
          (cd verified && sha256sum --check SHA256SUMS)
          python3 -I -S <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          api = json.loads(Path("release-api.json").read_text(encoding="utf-8"))
          expected_prerelease = os.environ["RELEASE_KIND"] == "rc"
          if release != {
              "databaseId": release["databaseId"], "isDraft": False, "isImmutable": True,
              "isPrerelease": expected_prerelease, "tagName": os.environ["TAG"],
          } or not isinstance(release["databaseId"], int) or release["databaseId"] < 1:
              raise SystemExit("GitHub release is not the exact published immutable anchor")
          manifest_path = Path("verified/release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected_signers = {
              "primary_fingerprint": os.environ["PRIMARY_FINGERPRINT"],
              "tag_subkey_fingerprint": os.environ["TAG_SUBKEY_FINGERPRINT"],
              "artifact_subkey_fingerprint": os.environ["ARTIFACT_SUBKEY_FINGERPRINT"],
          }
          expected_ledger = {
              "issue_id": os.environ["LEDGER_ISSUE"],
              "issue_url": f"https://github.com/{os.environ['REPOSITORY']}/issues/{os.environ['LEDGER_ISSUE']}",
          }
          if (
              manifest.get("tag") != os.environ["TAG"]
              or manifest.get("version") != os.environ["VERSION"]
              or manifest.get("commit") != os.environ["COMMIT"]
              or manifest.get("release_ledger") != expected_ledger
              or manifest.get("signers") != expected_signers
          ):
              raise SystemExit("release manifest does not match the dispatch identity")
          if Path("verified/release-signing-key.asc").read_bytes() != Path("keys/release-signing-key.asc").read_bytes():
              raise SystemExit("release verification key differs from the tagged public key")
          local = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in Path("verified").iterdir() if path.is_file()}
          remote = {}
          for asset in api.get("assets", []):
              digest = asset.get("digest")
              name = asset.get("name")
              if not isinstance(name, str) or re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,199}", name) is None:
                  raise SystemExit("release contains an unsafe asset name")
              if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
                  raise SystemExit("release asset lacks a canonical server-side digest")
              if name in remote:
                  raise SystemExit("release contains duplicate asset names")
              remote[name] = digest.removeprefix("sha256:")
          if remote != local:
              raise SystemExit("downloaded release assets do not match server-side SHA-256 digests")
          manifest_sha = local["release-manifest.json"]
          anchor = {
              "schema_version": 1, "repository": os.environ["REPOSITORY"],
              "release_id": str(release["databaseId"]), "tag": os.environ["TAG"],
              "commit": os.environ["COMMIT"], "manifest_sha256": manifest_sha,
          }
          Path("verified/ANCHOR.json").write_text(json.dumps(anchor, sort_keys=True) + "\n", encoding="utf-8")
          output = Path(os.environ["GITHUB_OUTPUT"])
          result = "SKIPPED_ALREADY_IDENTICAL" if os.environ["ANCHOR_EXISTED"] == "true" else "PUBLISHED"
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"release_id={release['databaseId']}\nmanifest_sha256={manifest_sha}\nresult={result}\n")
          PY
          rm -rf "${GNUPGHOME}"
      - name: Upload verified immutable release bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified/
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  publish-apt:
    name: Publish APT packages through Cloudsmith OIDC
    if: ${{ needs.contract.outputs.target_apt == 'true' }}
    needs:
      - contract
      - github-anchor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-cloudsmith
    permissions:
      contents: read
      id-token: write
    outputs:
      result: ${{ steps.publish.outputs.result }}
    steps:
      - name: Download and verify immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Verify fixed anchor handoff
        env:
          EXPECTED_MANIFEST: ${{ needs.github-anchor.outputs.manifest_sha256 }}
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          python3 -I -S <<'PY'
          import json, os
          from pathlib import Path
          anchor = json.loads(Path("release-assets/ANCHOR.json").read_text(encoding="utf-8"))
          if anchor.get("manifest_sha256") != os.environ["EXPECTED_MANIFEST"] or anchor.get("tag") != os.environ["EXPECTED_TAG"]:
              raise SystemExit("verified artifact handoff does not match the immutable anchor")
          PY
      - name: Authenticate and install pinned Cloudsmith CLI
        uses: cloudsmith-io/cloudsmith-cli-action@159f1619275d5d3147f059c3cc110938ec221d16 # v2.0.3
        with:
          cli-version: "1.19.0"
          oidc-namespace: ${{ vars.CLOUDSMITH_OIDC_NAMESPACE }}
          oidc-service-slug: ${{ vars.CLOUDSMITH_OIDC_SERVICE_SLUG }}
      - name: Push or identically skip exact APT routes
        id: publish
        env:
          CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
          CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
        run: |
          python3 -I -S <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          namespace, repository = os.environ["CLOUDSMITH_NAMESPACE"], os.environ["CLOUDSMITH_REPOSITORY"]
          if re.fullmatch(r"[a-z0-9][a-z0-9-]{0,63}", namespace) is None or re.fullmatch(r"[a-z0-9][a-z0-9-]{0,63}", repository) is None:
              raise SystemExit("Cloudsmith coordinates are missing or invalid")
          routes = json.loads(Path("release-assets/cloudsmith-routes.json").read_text(encoding="utf-8"))
          selected = [route for route in routes if route.get("format") == "apt"]
          if not selected:
              raise SystemExit("immutable release has no APT routes")
          published = False
          for route in selected:
              if set(route) != {"asset", "format", "distribution", "release"}:
                  raise SystemExit("APT route schema mismatch")
              if any(re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,199}", route[key]) is None for key in ("asset", "distribution", "release")):
                  raise SystemExit("APT route contains an unsafe coordinate")
              path = Path("release-assets") / route["asset"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              query = f"filename:{route['asset']} AND format:deb AND distribution:{route['distribution']}/{route['release']}"
              listing = subprocess.run(
                  ["cloudsmith", "list", "packages", f"{namespace}/{repository}", "-F", "json", "--page-all", "-q", query],
                  check=True, text=True, stdout=subprocess.PIPE,
              )
              payload = json.loads(listing.stdout)
              if not isinstance(payload, dict) or not isinstance(payload.get("data"), list):
                  raise SystemExit("Cloudsmith returned an unexpected package-list schema")
              exact = [item for item in payload["data"] if item.get("filename") == route["asset"]]
              if len(exact) > 1:
                  raise SystemExit("Cloudsmith contains an ambiguous duplicate APT identity")
              if exact:
                  if exact[0].get("checksum_sha256") != digest:
                      raise SystemExit("Cloudsmith APT identity exists with a different SHA-256")
                  continue
              subprocess.run(["cloudsmith", "push", "deb", f"{namespace}/{repository}/{route['distribution']}/{route['release']}", str(path)], check=True)
              published = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"result={'PUBLISHED' if published else 'SKIPPED_ALREADY_IDENTICAL'}\n")
          PY

  publish-rpm:
