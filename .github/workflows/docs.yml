name: Docs

on:
  # A manual run builds any branch; only main publishes the site. Pull requests build the same
  # pages in the docs job of ci.yml, which calls docs-build.yml.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs-build.yml'
      - '.github/workflows/docs.yml'
      - 'CMakeLists.txt'
      - 'VERSION'
      - 'cmake/**'
      - 'conanfile.py'
      - 'docs/**'
      - 'examples/**'
      - 'include/**'
      - 'scripts/build.py'
      - 'scripts/check_feature_matrix.py'
      - 'scripts/gen_feature_matrix.py'
      - 'scripts/init.py'

permissions:
  contents: read

concurrency:
  # Deployments queue behind each other.
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    permissions:
      contents: read
    uses: ./.github/workflows/docs-build.yml
    with:
      publish: ${{ github.ref == 'refs/heads/main' }}
  deploy:
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-slim
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
