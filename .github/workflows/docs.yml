name: Docs

on:
  # Manual runs only. The automatic triggers below stay scoped to `main` on purpose; this
  # lets a feature branch be checked on the full matrix without spending CI on every push.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'CMakeLists.txt'
      - 'VERSION'
      - 'cmake/**'
      - 'conanfile.py'
      - 'docs/**'
      - 'examples/**'
      - 'include/**'
      - 'scripts/build.py'
      - 'scripts/init.py'
      - 'test/e2e/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'CMakeLists.txt'
      - 'VERSION'
      - 'cmake/**'
      - 'conanfile.py'
      - 'docs/**'
      - 'examples/**'
      - 'include/**'
      - 'scripts/build.py'
      - 'scripts/init.py'
      - 'test/e2e/**'

permissions:
  contents: read

concurrency:
  # Deployments queue behind each other. A new push to a pull request replaces its older build.
  group: ${{ github.event.pull_request.number && format('docs-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
        with:
          cmake-version: '3.25'
      - name: Restore Conan packages
        id: conan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: ubuntu-latest-conan-docs-${{ hashFiles('conanfile.py', 'conanfile.txt') }}
          restore-keys: ubuntu-latest-conan-
      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y doxygen
          python3 scripts/init.py --docs
      - name: Build Doxygen and Sphinx documentation
        run: python3 scripts/build.py --docs --jobs "$(nproc)"
      - name: Save Conan packages
        if: github.event_name != 'pull_request' && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs/html
  deploy:
    needs: build-docs
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
