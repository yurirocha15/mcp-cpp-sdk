name: MCP conformance regression baseline

on:
  # Manual runs only. The automatic triggers below stay scoped to `main` on purpose; this
  # lets a feature branch be checked on the full matrix without spending CI on every push.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance-2025-11-25:
    name: Pinned client/server baseline (2025-11-25)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: conformance/runner/package-lock.json

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ubuntu-24.04-conformance
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
        with:
          cmake-version: '3.25'

      - name: Restore Conan packages
        id: conan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: ubuntu-24.04-conan-conformance-${{ hashFiles('conanfile.py', 'conanfile.txt') }}
          restore-keys: ubuntu-24.04-conan-

      - name: Install C++ dependencies
        run: python3 scripts/init.py

      - name: Build conformance fixtures
        run: python3 scripts/build.py --conformance --jobs "$(nproc)"

      - name: Install locked official runner
        run: npm ci --ignore-scripts --prefix conformance/runner

      - name: Run pinned regression suites
        run: bash conformance/run.sh build/release build/conformance-results

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-conformance-2025-11-25
          path: build/conformance-results
          if-no-files-found: error
          retention-days: 30

      - name: Drop Conan build trees before saving the cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.conan-cache.outputs.cache-hit != 'true'
        run: conan cache clean "*" --source --build --download --temp

      - name: Save Conan packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
