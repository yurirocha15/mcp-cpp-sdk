name: CI

on:
  # A manual run checks any branch. Pull requests are checked whatever branch they target,
  # so a pull request stacked on another one gets the same checks; pushes only on main.
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its older run. Pushes to main each keep their own run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Runner concurrency is shared by every repository on the account, so the matrices below cap
    # their parallel jobs and each job runs only when a file it reads changed. Build still runs with
    # every step skipped: its checks are required on main, and a skipped matrix job reports one
    # unexpanded check name instead of the required ones.
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
      conan: ${{ steps.classify.outputs.conan }}
      release: ${{ steps.classify.outputs.release }}
      benchmark: ${{ steps.classify.outputs.benchmark }}
      powershell: ${{ steps.classify.outputs.powershell }}
      package_core: ${{ steps.classify.outputs.package_core }}
      native_package: ${{ steps.classify.outputs.native_package }}
      homebrew_package: ${{ steps.classify.outputs.homebrew_package }}
      windows_package: ${{ steps.classify.outputs.windows_package }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Classify the change
      id: classify
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python3 scripts/ci_changes.py --event "$EVENT" --base "$BASE" --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }}, C++${{ matrix.cppstd }}, ${{ matrix.linkage }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {os: ubuntu-24.04, cppstd: '20', linkage: both}
          - {os: ubuntu-22.04, cppstd: '20', linkage: both}
          - {os: ubuntu-26.04, cppstd: '20', linkage: both}
          - {os: windows-latest, cppstd: '20', linkage: both}
          # The Windows release is built with Visual Studio 2022 (release/windows/).
          - {os: windows-2022, cppstd: '20', linkage: both}
          - {os: macos-latest, cppstd: '20', linkage: both}
          - {os: ubuntu-24.04, cppstd: '20', linkage: static}
          - {os: ubuntu-24.04, cppstd: '23', linkage: both}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: needs.changes.outputs.code == 'true'
      with:
        persist-credentials: false

    - name: Set up Python
      if: needs.changes.outputs.code == 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install CMake
      if: needs.changes.outputs.code == 'true'
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
      with:
        cmake-version: '3.25'

    - name: Setup MSVC
      if: needs.changes.outputs.code == 'true' && (runner.os == 'Windows')
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

    - name: Set Conan Home
      if: needs.changes.outputs.code == 'true' && (runner.os == 'Windows')
      run: |
        mkdir -p C:\.c
        echo "CONAN_HOME=C:\.c" >> "$GITHUB_ENV"
      shell: bash

    # Pull requests restore caches and never save them. A pull request cannot read another
    # pull request's caches, and their copies pushed main's entries out of the repository's
    # 10 GB cache storage, so every pull request built without ccache.
    - name: Restore Conan packages
      if: needs.changes.outputs.code == 'true'
      id: conan-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.conan2/p
          C:/.c/p
        key: ${{ matrix.os }}-cxx${{ matrix.cppstd }}-conan-${{ hashFiles('conanfile.py', 'conanfile.txt') }}
        restore-keys: ${{ matrix.os }}-cxx${{ matrix.cppstd }}-conan-

    - name: Install Dependencies
      if: needs.changes.outputs.code == 'true'
      run: python scripts/init.py

    - name: Setup ccache
      if: needs.changes.outputs.code == 'true'
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ${{ matrix.os }}-cxx${{ matrix.cppstd }}-${{ matrix.linkage }}-ccache-${{ github.ref }}
        save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        restore-keys: ${{ matrix.os }}-cxx${{ matrix.cppstd }}-${{ matrix.linkage }}-ccache
        max-size: 500M

    # MCP_REQUIRE_TWIN_LOOPBACK turns the OAuthSetterPairAtomicity skips into failures. Those tests
    # need a port free on both 127.0.0.1 and 127.0.0.2, and skip when the second address is
    # missing -- which would delete the whole setter-pair atomicity regression suite while the run
    # still reported green. Linux binds 127.0.0.0/8 as a whole, so there the address is always
    # there and its absence is a broken runner, not an unsupported host. macOS gives lo0 only
    # 127.0.0.1 unless an alias is added, so the skip stays available there.
    - name: Build and Test
      if: needs.changes.outputs.code == 'true'
      env:
        MCP_REQUIRE_TWIN_LOOPBACK: ${{ runner.os == 'Linux' && '1' || '' }}
      run: >-
        python scripts/build.py --examples --test --quiet
        --cppstd ${{ matrix.cppstd }} --linkage ${{ matrix.linkage }}

    # The README is the first code a new user copies, so compile it the way they
    # would. Skipped on Windows: the check drives the compiler from
    # compile_commands.json with GCC/Clang flag spellings.
    - name: Compile README snippets
      if: needs.changes.outputs.code == 'true' && (runner.os != 'Windows')
      run: python scripts/check_readme_snippets.py

    - name: Run Examples
      if: needs.changes.outputs.code == 'true'
      run: python scripts/run_examples.py

    # On the stdio transport stdout is the protocol channel. Running an example
    # and checking its exit code does not notice prose printed there, so assert
    # the stream separately. run_examples.py builds into build/release.
    - name: Check stdio protocol streams
      if: needs.changes.outputs.code == 'true'
      run: python scripts/check_stdio_streams.py build/release

    # Dependencies built from source leave their source and build trees under p/. Only the
    # packages are needed to restore, so the trees are dropped before the cache is archived.
    - name: Drop Conan build trees before saving the cache
      if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.conan-cache.outputs.cache-hit != 'true')
      run: conan cache clean "*" --source --build --download --temp

    - name: Save Conan packages
      if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.conan-cache.outputs.cache-hit != 'true')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.conan2/p
          C:/.c/p
        key: ${{ steps.conan-cache.outputs.cache-primary-key }}

  sanitize:
    # Both compilers share one runner. Each builds in its own directory, and the Clang step runs
    # even when the GCC step fails so that one run reports both.
    name: sanitize
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
      with:
        cmake-version: '3.25'

    - name: Restore Conan packages
      id: conan-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.conan2/p
        key: ubuntu-24.04-conan-sanitize-${{ hashFiles('conanfile.py', 'conanfile.txt') }}
        restore-keys: ubuntu-24.04-conan-

    - name: Install Dependencies
      run: python scripts/init.py

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ubuntu-24.04-sanitize-ccache-${{ github.ref }}
        save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        restore-keys: ubuntu-24.04-sanitize-ccache
        max-size: 1500M

    - name: Build and Test with Sanitizers (GCC)
      env:
        MCP_REQUIRE_TWIN_LOOPBACK: '1'
      run: python scripts/build.py --sanitize --compiler default --test --quiet

    - name: Build and Test with Sanitizers (Clang)
      if: ${{ !cancelled() }}
      env:
        MCP_REQUIRE_TWIN_LOOPBACK: '1'
      run: python scripts/build.py --sanitize --compiler clang --test --quiet

    - name: Drop Conan build trees before saving the cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.conan-cache.outputs.cache-hit != 'true'
      run: conan cache clean "*" --source --build --download --temp

    - name: Save Conan packages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.conan-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.conan2/p
        key: ${{ steps.conan-cache.outputs.cache-primary-key }}

  tsan:
    # Both compilers share one runner. Each builds in its own directory, and the Clang step runs
    # even when the GCC step fails so that one run reports both.
    name: tsan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
      with:
        cmake-version: '3.25'

    - name: Restore Conan packages
      id: conan-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.conan2/p
        key: ubuntu-24.04-conan-tsan-${{ hashFiles('conanfile.py', 'conanfile.txt') }}
        restore-keys: ubuntu-24.04-conan-

    - name: Install Dependencies
      run: python scripts/init.py

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ubuntu-24.04-tsan-ccache-${{ github.ref }}
        save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        restore-keys: ubuntu-24.04-tsan-ccache
        max-size: 1G

    - name: Build and Test with ThreadSanitizer (GCC)
      env:
        MCP_REQUIRE_TWIN_LOOPBACK: '1'
      run: python scripts/build.py --tsan --compiler default --test --quiet

    - name: Build and Test with ThreadSanitizer (Clang)
      if: ${{ !cancelled() }}
      env:
        MCP_REQUIRE_TWIN_LOOPBACK: '1'
      run: python scripts/build.py --tsan --compiler clang --test --quiet

    - name: Drop Conan build trees before saving the cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.conan-cache.outputs.cache-hit != 'true'
      run: conan cache clean "*" --source --build --download --temp

    - name: Save Conan packages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.conan-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.conan2/p
        key: ${{ steps.conan-cache.outputs.cache-primary-key }}

  msan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
      with:
        cmake-version: '3.25'

    # The dependencies are rebuilt instrumented, so this cache shares nothing with the other jobs.
    - name: Restore Conan packages
      id: conan-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.conan2/p
        key: ubuntu-24.04-conan-msan-${{ hashFiles('conanfile.py', 'conanfile.txt') }}
        restore-keys: ubuntu-24.04-conan-msan-

    # Keyed on MSAN_LLVM_COMMIT in scripts/build.py. A cache from another commit is rebuilt by
    # build.py rather than used, so a key left behind costs time and nothing else.
    - name: Restore instrumented libc++
      id: libcxx-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/msan-libcxx
        key: ubuntu-24.04-msan-libcxx-3b5b5c1ec4a3

    - name: Install Dependencies
      run: python scripts/init.py

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ubuntu-24.04-msan-ccache-${{ github.ref }}
        save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        restore-keys: ubuntu-24.04-msan-ccache
        max-size: 1G

    - name: Build and Test with MemorySanitizer
      env:
        MCP_REQUIRE_TWIN_LOOPBACK: '1'
      run: python scripts/build.py --msan --test --quiet

    - name: Drop Conan build trees before saving the cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.conan-cache.outputs.cache-hit != 'true'
      run: conan cache clean "*" --source --build --download --temp

    - name: Save Conan packages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.conan-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.conan2/p
        key: ${{ steps.conan-cache.outputs.cache-primary-key }}

    - name: Save instrumented libc++
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.libcxx-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/msan-libcxx
        key: ${{ steps.libcxx-cache.outputs.cache-primary-key }}

  release-safety:
    name: Release safety contracts
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Validate source release policy
      run: |
        python3 scripts/check_release_workflow.py
        PYTHONPATH=scripts python3 -m unittest -v \
          scripts.test_release_dispatch_contract \
          scripts.test_release_workflow_policy \
          scripts.test_check_json_matrix \
          scripts.test_ci_changes

    - name: Validate release artifacts and package templates
      run: |
        python3 -m unittest discover -s test/release -p 'test_*.py' -v

    - name: Check the vendored jsoncons tree and JSON Schema test data
      run: |
        python3 scripts/vendor_jsoncons.py --check
        python3 scripts/vendor_json_schema_test_suite.py --check

    - name: Compile release Python without executing it
      run: >-
        python3 -m compileall -q
        release scripts test/release

    - name: Lint all GitHub Actions workflows
      run: scripts/release/lint_workflows.sh

  release-powershell:
    name: Release PowerShell
    needs: changes
    if: needs.changes.outputs.powershell == 'true'
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Parse release PowerShell
      run: ./scripts/release/check_powershell_syntax.ps1

    - name: Test deterministic release ZIP
      run: ./scripts/release/test_deterministic_zip.ps1

  benchmark-tooling:
    name: Benchmark tooling tests
    needs: changes
    if: needs.changes.outputs.benchmark == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Test the benchmark helpers
      run: python3 -m unittest -v benchmark.test_benchmark_helpers

  conan-package:
    name: Conan package (shared=${{ matrix.shared }})
    needs: changes
    if: needs.changes.outputs.conan == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shared: ['False', 'True']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
      with:
        cmake-version: '3.25'

    - name: Restore Conan packages
      id: conan-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.conan2/p
        key: ubuntu-24.04-conan-package-${{ matrix.shared }}-${{ hashFiles('conanfile.py', 'test_package/**') }}
        restore-keys: ubuntu-24.04-conan-package-${{ matrix.shared }}-

    - name: Install dependencies
      run: python3 scripts/init.py

    - name: Create and consume the Conan package
      run: >-
        conan create . --test-folder=test_package --build=missing
        -s compiler.cppstd=20
        -o "mcp-cpp-sdk/*:shared=${{ matrix.shared }}"

    - name: Drop Conan build trees before saving the cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.conan-cache.outputs.cache-hit != 'true'
      run: conan remove "mcp-cpp-sdk/*" --confirm && conan cache clean "*" --source --build --download --temp

    - name: Save Conan packages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.conan-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.conan2/p
        key: ${{ steps.conan-cache.outputs.cache-primary-key }}

  package-core:
    # The other jobs use Conan's Boost and the SDK's own CMake options. These build the native
    # packages exactly as a release does, with each distribution's compiler, Boost, Python and
    # packaging flags, in the locked release builder images, and test what they install.
    name: Native package source
    needs: changes
    if: needs.changes.outputs.package_core == 'true'
    runs-on: ubuntu-24.04
    outputs:
      routes: ${{ steps.routes.outputs.routes }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: List the x86_64 package routes
      id: routes
      run: echo "routes=$(python3 -I scripts/package_build.py --matrix)" >> "$GITHUB_OUTPUT"

    - name: Construct the release source archive and recipes
      run: python3 -I scripts/package_build.py core --output core

    - name: Upload the release core
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: package-core
        path: core/
        if-no-files-found: error
        retention-days: 1

  package:
    name: Native package (${{ matrix.id }})
    needs: [changes, package-core]
    if: needs.changes.outputs.native_package == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.package-core.outputs.routes) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download the release core
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: package-core
        path: core

    - name: Build, test, install and consume the packages
      env:
        ROUTE_ID: ${{ matrix.id }}
      run: python3 -I scripts/package_build.py build "$ROUTE_ID" --core core --output out

  homebrew-package:
    # Audits, builds, tests and consumes the release formula on the release's four Homebrew
    # runners, with the script and timeout the release workflow uses.
    name: Homebrew package (${{ matrix.bottle_tag }})
    needs: [changes, package-core]
    if: needs.changes.outputs.homebrew_package == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {runner: macos-15-intel, bottle_tag: sequoia}
          - {runner: macos-15, bottle_tag: arm64_sequoia}
          - {runner: ubuntu-24.04, bottle_tag: x86_64_linux}
          - {runner: ubuntu-24.04-arm, bottle_tag: arm64_linux}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
    - name: Configure Linuxbrew command path
      if: runner.os == 'Linux'
      run: |
        test -x /home/linuxbrew/.linuxbrew/bin/brew
        echo /home/linuxbrew/.linuxbrew/bin >>"${GITHUB_PATH}"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download the release core
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: package-core
        path: core

    - name: Audit, install, test and consume the formula
      run: >-
        scripts/release/validate_homebrew_candidate.sh
        "$(cat VERSION)" core "${RUNNER_TEMP}/mcp-cpp-sdk-homebrew-validation"

  windows-package:
    # Builds, tests and packages the Windows release payload and validates the ConanCenter recipe
    # on Windows, with the scripts and the Visual Studio, Python, Conan and Chocolatey pins the
    # release workflow uses.
    name: Windows package
    needs: [changes, package-core]
    if: needs.changes.outputs.windows_package == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up the release Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ vars.WINDOWS_RELEASE_PYTHON_VERSION }}
        check-latest: false

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      with:
        arch: x64

    - name: Install the release Conan client
      env:
        WINDOWS_RELEASE_CONAN_VERSION: ${{ vars.WINDOWS_RELEASE_CONAN_VERSION }}
      run: >-
        & ./scripts/release/install_windows_conan.ps1
        -PythonPath (Get-Command python.exe -CommandType Application).Source
        -ExpectedVersion $env:WINDOWS_RELEASE_CONAN_VERSION
        -Requirements release/windows/conan-requirements.txt
        -GitHubPath $env:GITHUB_PATH

    - name: Build, test and package the Windows payload
      env:
        WINDOWS_RELEASE_CMAKE_VERSION: ${{ vars.WINDOWS_RELEASE_CMAKE_VERSION }}
        WINDOWS_RELEASE_CONAN_VERSION: ${{ vars.WINDOWS_RELEASE_CONAN_VERSION }}
        WINDOWS_RELEASE_CHOCO_VERSION: ${{ vars.WINDOWS_RELEASE_CHOCO_VERSION }}
        WINDOWS_RELEASE_PYTHON_VERSION: ${{ vars.WINDOWS_RELEASE_PYTHON_VERSION }}
        WINDOWS_RELEASE_VCTOOLS_VERSION: ${{ vars.WINDOWS_RELEASE_VCTOOLS_VERSION }}
        WINDOWS_RELEASE_MSC_VER: ${{ vars.WINDOWS_RELEASE_MSC_VER }}
      run: |
        $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
        & ./scripts/release/build_windows.ps1 `
          -Version $version -Tag "v$version" -Repository $env:GITHUB_REPOSITORY `
          -ExpectedCMakeVersion $env:WINDOWS_RELEASE_CMAKE_VERSION `
          -ExpectedConanVersion $env:WINDOWS_RELEASE_CONAN_VERSION `
          -ExpectedChocolateyVersion $env:WINDOWS_RELEASE_CHOCO_VERSION `
          -ExpectedPythonVersion $env:WINDOWS_RELEASE_PYTHON_VERSION `
          -ExpectedVCToolsVersion $env:WINDOWS_RELEASE_VCTOOLS_VERSION `
          -ExpectedMscVer ([int]$env:WINDOWS_RELEASE_MSC_VER)

    - name: Download the release core
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: package-core
        path: core

    - name: Validate the ConanCenter recipe with both linkages
      env:
        WINDOWS_RELEASE_CONAN_VERSION: ${{ vars.WINDOWS_RELEASE_CONAN_VERSION }}
        WINDOWS_RELEASE_VCTOOLS_VERSION: ${{ vars.WINDOWS_RELEASE_VCTOOLS_VERSION }}
        WINDOWS_RELEASE_MSC_VER: ${{ vars.WINDOWS_RELEASE_MSC_VER }}
      run: |
        & ./scripts/release/validate_conan_candidate.ps1 `
          -Version (Get-Content -LiteralPath VERSION -Raw).Trim() `
          -CandidateDirectory core `
          -WorkDirectory "$env:RUNNER_TEMP/mcp-cpp-sdk-conan-candidate" `
          -Evidence "$env:RUNNER_TEMP/conan-validation-windows.json" `
          -ExpectedConanVersion $env:WINDOWS_RELEASE_CONAN_VERSION `
          -ExpectedVCToolsVersion $env:WINDOWS_RELEASE_VCTOOLS_VERSION `
          -ExpectedMscVer ([int]$env:WINDOWS_RELEASE_MSC_VER)
