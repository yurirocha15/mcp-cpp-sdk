name: MCP conformance, alpha runner

on:
  # A manual run checks any branch. Pull requests are checked whatever branch they target,
  # so a pull request stacked on another one gets the same checks; pushes only on main.
  # This workflow reports results only: ci.yml never calls it, so the CI result never waits on it
  # (scripts/check_alpha_runner_guard.py enforces that).
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conformance-alpha.yml'
      - 'CMakeLists.txt'
      - 'VERSION'
      - 'cmake/**'
      - 'conanfile.py'
      - 'conformance/**'
      - 'include/**'
      - 'scripts/build.py'
      - 'scripts/init.py'
      - 'src/**'
      - '!**.md'
  pull_request:
    branches: ['**']
    paths:
      - '.github/workflows/conformance-alpha.yml'
      - 'CMakeLists.txt'
      - 'VERSION'
      - 'cmake/**'
      - 'conanfile.py'
      - 'conformance/**'
      - 'include/**'
      - 'scripts/build.py'
      - 'scripts/init.py'
      - 'src/**'
      - '!**.md'

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its older run. Pushes to main each keep their own run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance-2026-07-28-alpha:
    name: Alpha runner, requirements 2026-07-28 (non-gating)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # A report, never a gate: the job cannot fail the workflow, and no other job may need it
    # (scripts/check_alpha_runner_guard.py enforces both).
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607 # v1.2.25
        with:
          key: ubuntu-24.04-conformance
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
        with:
          cmake-version: '3.25'

      - name: Restore Conan packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: ubuntu-24.04-conan-conformance-${{ hashFiles('conanfile.py', 'conanfile.txt') }}
          restore-keys: ubuntu-24.04-conan-

      - name: Install C++ dependencies
        run: python3 scripts/init.py

      - name: Build conformance fixtures
        run: python3 scripts/build.py --conformance --jobs "$(nproc)"

      - name: Run the alpha runner against the fixtures
        run: bash conformance/run_alpha.sh build/release build/conformance-results-alpha

      - name: Report totals
        if: always()
        run: |
          if [ -f build/conformance-results-alpha/summary.txt ]; then
            {
              echo '### Alpha runner, requirements 2026-07-28 (non-gating)'
              echo '```'
              cat build/conformance-results-alpha/summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload alpha results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-conformance-2026-07-28-alpha
          path: build/conformance-results-alpha
          if-no-files-found: ignore
          retention-days: 30
