name: Release provider preflight

on:
  workflow_call:
    inputs:
      provider:
        required: true
        type: string
      environment:
        required: true
        type: string
    outputs:
      repository_id:
        value: ${{ jobs.preflight.outputs.repository_id }}
      repository:
        value: ${{ jobs.preflight.outputs.repository }}

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    outputs:
      repository_id: ${{ steps.control.outputs.repository_id }}
      repository: ${{ steps.control.outputs.repository }}
    env:
      APP_OWNER: ${{ inputs.provider == 'homebrew' && vars.HOMEBREW_APP_OWNER || inputs.provider == 'chocolatey' && vars.CHOCOLATEY_APP_OWNER || vars.CONAN_BROKER_APP_OWNER }}
      APP_REPOSITORY: ${{ inputs.provider == 'homebrew' && vars.HOMEBREW_APP_REPOSITORY || inputs.provider == 'chocolatey' && vars.CHOCOLATEY_APP_REPOSITORY || vars.CONAN_BROKER_APP_REPOSITORY }}
      EXPECTED_REPOSITORY_ID: ${{ inputs.provider == 'homebrew' && vars.HOMEBREW_APP_REPOSITORY_ID || inputs.provider == 'chocolatey' && vars.CHOCOLATEY_APP_REPOSITORY_ID || vars.CONAN_BROKER_APP_REPOSITORY_ID }}
      WORKFLOW: ${{ inputs.provider == 'homebrew' && vars.HOMEBREW_APP_WORKFLOW || inputs.provider == 'chocolatey' && vars.CHOCOLATEY_APP_WORKFLOW || vars.CONAN_BROKER_APP_WORKFLOW }}
    steps:
      - name: Validate fixed provider environment
        env:
          PROVIDER: ${{ inputs.provider }}
          PROVIDER_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "${PROVIDER}:${PROVIDER_ENVIRONMENT}" in
            homebrew:release-homebrew|chocolatey:release-chocolatey|conan:release-control-dispatch) ;;
            *) exit 2 ;;
          esac
      - name: Checkout protected current provider policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact repository and active workflow on protected main
        id: control
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I -S scripts/run_release_tool.py release.provider_preflight workflow
          --owner "${APP_OWNER}" --repository "${APP_REPOSITORY}"
          --expected-repository-id "${EXPECTED_REPOSITORY_ID}" --workflow "${WORKFLOW}"
          --github-output "${GITHUB_OUTPUT}"
