name: Conformance guardrails

on:
  # A manual run checks any branch. Pull requests are checked whatever branch they target,
  # so a pull request stacked on another one gets the same checks; pushes only on main.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'conformance/run.sh'
      - 'scripts/**'
  pull_request:
    branches: ['**']
    paths:
      - '.github/workflows/**'
      - 'conformance/run.sh'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its older run. Pushes to main each keep their own run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  alpha-runner-non-gating:
    name: Alpha runner stays non-gating
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Assert the alpha conformance runner cannot gate CI
        run: python3 scripts/check_alpha_runner_guard.py
