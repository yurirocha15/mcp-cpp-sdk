name: Conformance guardrails

on:
  # Manual runs only. The automatic triggers below stay scoped to `main` on purpose; this
  # lets a feature branch be checked on the full matrix without spending CI on every push.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  alpha-runner-non-gating:
    name: Alpha runner stays non-gating
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Assert the alpha conformance runner cannot gate CI
        run: python3 scripts/check_alpha_runner_guard.py
