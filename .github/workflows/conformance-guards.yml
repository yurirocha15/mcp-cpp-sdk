name: Conformance guardrails

on:
  # ci.yml calls this workflow when a file it reads changed (scripts/ci_changes.py), so a failure
  # fails the CI result. A manual run checks any branch.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group: in a called workflow github.workflow is the caller's name, so a group
# here would equal ci.yml's own and queue or cancel this run behind it.

jobs:
  alpha-runner-non-gating:
    name: Alpha runner stays non-gating
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Assert the alpha conformance runner cannot gate CI
        run: |
          python3 scripts/check_alpha_runner_guard.py
          PYTHONPATH=scripts python3 -m unittest -v scripts.test_check_alpha_runner_guard

  protocol-constants:
    name: Protocol constants name their era
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # g_LATEST_PROTOCOL_VERSION and the supported list change meaning when a new revision
      # becomes the latest, and 2026-07-28 retires -32002 and -32042.
      - name: Check uses of protocol constants and retired error codes
        run: |
          python3 scripts/check_protocol_constants.py
          PYTHONPATH=scripts python3 -m unittest -v scripts.test_check_protocol_constants

  deprecation-attributes:
    name: Deprecated declarations carry an attribute
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Every deprecation in the registry is marked, every marker and every public name of a
      # deprecated feature is in the registry, and every @deprecated tag has the attribute.
      - name: Check the public headers against the deprecation registry
        run: |
          python3 scripts/check_deprecations.py
          PYTHONPATH=scripts python3 -m unittest -v scripts.test_check_deprecations
