name: Conformance guardrails

on:
  # A manual run checks any branch. Pull requests are checked whatever branch they target,
  # so a pull request stacked on another one gets the same checks; pushes only on main.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  alpha-runner-non-gating:
    name: Alpha runner stays non-gating
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Assert the alpha conformance runner cannot gate CI
        run: python3 scripts/check_alpha_runner_guard.py

  protocol-constants:
    name: Protocol constants name their era
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # g_LATEST_PROTOCOL_VERSION and the supported list change meaning when a new revision
      # becomes the latest, and 2026-07-28 retires -32002 and -32042.
      - name: Check uses of protocol constants and retired error codes
        run: |
          python3 scripts/check_protocol_constants.py
          PYTHONPATH=scripts python3 -m unittest -v scripts.test_check_protocol_constants
