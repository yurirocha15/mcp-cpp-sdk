name: broker-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest tests.test_workflow_policy.WorkflowSyntaxTests -v

  release-control-policy:
    name: release-control-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest tests.test_workflow_policy.SecurityPolicyTests -v

  publisher-unit-tests:
    name: publisher-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Reject private keys and token-shaped assignments
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIE --exclude-dir=.git -- 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|CONAN_CENTER_PR_BOT_PA[T]=' .
