name: tap-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tap-policy:
    name: tap-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest tests.test_workflow_policy.SecurityPolicyTests -v

  formula-style-audit:
    name: formula-style-audit
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: brew style Formula/mcp-cpp-sdk.rb
      - run: brew audit --strict Formula/mcp-cpp-sdk.rb

  trusted-bottle-policy:
    name: trusted-bottle-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
