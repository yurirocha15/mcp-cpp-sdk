name: publish-bottles

on:
  workflow_dispatch:
    inputs:
      source_tag:
        required: true
        type: string
      source_commit_sha:
        required: true
        type: string
      source_workflow_head_sha:
        required: true
        type: string
      provider_control_sha:
        required: true
        type: string
      github_release_id:
        required: true
        type: string
      source_workflow_run_id:
        required: true
        type: string
      release_manifest_sha256:
        required: true
        type: string
      formula_pr_number:
        required: true
        type: string
      formula_branch:
        required: true
        type: string
      formula_head_sha:
        required: true
        type: string
      request_uuid:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-publishing
  cancel-in-progress: false

jobs:
  control:
    name: verify immutable provider control context
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the exact immutable control tag and commit
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.provider_control_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/tags/release-control-v1
          test "$GITHUB_SHA" = "$EXPECTED_CONTROL_SHA"
          test "$GITHUB_WORKFLOW_REF" = \
            'yurirocha15/homebrew-mcp-cpp-sdk/.github/workflows/publish-bottles.yml@refs/tags/release-control-v1'

  verify:
    name: verify trusted formula head and immutable source
    needs: control
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      source_tag: ${{ steps.input.outputs.source_tag }}
      formula_pr_number: ${{ steps.input.outputs.formula_pr_number }}
      formula_branch: ${{ steps.input.outputs.formula_branch }}
      formula_head_sha: ${{ steps.input.outputs.formula_head_sha }}
    steps:
      - name: Checkout protected tap controls only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact dispatch
        id: input
        env:
          DISPATCH_JSON: >-
            {"source_tag":${{ toJSON(inputs.source_tag) }},"source_commit_sha":${{ toJSON(inputs.source_commit_sha) }},"source_workflow_head_sha":${{ toJSON(inputs.source_workflow_head_sha) }},"provider_control_sha":${{ toJSON(inputs.provider_control_sha) }},"github_release_id":${{ toJSON(inputs.github_release_id) }},"source_workflow_run_id":${{ toJSON(inputs.source_workflow_run_id) }},"release_manifest_sha256":${{ toJSON(inputs.release_manifest_sha256) }},"formula_pr_number":${{ toJSON(inputs.formula_pr_number) }},"formula_branch":${{ toJSON(inputs.formula_branch) }},"formula_head_sha":${{ toJSON(inputs.formula_head_sha) }},"request_uuid":${{ toJSON(inputs.request_uuid) }}}
        run: python3 -I -S publisher/validate_dispatch.py
      - name: Verify immutable source identity and completed source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.input.outputs.source_tag }}
          SOURCE_SHA: ${{ inputs.source_commit_sha }}
          SOURCE_WORKFLOW_HEAD_SHA: ${{ inputs.source_workflow_head_sha }}
          RELEASE_ID: ${{ inputs.github_release_id }}
          SOURCE_RUN_ID: ${{ inputs.source_workflow_run_id }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          SOURCE_OWNER_ID: ${{ vars.SOURCE_OWNER_ID }}
        run: >-
          python3 -I -S publisher/source_run.py
          --run-id "$SOURCE_RUN_ID"
          --workflow-head-sha "$SOURCE_WORKFLOW_HEAD_SHA"
          --repository-id "$SOURCE_REPOSITORY_ID"
          --owner-id "$SOURCE_OWNER_ID"
          --tag "$SOURCE_TAG"
          --release-id "$RELEASE_ID"
          --timeout-seconds 3600
      - name: Verify exact same-repository App-authored formula pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.input.outputs.source_tag }}
          PR: ${{ steps.input.outputs.formula_pr_number }}
          BRANCH: ${{ steps.input.outputs.formula_branch }}
          HEAD_SHA: ${{ steps.input.outputs.formula_head_sha }}
        run: >-
          python3 -I -S publisher/formula_branch.py verify-head
          --pr "$PR" --branch "$BRANCH" --expected-head "$HEAD_SHA"
          --tag "$SOURCE_TAG"
      - name: Verify signed source bundle and annotated tag without source checkout
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.input.outputs.source_tag }}
          SOURCE_SHA: ${{ inputs.source_commit_sha }}
          MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
          PRIMARY_FINGERPRINT: ${{ vars.SOURCE_SIGNING_PRIMARY_FINGERPRINT }}
          TAG_FINGERPRINT: ${{ vars.SOURCE_TAG_SIGNING_SUBKEY_FINGERPRINT }}
          ARTIFACT_FINGERPRINT: ${{ vars.SOURCE_ARTIFACT_SIGNING_SUBKEY_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$SOURCE_TAG" --repo yurirocha15/mcp-cpp-sdk --dir release-assets
          python3 -I -S publisher/verify_source_release.py \
            --directory release-assets --tag "$SOURCE_TAG" --commit "$SOURCE_SHA" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --primary-fingerprint "$PRIMARY_FINGERPRINT" \
            --artifact-fingerprint "$ARTIFACT_FINGERPRINT"
          gpg --batch --import release-assets/release-signing-key.asc
          git init --bare source.git
          git -C source.git fetch --no-tags --depth=1 https://github.com/yurirocha15/mcp-cpp-sdk.git \
            "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
          git -C source.git fetch --no-tags https://github.com/yurirocha15/mcp-cpp-sdk.git \
            "refs/heads/main:refs/heads/main"
          test "$(git -C source.git cat-file -t "$SOURCE_TAG")" = tag
          git -C source.git verify-tag --raw "$SOURCE_TAG" 2>tag.status
          test "$(git -C source.git rev-list -n1 "$SOURCE_TAG")" = "$SOURCE_SHA"
          git -C source.git merge-base --is-ancestor "$SOURCE_SHA" refs/heads/main
          python3 -I -S publisher/verify_git_status.py tag.status "$TAG_FINGERPRINT" "$PRIMARY_FINGERPRINT"

  bottle:
    name: bottle (${{ matrix.tag }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            tag: sequoia
          - runner: macos-15
            tag: arm64_sequoia
          - runner: ubuntu-24.04
            tag: x86_64_linux
          - runner: ubuntu-24.04-arm
            tag: arm64_linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Configure Linuxbrew command path
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          echo /home/linuxbrew/.linuxbrew/bin >>"$GITHUB_PATH"
      - name: Checkout only the prevalidated exact formula head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.verify.outputs.formula_head_sha }}
          persist-credentials: false
      - name: Revalidate exact head and build bottle without publisher credentials
        env:
          EXPECTED_HEAD: ${{ needs.verify.outputs.formula_head_sha }}
          BOTTLE_TAG: ${{ matrix.tag }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_TAG: ${{ needs.verify.outputs.source_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          command -v brew
          brew install --build-bottle ./Formula/mcp-cpp-sdk.rb
          brew test mcp-cpp-sdk
          version="${SOURCE_TAG#v}"
          python3 -I -S publisher/consumer_test.py --version "$version" \
            --prefix "$(brew --prefix mcp-cpp-sdk)" \
            --work "$RUNNER_TEMP/mcp-cpp-sdk-consumers"
          brew bottle --json --root-url=https://ghcr.io/v2/yurirocha15/mcp-cpp-sdk mcp-cpp-sdk
          python3 -I -S publisher/bottle_handoff.py --directory . \
            --formula Formula/mcp-cpp-sdk.rb \
            --tag "$BOTTLE_TAG" --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" --output bundle
      - name: Attest exact bottle
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: bundle/*.bottle*.tar.gz
      - name: Upload same-run bottle bundle
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottle-${{ matrix.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  assemble:
    name: assemble digest-bound publication bundle
    needs: [verify, bottle]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      assembly_attempt: ${{ steps.assemble.outputs.assembly_attempt }}
    steps:
      - name: Configure Linuxbrew command path
        shell: bash
        run: |
          set -euo pipefail
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          echo /home/linuxbrew/.linuxbrew/bin >>"$GITHUB_PATH"
      - name: Checkout protected publisher verifier only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download only this run's bottle artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bottle-*-${{ github.run_id }}-*
          path: bottles
      - name: Verify handoffs and merge bottle blocks without credentials
        id: assemble
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S publisher/verify_handoffs.py --directory bottles \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --expected-tag sequoia --expected-tag arm64_sequoia \
            --expected-tag x86_64_linux --expected-tag arm64_linux \
            --selected-directory selected \
            --formula-output Formula/mcp-cpp-sdk.rb \
            --output bottle-ledger.json
          brew bottle --merge --write --no-commit selected/*/*.bottle.json
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID/artifacts?per_page=100" \
            >artifact-pages.json
          python3 -I -S publisher/publication.py bind-artifacts \
            --ledger bottle-ledger.json --artifacts artifact-pages.json \
            --output bottle-ledger.bound.json
          mkdir publication
          cp Formula/mcp-cpp-sdk.rb publication/
          cp bottle-ledger.bound.json publication/bottle-ledger.json
          cp selected/*/*.bottle.json selected/*/*.bottle*.tar.gz publication/
          mkdir publication/publisher
          cp publisher/*.py publication/publisher/
          python3 -I -S publisher/publication.py create-checksums \
            --directory publication --output publication/SHA256SUMS
          echo "assembly_attempt=$RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
      - name: Upload one same-run publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish:
    name: upload bottles and update exact formula branch
    needs: [verify, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: homebrew-publish
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      bottled_head_sha: ${{ steps.update.outputs.bottled_head_sha }}
      publish_run_attempt: ${{ steps.update.outputs.publish_run_attempt }}
    steps:
      - name: Configure Linuxbrew command path
        shell: bash
        run: |
          set -euo pipefail
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          echo /home/linuxbrew/.linuxbrew/bin >>"$GITHUB_PATH"
      - name: Download only this run's verified publication bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication-bundle-${{ github.run_id }}-${{ needs.assemble.outputs.assembly_attempt }}
          path: publication
      - name: Verify publication bytes and exact fresh or idempotent branch state
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.verify.outputs.formula_branch }}
          EXPECTED_HEAD: ${{ needs.verify.outputs.formula_head_sha }}
          PR: ${{ needs.verify.outputs.formula_pr_number }}
          SOURCE_TAG: ${{ needs.verify.outputs.source_tag }}
        run: |
          set -euo pipefail
          python3 -I -S publication/publisher/publication.py verify-checksums \
            --directory publication --checksums publication/SHA256SUMS
          python3 -I -S publication/publisher/formula_branch.py verify-head --pr "$PR" \
            --branch "$BRANCH" --expected-head "$EXPECTED_HEAD" --tag "$SOURCE_TAG"
      - name: Upload exact bottles without contents credentials
        env:
          PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$PACKAGES_TOKEN" | docker login ghcr.io -u yurirocha15 --password-stdin
          brew pr-upload --warn-on-upload-failure \
            --root-url=https://ghcr.io/v2/yurirocha15/mcp-cpp-sdk \
            publication/*.bottle.json
      - name: Resolve every exact bottle tag anonymously before minting contents credentials
        run: |
          python3 -I -S publication/publisher/ghcr.py record \
            --ledger publication/bottle-ledger.json \
            --source-tag '${{ needs.verify.outputs.source_tag }}' \
            --output public-ghcr-ledger.json --timeout-seconds 600
      - name: Create repository-scoped publisher App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: yurirocha15
          repositories: homebrew-mcp-cpp-sdk
          permission-contents: write
          permission-pull-requests: read
      - name: Perform only the fixed idempotent formula API update
        id: update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ needs.verify.outputs.formula_branch }}
          EXPECTED_HEAD: ${{ needs.verify.outputs.formula_head_sha }}
          PR: ${{ needs.verify.outputs.formula_pr_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S publication/publisher/formula_branch.py update --pr "$PR" \
            --branch "$BRANCH" --expected-head "$EXPECTED_HEAD" \
            --tag '${{ needs.verify.outputs.source_tag }}' \
            --formula publication/mcp-cpp-sdk.rb --ledger public-ghcr-ledger.json \
            --output-ledger finalization-ledger.json --github-output "$GITHUB_OUTPUT" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
      - name: Assemble finalization evidence after contents token is gone
        run: |
          set -euo pipefail
          mkdir -p finalization/publisher
          cp finalization-ledger.json finalization/
          cp publication/publisher/*.py finalization/publisher/
          python3 -I -S finalization/publisher/publication.py create-checksums \
            --directory finalization --output finalization/SHA256SUMS
      - name: Retain same-run finalization evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finalization-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: finalization/
          if-no-files-found: error
          retention-days: 90

  finalize:
    name: protected same-run public verification and merge
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: homebrew-finalize
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Download only this original run's finalization ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: finalization-ledger-${{ github.run_id }}-${{ needs.publish.outputs.publish_run_attempt }}
          path: finalization
      - name: Revalidate exact head checks and every public GHCR tag without App credentials
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.verify.outputs.formula_pr_number }}
          BRANCH: ${{ needs.verify.outputs.formula_branch }}
          EXPECTED_HEAD: ${{ needs.publish.outputs.bottled_head_sha }}
          RUN_ID: ${{ github.run_id }}
          EXPECTED_PUBLISH_ATTEMPT: ${{ needs.publish.outputs.publish_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S finalization/publisher/publication.py verify-checksums \
            --directory finalization --checksums finalization/SHA256SUMS
          python3 -I -S finalization/publisher/publication.py verify-finalization \
            --ledger finalization/finalization-ledger.json --run-id "$RUN_ID" \
            --publish-attempt "$EXPECTED_PUBLISH_ATTEMPT" --expected-head "$EXPECTED_HEAD"
          python3 -I -S finalization/publisher/formula_branch.py verify-head --pr "$PR" \
            --branch "$BRANCH" --expected-head "$EXPECTED_HEAD" \
            --tag '${{ needs.verify.outputs.source_tag }}'
          timeout 8m gh pr checks "$PR" --repo yurirocha15/homebrew-mcp-cpp-sdk \
            --required --watch --interval 15
          python3 -I -S finalization/publisher/ghcr.py verify \
            --ledger finalization/finalization-ledger.json
      - name: Create repository-scoped publisher App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: yurirocha15
          repositories: homebrew-mcp-cpp-sdk
          permission-contents: write
          permission-pull-requests: write
      - name: Perform only the fixed exact-head merge API calls
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ needs.verify.outputs.formula_pr_number }}
          BRANCH: ${{ needs.verify.outputs.formula_branch }}
          EXPECTED_HEAD: ${{ needs.publish.outputs.bottled_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S finalization/publisher/formula_branch.py merge --pr "$PR" \
            --branch "$BRANCH" --expected-head "$EXPECTED_HEAD"
