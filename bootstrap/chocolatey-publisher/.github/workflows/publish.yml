name: publish-chocolatey

on:
  workflow_dispatch:
    inputs:
      source_tag:
        required: true
        type: string
      source_commit_sha:
        required: true
        type: string
      source_workflow_head_sha:
        required: true
        type: string
      provider_control_sha:
        required: true
        type: string
      github_release_id:
        required: true
        type: string
      source_workflow_run_id:
        required: true
        type: string
      release_manifest_sha256:
        required: true
        type: string
      request_uuid:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chocolatey-publishing
  cancel-in-progress: false

jobs:
  control:
    name: verify immutable provider control context
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the exact immutable control tag and commit
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.provider_control_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/tags/release-control-v1
          test "$GITHUB_SHA" = "$EXPECTED_CONTROL_SHA"
          test "$GITHUB_WORKFLOW_REF" = \
            'yurirocha15/mcp-cpp-sdk-chocolatey-publisher/.github/workflows/publish.yml@refs/tags/release-control-v1'

  verify:
    name: verify signed immutable Chocolatey input
    needs: control
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.input.outputs.version }}
      package_name: ${{ steps.package.outputs.package_name }}
      package_sha256: ${{ steps.package.outputs.package_sha256 }}
      artifact_name: ${{ steps.handoff.outputs.artifact_name }}
      publisher_client_sha256: ${{ steps.handoff.outputs.publisher_client_sha256 }}
      identity_sha256: ${{ steps.handoff.outputs.identity_sha256 }}
    steps:
      - name: Checkout protected publisher controls only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the exact dispatch schema
        id: input
        env:
          DISPATCH_JSON: >-
            {"source_tag":${{ toJSON(inputs.source_tag) }},"source_commit_sha":${{ toJSON(inputs.source_commit_sha) }},"source_workflow_head_sha":${{ toJSON(inputs.source_workflow_head_sha) }},"provider_control_sha":${{ toJSON(inputs.provider_control_sha) }},"github_release_id":${{ toJSON(inputs.github_release_id) }},"source_workflow_run_id":${{ toJSON(inputs.source_workflow_run_id) }},"release_manifest_sha256":${{ toJSON(inputs.release_manifest_sha256) }},"request_uuid":${{ toJSON(inputs.request_uuid) }}}
        run: python3 -I -S publisher/validate_dispatch.py
      - name: Verify source repository, immutable release, and completed source run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.input.outputs.source_tag }}
          COMMIT: ${{ steps.input.outputs.source_commit_sha }}
          SOURCE_WORKFLOW_HEAD_SHA: ${{ steps.input.outputs.source_workflow_head_sha }}
          RELEASE_ID: ${{ inputs.github_release_id }}
          SOURCE_RUN_ID: ${{ inputs.source_workflow_run_id }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          SOURCE_OWNER_ID: ${{ vars.SOURCE_OWNER_ID }}
        run: >-
          python3 -I -S publisher/source_run.py
          --run-id "$SOURCE_RUN_ID"
          --workflow-head-sha "$SOURCE_WORKFLOW_HEAD_SHA"
          --repository-id "$SOURCE_REPOSITORY_ID"
          --owner-id "$SOURCE_OWNER_ID"
          --tag "$TAG"
          --release-id "$RELEASE_ID"
          --timeout-seconds 3600
      - name: Verify the signed annotated source tag
        env:
          TAG: ${{ steps.input.outputs.source_tag }}
          COMMIT: ${{ steps.input.outputs.source_commit_sha }}
          PRIMARY_FINGERPRINT: ${{ vars.SOURCE_SIGNING_PRIMARY_FINGERPRINT }}
          TAG_FINGERPRINT: ${{ vars.SOURCE_TAG_SIGNING_SUBKEY_FINGERPRINT }}
        run: |
          gpg --batch --import keys/release-signing-key.asc
          git init --bare source.git
          git -C source.git fetch --no-tags --depth=1 https://github.com/yurirocha15/mcp-cpp-sdk.git \
            "refs/tags/${TAG}:refs/tags/${TAG}"
          git -C source.git fetch --no-tags https://github.com/yurirocha15/mcp-cpp-sdk.git \
            "refs/heads/main:refs/heads/main"
          test "$(git -C source.git cat-file -t "${TAG}")" = tag
          git -C source.git verify-tag --raw "${TAG}" 2> tag.status
          test "$(git -C source.git rev-list -n1 "${TAG}")" = "${COMMIT}"
          git -C source.git merge-base --is-ancestor "${COMMIT}" refs/heads/main
          python3 -I -S publisher/verify_git_status.py tag.status \
            "${TAG_FINGERPRINT}" "${PRIMARY_FINGERPRINT}"
      - name: Download and independently verify the release package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.input.outputs.source_tag }}
          COMMIT: ${{ steps.input.outputs.source_commit_sha }}
          MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
          PRIMARY_FINGERPRINT: ${{ vars.SOURCE_SIGNING_PRIMARY_FINGERPRINT }}
          ARTIFACT_FINGERPRINT: ${{ vars.SOURCE_ARTIFACT_SIGNING_SUBKEY_FINGERPRINT }}
        run: |
          mkdir release-assets
          gh release download "${TAG}" --repo yurirocha15/mcp-cpp-sdk --dir release-assets
          python3 -I -S publisher/verify_release.py \
            --directory release-assets --tag "${TAG}" --commit "${COMMIT}" \
            --manifest-sha256 "${MANIFEST_SHA256}" \
            --primary-fingerprint "${PRIMARY_FINGERPRINT}" \
            --artifact-fingerprint "${ARTIFACT_FINGERPRINT}" \
            --public-key keys/release-signing-key.asc
      - name: Create a digest-bound same-run handoff
        id: handoff
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
          PACKAGE_SHA256: ${{ steps.package.outputs.package_sha256 }}
          TAG: ${{ steps.input.outputs.source_tag }}
          COMMIT: ${{ steps.input.outputs.source_commit_sha }}
          MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
          REQUEST_UUID: ${{ inputs.request_uuid }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python3 -I -S publisher/handoff.py
          --source-package "release-assets/${PACKAGE_NAME}"
          --output-directory submission --source-tag "${TAG}"
          --source-commit-sha "${COMMIT}"
          --release-manifest-sha256 "${MANIFEST_SHA256}"
          --package-name "${PACKAGE_NAME}" --package-sha256 "${PACKAGE_SHA256}"
          --request-uuid "${REQUEST_UUID}" --run-id "${RUN_ID}"
          --run-attempt "${RUN_ATTEMPT}"
          --publisher-client publisher/push_package.ps1
          --github-output "${GITHUB_OUTPUT}"
      - name: Upload the verified same-run package handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.handoff.outputs.artifact_name }}
          path: submission/
          if-no-files-found: error
          retention-days: 30
      - name: Emit a complete public approval summary
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
          PACKAGE_SHA256: ${{ steps.package.outputs.package_sha256 }}
        run: |
          {
            echo '## Approved Chocolatey submission'
            echo
            echo "- Source: ${{ steps.input.outputs.source_tag }} at ${{ steps.input.outputs.source_commit_sha }}"
            echo "- Immutable release ID: ${{ inputs.github_release_id }}"
            echo "- Release manifest SHA-256: ${{ inputs.release_manifest_sha256 }}"
            echo "- Package: ${PACKAGE_NAME}"
            echo "- Package SHA-256: ${PACKAGE_SHA256}"
            echo "- Request: ${{ inputs.request_uuid }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  claim:
    name: claim the exact submission identity without credentials
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    outputs:
      issue_number: ${{ steps.claim.outputs.issue_number }}
      already_submitted: ${{ steps.claim.outputs.already_submitted }}
    steps:
      - name: Checkout protected claim controls only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create, skip, or fail closed on the submission claim
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          PACKAGE_SHA256: ${{ needs.verify.outputs.package_sha256 }}
          TAG: ${{ inputs.source_tag }}
          COMMIT: ${{ inputs.source_commit_sha }}
          MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
          REQUEST_UUID: ${{ inputs.request_uuid }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.sha }}
          AUTOMATION_USER_ID: ${{ vars.CHOCOLATEY_SUBMISSION_AUTOMATION_USER_ID }}
          AUTOMATION_LOGIN: ${{ vars.CHOCOLATEY_SUBMISSION_AUTOMATION_LOGIN }}
        run: >-
          python3 -I -S publisher/claim_controller.py manage
          --github-output "${GITHUB_OUTPUT}"

  publish:
    name: push the exact package with the isolated API key
    if: ${{ needs.claim.outputs.already_submitted != 'true' }}
    needs: [verify, claim]
    runs-on: windows-2025
    timeout-minutes: 10
    environment: chocolatey-publish
    permissions:
      contents: read
    steps:
      - name: Download only this run's verified package handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: submission
      - name: Verify the trusted preinstalled Chocolatey CLI
        env:
          EXPECTED_CHOCOLATEY_VERSION: '2.7.3'
          EXPECTED_PUBLISHER_CLIENT_SHA256: ${{ needs.verify.outputs.publisher_client_sha256 }}
        shell: pwsh
        run: '& submission/push_package.ps1 -Mode Preflight'
      - name: Verify handoff and push as the final credential-bearing step
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          EXPECTED_PACKAGE: ${{ needs.verify.outputs.package_name }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.package_sha256 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_TAG: ${{ inputs.source_tag }}
          EXPECTED_COMMIT: ${{ inputs.source_commit_sha }}
          EXPECTED_MANIFEST: ${{ inputs.release_manifest_sha256 }}
          EXPECTED_REQUEST_UUID: ${{ inputs.request_uuid }}
          EXPECTED_CHOCOLATEY_VERSION: '2.7.3'
          EXPECTED_PUBLISHER_CLIENT_SHA256: ${{ needs.verify.outputs.publisher_client_sha256 }}
          EXPECTED_IDENTITY_SHA256: ${{ needs.verify.outputs.identity_sha256 }}
        shell: pwsh
        run: '& submission/push_package.ps1 -Mode Publish'

  record:
    name: record an exact completed submission without credentials
    if: >-
      always() && needs.verify.result == 'success' && needs.claim.result == 'success' &&
      (needs.claim.outputs.already_submitted == 'true' || needs.publish.result == 'success')
    needs: [verify, claim, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout protected claim controls only
        if: ${{ needs.claim.outputs.already_submitted != 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mark a newly pushed package as submitted
        if: ${{ needs.claim.outputs.already_submitted != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.claim.outputs.issue_number }}
          PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          PACKAGE_SHA256: ${{ needs.verify.outputs.package_sha256 }}
          TAG: ${{ inputs.source_tag }}
          COMMIT: ${{ inputs.source_commit_sha }}
          MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
          REQUEST_UUID: ${{ inputs.request_uuid }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.sha }}
          AUTOMATION_USER_ID: ${{ vars.CHOCOLATEY_SUBMISSION_AUTOMATION_USER_ID }}
          AUTOMATION_LOGIN: ${{ vars.CHOCOLATEY_SUBMISSION_AUTOMATION_LOGIN }}
        run: >-
          python3 -I -S publisher/claim_controller.py record
          --issue-number "${ISSUE_NUMBER}"
      - name: Report an identical prior submission
        if: ${{ needs.claim.outputs.already_submitted == 'true' }}
        run: echo 'The exact package was already recorded as submitted.'
