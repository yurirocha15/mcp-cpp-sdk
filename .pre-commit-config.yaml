# Upstream test data, recorded verdicts and the differences listed against them keep the bytes
# their sources and tools write.
exclude: ^(test/data/json-schema(-meta)?/|test/data/schema-(goldens|engine-differences)\.json$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: CMakeUserPresets.json
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.1
    hooks:
      - id: clang-format
        # Signed release files kept byte for byte, and JSON that npm and gen_json_matrix.py write.
        exclude: ^(test/release/fixtures/|conformance/runner(-alpha)?/package-lock\.json$|test/core/json_matrix_manifest\.json$)

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.10
    hooks:
    - id: cmake-format
    - id: cmake-lint
